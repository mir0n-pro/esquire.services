image:
  repository: esquire.kcmaster
  tag: latest
  pullPolicy: IfNotPresent

# HA scheduling (pre-HA defaults: no node pinning, no spread). The OKE overlay sets
# nodeSelector.tier=app and turns topologySpread on to place the x2 replicas on
# distinct app-tier nodes; local (single node) leaves both off.
nodeSelector: {}
topologySpread:
  enabled: false

springProfilesActive: console

# shared bus topology is delivered by the esquire-topology ConfigMap, mounted at /etc/esquire.
topologyImport: optional:file:/etc/esquire/topology.yml

# v1.2.10 VT (UNVALIDATED test lever, default OFF -- see HA doc 5.5)
esqVirtualThreads: "false"        # ESQ_VIRTUAL_THREADS (spring.threads.virtual.enabled, request path)

service:
  port: 3006

keycloak:
  # KC serves under HTTP_RELATIVE_PATH=/kc-auth in the infra-kc chart;
  # kcMaster's Keycloak admin client (KeycloakBuilder) must hit
  # base + /realms/{realm}/... so the /kc-auth prefix has to be in baseUrl.
  baseUrl: http://esquire-infra-kc-keycloak:8080/kc-auth
  realm: esquire
  # Confidential service-account client seeded into the esquire realm import;
  # admin-cli is a public client (no secret, no client_credentials support) and
  # cannot drive the KC admin REST API. Matches the compose default.
  adminClientId: esq-kcMaster
  # adminClientSecret -> kc-admin-client-secret Secret, injected as env in the deployment.
  adminClientSecret: MHgq0Nu69u2uJ2johaK1wxQLMdakELXN

# path-buffer: in-flight KC path-sync de-dup window.
pathBuffer:
  ttlMs: "10000"
  pruneMs: "30000"

# kc-bus ref: kcMaster is the SERVER (receives KC requests, publishes responses).
kc:
  busId: esquire.kc
  slotId: kc
  requestPoolSize: "4"
  requestConcurrency: "1"
  responsePublisherPoolSize: "0"
  # producer send-retry on the KC R&R bus; pre-HA default OFF (OKE). The local-k8s overlay turns it on (block mode).
  sendRetry: "false"
  sendRetryBackoff: "1,2,5,5"
  sendRetryMaxAttempts: "0"
  poolMode: "platform"            # KC_POOL_MODE (platform | virtual | virtual-per-task, default platform)

# entity-bus ref: kcMaster is a CONSUMER of the entity broadcast.
entity:
  busId: esquire.entity
  slotId: entity
  broadcastPoolSize: "4"
  broadcastConcurrency: "1"
  poolMode: "platform"            # ENTITY_BROADCAST_POOL_MODE (platform | virtual | virtual-per-task, default platform)

logging:
  levelRoot: ERROR
  levelSf: ERROR
  levelMir0n: DEBUG
  levelDevelop: DEBUG
  levelMsg: DEBUG
  levelAmq: INFO
  levelJms: INFO
  developLogPath: /tmp/kcMaster-develop.log
  msgLogPath: /tmp/kcMaster-msg.log
