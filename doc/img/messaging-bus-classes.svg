  <rect x="317" y="116" width="226" height="28" rx="6" fill="#eef2f7" stroke="#4D6A8D" stroke-width="1.3"/><text x="430" y="134" text-anchor="middle" fill="#1f2a36">MessagingBus</text>
  <rect x="317" y="152" width="226" height="28" rx="6" fill="#eef2f7" stroke="#4D6A8D" stroke-width="1.3"/><text x="430" y="170" text-anchor="middle" fill="#1f2a36">BusSlot</text>
  <rect x="317" y="188" width="226" height="28" rx="6" fill="#eef2f7" stroke="#4D6A8D" stroke-width="1.3"/><text x="430" y="206" text-anchor="middle" fill="#1f2a36">XRodParams</text>
  <rect x="317" y="224" width="226" height="28" rx="6" fill="#eef2f7" stroke="#4D6A8D" stroke-width="1.3"/><text x="430" y="242" text-anchor="middle" fill="#1f2a36">BusTransport</text>
  <rect x="317" y="260" width="226" height="28" rx="6" fill="#eef2f7" stroke="#4D6A8D" stroke-width="1.3"/><text x="430" y="278" text-anchor="middle" fill="#1f2a36">BusRef</text>
  <rect x="317" y="296" width="226" height="28" rx="6" fill="#eef2f7" stroke="#4D6A8D" stroke-width="1.3"/><text x="430" y="314" text-anchor="middle" fill="#1f2a36">Role  (enum)</text>

