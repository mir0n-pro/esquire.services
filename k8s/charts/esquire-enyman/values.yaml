image:
  repository: esquire.enyman
  tag: latest
  pullPolicy: IfNotPresent

# Hard cap is 10 -- v1.2.6 id encoding allocates one decimal digit for
# the instance number (EsqUtils.instanceNo, range 0-9). The chart's
# deployment template fails the release if this value > 10, and
# values.schema.json enforces the same bound at `helm install/upgrade`.
replicaCount: 1

springProfilesActive: "console,dev-postgres"

service:
  port: 3003

db:
  vendor: dev-postgres
  host: esquire-infra-postgres
  port: 5432
  name: esq2025
  username: esq2025
  password: q

messaging:
  brokerUrl: tcp://esquire-infra-amq-activemq:61616
  clientId: enyman
  consumerEnabled: "false"

logging:
  levelRoot: ERROR
  levelSf: ERROR
  levelMir0n: DEBUG
  levelDevelop: DEBUG
  levelMsg: DEBUG
  developLogPath: /tmp/enyMan-develop.log
  msgLogPath: /tmp/enyMan-msg.log

# Default deploy topology = option (c): producers publish committed audit events to the bus
# (ActiveMQ, already in the stack) and the esquire-xxrod consumer drains it to the *_log tables.
# Switch topology here without code changes:
#   (b) in-process: mode=in-process     (no xxRod; producer writes *_log directly)
#   (d) redis:      mode=redis, redisHost=esq-redis  (deploy a redis -- do NOT name the svc 'redis')
#   (c) over Kafka: busTransport=kafka, kafkaBootstrap=...  (deploy Kafka + xxRod transport=kafka)
audit:
  enabled: true
  mode: bus
  busTransport: activemq
  publisherPoolSize: 4
  redisHost: ""
  kafkaBootstrap: esquire-infra-kafka:9092
