apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secret
  labels:
    app: {{ .Release.Name }}
type: Opaque
data:
  # The ward's load-side database password (the gate alone never needed one).
  db-password: {{ .Values.db.password | b64enc | quote }}
{{- if .Values.tokenRelay.phantom.exchangeClientSecret }}
  # Phantom Token Relay: the gate's confidential client secret used to authenticate
  # to KC /token for the RFC 8693 token-exchange call.
  exchange-client-secret: {{ .Values.tokenRelay.phantom.exchangeClientSecret | b64enc | quote }}
{{- end }}
