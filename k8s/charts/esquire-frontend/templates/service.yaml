apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-frontend
  labels:
    app: {{ .Release.Name }}-frontend
spec:
  type: {{ .Values.service.type | default "LoadBalancer" }}
  selector:
    app: {{ .Release.Name }}-frontend
  ports:
    - port: {{ .Values.service.lbPort }}
      targetPort: {{ .Values.service.port }}
