image:
  repository: esquire.kcmaster
  tag: latest
  pullPolicy: IfNotPresent

service:
  port: 3006

messaging:
  brokerUrl: tcp://esquire-infra-amq-activemq:61616
  clientId: kcmaster

keycloak:
  baseUrl: http://esquire-infra-kc-keycloak:8080
  realm: esquire
  adminClientId: admin-cli
  adminClientSecret: ""

logging:
  levelRoot: ERROR
  levelSf: ERROR
  levelMir0n: DEBUG
  levelDevelop: DEBUG
  levelMsg: DEBUG
  developLogPath: /tmp/kcMaster-develop.log
  msgLogPath: /tmp/kcMaster-msg.log
