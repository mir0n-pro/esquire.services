{{- $replicas := int (.Values.replicaCount | default 1) -}}
{{- if gt $replicas 10 -}}
{{- fail (printf "esquire-enyman: replicaCount=%d exceeds the cap of 10. v1.2.6 entity-id encoding allocates one decimal digit for the instance number (0-9); higher replica counts would overflow the time portion of generated ids." $replicas) -}}
{{- end -}}
{{- if lt $replicas 1 -}}
{{- fail (printf "esquire-enyman: replicaCount=%d must be >= 1" $replicas) -}}
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-enyman
  labels:
    app: {{ .Release.Name }}-enyman
spec:
  serviceName: {{ .Release.Name }}-enyman-hl
  replicas: {{ $replicas }}
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: {{ .Release.Name }}-enyman
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-enyman
    spec:
      containers:
        - name: enyman
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["java", "-jar", "app.jar"]
          ports:
            - containerPort: {{ .Values.service.port }}
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-enyman-config
          env:
            - name: DB_ENYMAN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-enyman-secret
                  key: db-password
            # Downward API -- feeds EsqUtils.instanceNo() so each pod
            # mints ids in its own slice of the bottom 4 digits.
            # POD_INDEX is k8s 1.28+; POD_NAME is the universal fallback
            # (EsqUtils parses the trailing StatefulSet ordinal).
            - name: POD_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['apps.kubernetes.io/pod-index']
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.service.port }}
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.service.port }}
            initialDelaySeconds: 40
            periodSeconds: 15
            timeoutSeconds: 5
