apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-dashboards
  labels:
    app: {{ .Release.Name }}
data:
  # The dashboard provider: load any *.json in this dir under the "Esquire" folder.
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: Esquire
        orgId: 1
        folder: Esquire
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /etc/grafana/provisioning/dashboards
          foldersFromFilesStructure: false
  # The "Esquire Services" dashboard (REST / JVM / pool / CPU), same as the docker stack.
  esquire-services.json: |-
{{ .Files.Get "dashboards/esquire-services.json" | indent 4 }}
