apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-kcmaster
  labels:
    app: {{ .Release.Name }}-kcmaster
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-kcmaster
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-kcmaster
    spec:
      containers:
        - name: kcmaster
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["java", "-jar", "app.jar"]
          ports:
            - containerPort: {{ .Values.service.port }}
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-kcmaster-config
          env:
            - name: KC_ADMIN_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-kcmaster-secret
                  key: kc-admin-client-secret
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.service.port }}
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.service.port }}
            initialDelaySeconds: 40
            periodSeconds: 15
            timeoutSeconds: 5
          volumeMounts:
            - name: esquire-topology
              mountPath: /etc/esquire
              readOnly: true
      volumes:
        - name: esquire-topology
          configMap:
            name: esquire-topology
