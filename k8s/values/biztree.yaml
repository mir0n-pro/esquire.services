# Local k8s overlay for charts/esquire-biztree
# Chart defaults already match local dev needs (esquire.biztree image,
# IfNotPresent pull, dev-postgres + cache-h2 profile, DEBUG logging,
# in-cluster postgres / activemq hostnames). Only image.tag is restamped
# per rebuild here -- k8s-rebuild.bat patches it.
image:
  tag: "v1.2.10-2606.270308"

# v1.2.10 redundancy: run 2 replicas (StatefulSet ordinal identity)
replicaCount: 2
