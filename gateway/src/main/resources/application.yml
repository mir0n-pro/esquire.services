            - name: Retry
              args:
                # WRITE: non-idempotent -- retry on connect-failure ONLY (request
                # provably never landed). Empty series + ConnectException-only means
                # a response-timeout / 5xx / reset never resends the POST.
                retries: ${esq.gateway.resilience.retry.write.attempts}
