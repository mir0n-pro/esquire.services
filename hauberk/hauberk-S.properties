# Vanilla Token Relay overlay (deltas only; base URLs inherit from hauberk.properties = docker).
#
# The harness presents HTTP Basic at the edge as esq-hauberk-S; the gateway runs the client_credentials
# grant on the client's behalf, caches per client_id, and forwards a full JWT downstream. Requires the
# gateway's vanilla allowlist (ESQ_GW_VANILLA_CLIENTS) to include esq-hauberk-S -- which the compose /
# chart config already does. Lights esq.biz.gw.tokenrelay.* (result=hit|miss, outcome=ok).
#
#   Run:  hauberk.cmd run super-load --config hauberk-S.properties
#
# (For a k8s run, combine with the k8s base by also overriding kc.base / gw.base / bff.base here, or run
#  the relay via the e2e gate which covers both targets.)

tokenRelay.type=vanilla
kc.client.id=esq-hauberk-S
kc.client.secret=esq-hauberk-s-dev-secret-rotate-in-prod
