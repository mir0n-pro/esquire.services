<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 566" font-family="Calibri, Segoe UI, sans-serif">
  <defs>
    <marker id="arw" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" refX="10" refY="4.5" orient="auto">
      <path d="M0,0 L10,4.5 L0,9 Z" fill="#6ca43d"/>
    </marker>
    <marker id="arwo" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" refX="10" refY="4.5" orient="auto">
      <path d="M0,0 L10,4.5 L0,9 Z" fill="#ffffff" stroke="#6ca43d" stroke-width="1.2"/>
    </marker>
    <marker id="arwb" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" refX="10" refY="4.5" orient="auto">
      <path d="M0,0 L10,4.5 L0,9 Z" fill="#c55a11"/>
    </marker>
  </defs>
  <style>
    .hdr{fill:#5b9bd5;stroke:#41719c;stroke-width:1.5}
    .hdrtxt{fill:#ffffff;font-weight:bold;font-size:15px}
    .life{stroke:#5592c9;stroke-width:1.2;stroke-dasharray:4,3}
    .msg{stroke:#6ca43d;stroke-width:1.7;fill:none;marker-end:url(#arw)}
    .ret{stroke:#6ca43d;stroke-width:1.3;fill:none;stroke-dasharray:6,3;marker-end:url(#arwo)}
    .bus{stroke:#c55a11;stroke-width:1.7;fill:none;stroke-dasharray:8,3;marker-end:url(#arwb)}
    .mt{fill:#2b2b2b;font-size:12.5px}
    .note{fill:#fff3cd;stroke:#e0c068;stroke-width:1}
    .nt{fill:#5b4a00;font-size:12px}
    .title{fill:#1f3864;font-size:18px;font-weight:bold}
    .sec{fill:#1f3864;font-size:12.5px;font-weight:bold}
    .stk1{fill:#9ec3e6;stroke:#5a8bc0;stroke-width:1}
    .stk2{fill:#c5daf0;stroke:#7ba7d4;stroke-width:1}
    .xn{fill:#dbe9f7;font-size:10px}
    .leg{fill:#eef2f7;stroke:#c9d6e5;stroke-width:1}
    .legt{fill:#404040;font-size:11.5px}
    .legb{fill:#1f3864;font-size:11.5px;font-weight:bold}
    .box{fill:#5b9bd5;stroke:#41719c;stroke-width:1.5}
    .boxs{fill:#dbe9f7;font-size:11px}
    .busbox{fill:#fbe5d6;stroke:#c55a11;stroke-width:1.2}
    .bust{fill:#843c0c;font-size:12.5px;font-weight:bold}
    .bussub{fill:#843c0c;font-size:11px}
    .lbl{fill:#2b2b2b;font-size:11.5px}
  </style>

  <text class="title" x="20" y="28">Who keeps the sign-in and the claims -- the collaboration</text>
  <rect class="stk2" x="48" y="70" width="170" height="50" rx="5"/><rect class="stk1" x="44" y="75" width="170" height="50" rx="5"/><rect class="box" x="40" y="80" width="170" height="50" rx="5"/><text class="hdrtxt" x="125" y="102" text-anchor="middle">keySmith</text><text class="boxs" x="125" y="119" text-anchor="middle">access profile (esq_auth)</text><text class="xn" x="204" y="91" text-anchor="end">xN</text>
  <rect class="busbox" x="265" y="80" width="200" height="50" rx="18"/><text class="bust" x="365" y="103" text-anchor="middle">IAM request bus</text><text class="bussub" x="365" y="119" text-anchor="middle">URQ: create / update / delete</text>
  <rect class="stk2" x="528" y="70" width="170" height="50" rx="5"/><rect class="stk1" x="524" y="75" width="170" height="50" rx="5"/><rect class="box" x="520" y="80" width="170" height="50" rx="5"/><text class="hdrtxt" x="605" y="102" text-anchor="middle">kcMaster</text><text class="boxs" x="605" y="119" text-anchor="middle">the only KeyCloak writer</text><text class="xn" x="684" y="91" text-anchor="end">xN</text>
  <rect class="box" x="760" y="80" width="200" height="50" rx="5"/><text class="hdrtxt" x="860" y="102" text-anchor="middle">KeyCloak</text><text class="boxs" x="860" y="119" text-anchor="middle">login id, email, credential</text>
  <polyline class="msg" points="212,98 261,98"/>
  <polyline class="msg" points="467,98 516,98"/>
  <polyline class="msg" points="692,105 756,105"/>
  <polyline class="ret" points="520,122 467,122"/>
  <polyline class="ret" points="265,122 214,122"/>
  <text class="lbl" x="365" y="150" text-anchor="middle">URS done / reject -&gt; the originating keySmith (rod-id)</text>
  <rect class="stk2" x="48" y="250" width="170" height="50" rx="5"/><rect class="stk1" x="44" y="255" width="170" height="50" rx="5"/><rect class="box" x="40" y="260" width="170" height="50" rx="5"/><text class="hdrtxt" x="125" y="282" text-anchor="middle">enyMan</text><text class="boxs" x="125" y="299" text-anchor="middle">entity + move</text><text class="xn" x="204" y="271" text-anchor="end">xN</text>
  <rect class="busbox" x="265" y="220" width="200" height="60" rx="18"/><text class="bust" x="365" y="248" text-anchor="middle">Claim Broadcast Bus</text><text class="bussub" x="365" y="264" text-anchor="middle">eviction (uid) -- broadcast</text>
  <rect class="stk2" x="528" y="215" width="170" height="50" rx="5"/><rect class="stk1" x="524" y="220" width="170" height="50" rx="5"/><rect class="box" x="520" y="225" width="170" height="50" rx="5"/><text class="hdrtxt" x="605" y="247" text-anchor="middle">gateway</text><text class="boxs" x="605" y="264" text-anchor="middle">claims cache, per replica</text><text class="xn" x="684" y="236" text-anchor="end">xN</text>
  <polyline class="bus" points="150,132 150,180 300,180 300,216"/>
  <text class="lbl" x="225" y="174" text-anchor="middle">after every save</text>
  <polyline class="bus" points="212,285 240,285 240,262 261,262"/>
  <text class="lbl" x="218" y="318" text-anchor="start">for every moved user</text>
  <polyline class="bus" points="467,250 516,250"/>
  <polyline class="msg" points="605,222 605,190 110,190 110,134"/>
  <text class="lbl" x="610" y="205" text-anchor="start">GET /esq-claims?loginId=  (cache miss)</text>
  <rect class="box" x="760" y="225" width="200" height="50" rx="5"/><text class="hdrtxt" x="860" y="247" text-anchor="middle">BFF / direct client</text><text class="boxs" x="860" y="264" text-anchor="middle">holds the token</text>
  <polyline class="msg" points="860,132 860,221"/>
  <text class="lbl" x="866" y="180" text-anchor="start">sign-in -&gt; token</text>
  <text class="lbl" x="866" y="195" text-anchor="start">(login id only)</text>
  <polyline class="msg" points="758,250 694,250"/>
  <text class="lbl" x="726" y="242" text-anchor="middle">token</text>
  <rect class="stk2" x="528" y="360" width="170" height="50" rx="5"/><rect class="stk1" x="524" y="365" width="170" height="50" rx="5"/><rect class="box" x="520" y="370" width="170" height="50" rx="5"/><text class="hdrtxt" x="605" y="392" text-anchor="middle">the services</text><text class="boxs" x="605" y="409" text-anchor="middle">REST and the biz bus</text><text class="xn" x="684" y="381" text-anchor="end">xN</text>
  <polyline class="msg" points="605,278 605,366"/>
  <text class="lbl" x="612" y="318" text-anchor="start">uid, root path, roles:</text>
  <text class="lbl" x="612" y="333" text-anchor="start">X-Esq-* headers (REST),</text>
  <text class="lbl" x="612" y="348" text-anchor="start">fields of the command (bus)</text>
  <rect class="box" x="40" y="370" width="170" height="50" rx="5"/><text class="hdrtxt" x="125" y="392" text-anchor="middle">esq2025</text><text class="boxs" x="125" y="409" text-anchor="middle">the source of truth</text>
  <polyline class="msg" points="125,314 125,366"/>
  <text class="lbl" x="132" y="345" text-anchor="start">ep_path</text>
  <polyline class="msg" points="38,105 24,105 24,395 36,395"/>
  <text class="lbl" x="0" y="0" text-anchor="middle" transform="translate(18,250) rotate(-90)">esq_auth, roles -- written and read</text>
  <rect class="leg" x="20" y="474" width="960" height="72" rx="5"/>
  <text class="legt" x="30" y="496"><tspan class="legb">Redundancy:</tspan> every service runs at N replicas (stacked). A URQ is taken by one kcMaster, and its reply goes back to the keySmith</text>
  <text class="legt" x="30" y="513">that sent it. A claims eviction reaches every gateway replica, because each one keeps its own cache. A dashed orange arrow is a bus broadcast.</text>
  <text class="legt" x="30" y="530">KeyCloak holds no Esquire data, so a move or a role change needs no KeyCloak write -- only the eviction.</text>
</svg>
