# Grafana at http://grafana.localhost (ingress-nginx, host-based, mirrors cluster/ingress.yaml).
# OFF on a cloud target: ingress-nginx routes on the Host header, so a rule here is reachable
# from the internet whatever the name resolves to. The OKE arms set ingress.enabled=false and
# reach the boards through kubectl port-forward instead.
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}
                port:
                  number: 3000
{{- end }}
