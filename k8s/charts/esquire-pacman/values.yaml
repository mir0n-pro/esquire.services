image:
  repository: esquire.pacman
  tag: latest
  pullPolicy: IfNotPresent

springProfilesActive: "console,dev-postgres"

# shared bus topology is delivered by the esquire-topology ConfigMap, mounted at /etc/esquire.
topologyImport: file:/etc/esquire/topology.yml

service:
  port: 3003

db:
  vendor: dev-postgres
  host: esquire-infra-postgres
  port: 5432
  name: esq2025
  username: esq2025
  password: q

# entity-bus ref: pacMan is the PUBLISHER (broadcasts entity changes onto the bus).
entity:
  busId: esquire.entity
  serviceId: entity
  broadcastPublisherPoolSize: "0"

# audit: default k8s sink = (c) over the bus (ActiveMQ); esquire-aukeep drains it to the *_log tables.
# Switch to in-process (b) with busId=audit-b (the datasource block below is the *_log datastore).
audit:
  busId: audit-c
  serviceId: audit
  poolSize: "4"
  feedCapacity: "4096"
  virtualThreads: "false"
  datasource:
    # shared=true -> the keep reuses the SERVICE's own datasource pool; false -> a dedicated keep pool (url below)
    shared: "false"
    url: jdbc:postgresql://esquire-infra-postgres:5432/esq2025
    username: esq2025
    poolSize: "2"

logging:
  levelRoot: ERROR
  levelSf: ERROR
  levelMir0n: DEBUG
  levelDevelop: DEBUG
  levelMsg: DEBUG
  levelAmq: INFO
  levelJms: INFO
  developLogPath: /tmp/pacMan-develop.log
  msgLogPath: /tmp/pacMan-msg.log
