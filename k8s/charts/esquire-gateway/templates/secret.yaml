{{- if .Values.tokenRelay.phantom.exchangeClientSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-gateway-secret
  labels:
    app: {{ .Release.Name }}-gateway
type: Opaque
data:
  # Phantom Token Relay: gateway's confidential client secret used to
  # authenticate to KC /token for the RFC 8693 token-exchange call.
  exchange-client-secret: {{ .Values.tokenRelay.phantom.exchangeClientSecret | b64enc | quote }}
{{- end -}}
