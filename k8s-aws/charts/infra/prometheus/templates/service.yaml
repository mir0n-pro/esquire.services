apiVersion: v1
kind: Service
metadata:
  # service name == release name (esquire-infra-prometheus) so Grafana queries it at
  # http://esquire-infra-prometheus:9090.
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  type: ClusterIP
  selector:
    app: {{ .Release.Name }}
  ports:
    - name: http
      port: 9090
      targetPort: 9090
