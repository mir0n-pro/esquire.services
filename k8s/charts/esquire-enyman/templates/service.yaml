# Two services for the StatefulSet:
#   * ClusterIP `{{ .Release.Name }}-enyman` -- the HTTP entrypoint
#     consumers (gateway, kcMaster, etc.) hit; kube-proxy load-balances
#     across pods.
#   * Headless `{{ .Release.Name }}-enyman-hl` -- governs StatefulSet pod
#     DNS (per-pod `<release>-enyman-N.<release>-enyman-hl`) so the
#     downward API ordinal stays stable. Not used for traffic.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-enyman
  labels:
    app: {{ .Release.Name }}-enyman
spec:
  type: ClusterIP
  selector:
    app: {{ .Release.Name }}-enyman
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-enyman-hl
  labels:
    app: {{ .Release.Name }}-enyman
spec:
  clusterIP: None
  selector:
    app: {{ .Release.Name }}-enyman
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
