<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 470" width="620" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 z" fill="#5b5b5b"/>
    </marker>
  </defs>

  <text x="40" y="34" font-weight="600" font-size="15" fill="#2b3a4b">Messaging Bus &#8212; the runtime path</text>

  <!-- layer stack -->
  <!-- L1 Service -->
  <rect x="40" y="56" width="360" height="46" rx="8" fill="#eef2f7" stroke="#4D6A8D" stroke-width="1.5"/>
  <text x="220" y="78" text-anchor="middle" font-weight="600" fill="#1f2a36">Service</text>
  <text x="220" y="94" text-anchor="middle" font-size="11" fill="#54627a">asks for a producer / consumer (busKey, role)</text>

  <!-- L2 XRodManager -->
  <rect x="40" y="118" width="360" height="46" rx="8" fill="#eef2f7" stroke="#4D6A8D" stroke-width="1.5"/>
  <text x="220" y="140" text-anchor="middle" font-weight="600" fill="#1f2a36">XRodManager</text>
  <text x="220" y="156" text-anchor="middle" font-size="11" fill="#54627a">the bus frontend &#8212; one bean per service</text>

  <!-- L3 IXRod pod -->
  <rect x="40" y="180" width="360" height="46" rx="8" fill="#eef2f7" stroke="#4D6A8D" stroke-width="1.5"/>
  <text x="220" y="202" text-anchor="middle" font-weight="600" fill="#1f2a36">IXRod pod &#8212; transmit + receive legs</text>
  <text x="220" y="218" text-anchor="middle" font-size="11" fill="#54627a">rod-class: XRod &#183; XRodRR &#183; XRodInfo &#183; XRodDisabled &#183; XRodInProcess</text>

  <!-- L4 codec -->
  <rect x="40" y="242" width="360" height="46" rx="8" fill="#eef2f7" stroke="#4D6A8D" stroke-width="1.5"/>
  <text x="220" y="264" text-anchor="middle" font-weight="600" fill="#1f2a36">RodEventCodec</text>
  <text x="220" y="280" text-anchor="middle" font-size="11" fill="#54627a">RodEvent &#8596; TransportMessage (header bag + key)</text>

  <!-- L5 SPI -->
  <rect x="40" y="304" width="360" height="46" rx="8" fill="#eef2f7" stroke="#4D6A8D" stroke-width="1.5"/>
  <text x="220" y="326" text-anchor="middle" font-weight="600" fill="#1f2a36">ITransportProvider</text>
  <text x="220" y="342" text-anchor="middle" font-size="11" fill="#54627a">the open transport-driver SPI</text>

  <!-- L6 driver -->
  <rect x="40" y="366" width="360" height="48" rx="8" fill="#4D6A8D" stroke="#3a5170" stroke-width="1.5"/>
  <text x="220" y="388" text-anchor="middle" font-weight="600" fill="#ffffff">Driver: tp-activemq &#183; tp-kafka &#183; tp-redis</text>
  <text x="220" y="404" text-anchor="middle" font-size="11" fill="#d7e0ea">broker wire: queue &#183; topic &#183; stream</text>

  <!-- down arrows -->
  <line x1="220" y1="102" x2="220" y2="116" stroke="#5b5b5b" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="220" y1="164" x2="220" y2="178" stroke="#5b5b5b" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="220" y1="226" x2="220" y2="240" stroke="#5b5b5b" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="220" y1="288" x2="220" y2="302" stroke="#5b5b5b" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="220" y1="350" x2="220" y2="364" stroke="#5b5b5b" stroke-width="1.4" marker-end="url(#ar)"/>

  <!-- bus catalog feeding the manager -->
  <rect x="440" y="118" width="150" height="108" rx="8" fill="#f7f9fb" stroke="#c3cedb" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="515" y="142" text-anchor="middle" font-weight="600" fill="#2b3a4b">Bus Catalog</text>
  <text x="515" y="160" text-anchor="middle" font-size="11" fill="#54627a">the topology</text>
  <text x="515" y="184" text-anchor="middle" font-size="11" fill="#54627a">bus &#8594; slot &#8594; node</text>
  <text x="515" y="200" text-anchor="middle" font-size="11" fill="#54627a">&#8594; x-rod &#8594; transport</text>
  <line x1="438" y1="150" x2="402" y2="150" stroke="#5b5b5b" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="420" y="142" text-anchor="middle" font-size="10" fill="#54627a">resolves</text>
</svg>
