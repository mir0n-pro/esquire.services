# MetalLB IPAddressPool + L2Advertisement for local Docker Desktop k8s.
# Permanent fix for "LoadBalancer EXTERNAL-IP stays <pending>": MetalLB is
# the LB controller Docker Desktop ships without. With it installed and
# this pool configured, every type=LoadBalancer service gets a real
# EXTERNAL-IP from the pool, and Docker Desktop's localhost-forwarder
# routes localhost:lbPort to the service reliably.
#
# Pool range: 172.19.255.200-250 -- high end of the kind docker network
# (172.19.0.0/16), well away from the existing service IPs in 172.19.0.x
# range (assigned by Docker Desktop's pre-MetalLB ad-hoc allocator).
#
# One-time install (auto-applied by k8s-up.bat):
#   kubectl apply -f https://raw.githubusercontent.com/metallb/metallb/v0.14.9/config/manifests/metallb-native.yaml
#   kubectl apply -f metallb-config.yaml   (this file)
#
# Local-only. OKE uses ingress-nginx + cert-manager, not MetalLB.
---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: kind-pool
  namespace: metallb-system
spec:
  addresses:
    - 172.19.255.200-172.19.255.250
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: l2-default
  namespace: metallb-system
spec:
  ipAddressPools:
    - kind-pool
