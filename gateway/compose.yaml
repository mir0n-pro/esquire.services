services:
  gateway:
    container_name: esq-gateway
    build:
      context: .
    image: esquire.gateway
    ports:
      - "3000:8080"
    environment:
      - GATEWAY_PORT=8080
      - BIZTREE_PORT=3001
      - BIZTREE_HOST=172.20.0.2
      - KEYCLOAK_HOST=keycloak
      - KEYCLOAK_PORT=8080
      - KEYCLOAK_REALM=esquire
      - KEYCLOAK_CLIENT_ID=esq-angular
      - CORS_ALLOWED_ORIGIN=http://localhost:4200
      - LOG_LEVEL_ROOT=ERROR
      - LOG_LEVEL_SF=ERROR
      - LOG_LEVEL_MIR0N=DEBUG
    command: ["java", "-jar", "app.jar"]
    networks:
      - esquirenet
networks:
  esquirenet:
    driver: "bridge"
   