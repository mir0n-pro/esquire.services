name: esq-omnibus
services:
  postgres:
    container_name: esq-postgres
    build:
      context: ../..
      dockerfile: services/postgres/Dockerfile
    image: esquire-postgres:17
    restart: on-failure
    environment:
      POSTGRES_USER: esq2025
      POSTGRES_PASSWORD: q
      POSTGRES_DB: esq2025
    ports:
      - "5433:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./logs:/var/log/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U esq2025 -d esq2025"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - esquirenet

  activemq:
    container_name: esq-activemq
    build:
      context: ../activemq
      dockerfile: Dockerfile
    image: esquire-activemq:6.1.4
    ports:
      - "61616:61616"   # JMS/OpenWire broker port
      - "8161:8161"     # ActiveMQ web console (admin/admin)
    volumes:
      - ./data/activemq:/var/opt/activemq/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/61616' 2>/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - esquirenet

  keycloak:
    container_name: esq-keycloak
    build:
      context: ../keycloak
      dockerfile: Dockerfile.keycloak
    image: esquire-keycloak:26.4.7
    command: start-dev --import-realm
    ports:
      - "8080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: q
      KC_HOSTNAME: localhost
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_BACKCHANNEL: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./data/keycloak:/opt/keycloak/data
      - ../keycloak/import/esquire.json:/opt/keycloak/data/import/realm.json
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000; echo -e 'GET /health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n' >&3; grep 'HTTP/1.1 200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 5      
    networks:
      - esquirenet

  biztree:
    container_name: esq-biztree
    build:
      context: .
    image: esquire.biztree
    ports:
      - "3002:3002"
    environment:
      - BIZTREE_PORT=3002
      - LOG_LEVEL_ROOT=ERROR
      - LOG_LEVEL_SF=ERROR
      - LOG_LEVEL_MIR0N=DEBUG
      - LOG_LEVEL_DEVELOP=DEBUG
      - LOG_LEVEL_MSG=DEBUG
      - DEVELOP_LOG_PATH=logs/bizTree-develop.log
      - MSG_LOG_PATH=logs/bizTree-msg.log
      - DB_BIZTREE_VENDOR=dev-postgres
      - DB_BIZTREE_PORT=5432
      - DB_BIZTREE_NAME=esq2025
      #- DB_BIZTREE_VENDOR=dev-oracle
      #- DB_BIZTREE_PORT=1521
      #- DB_BIZTREE_NAME=MIR0N
      - DB_BIZTREE_HOST=postgres
      - DB_BIZTREE_USERNAME=esq2025
      - DB_BIZTREE_PASSWORD=q
      # Messaging
      - AMQ_BROKER_URL=tcp://activemq:61616
      #- AMQ_USER=
      #- AMQ_PASSWORD=
      - BIZTREE_MESSAGING_CLIENT_ID=biztree
      - BIZTREE_MESSAGING_CONSUMER_ENABLED=true
    command: ["java", "-jar", "app.jar"]
    depends_on:
      postgres:
        condition: service_healthy
      activemq:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    networks:
      - esquirenet

  enyman:
    container_name: esq-enyman
    build:
      context: .
    image: esquire.enyman
    ports:
      - "3003:3003"
    environment:
      - ENYMAN_PORT=3003
      - LOG_LEVEL_ROOT=ERROR
      - LOG_LEVEL_SF=ERROR
      - LOG_LEVEL_MIR0N=DEBUG
      - LOG_LEVEL_DEVELOP=DEBUG
      - LOG_LEVEL_MSG=INFO
      - DEVELOP_LOG_PATH=logs/enyMan-develop.log
      - MSG_LOG_PATH=logs/enyMan-msg.log
      - DB_ENYMAN_VENDOR=dev-postgres
      - DB_ENYMAN_PORT=5432
      - DB_ENYMAN_NAME=esq2025
      #- DB_ENYMAN_VENDOR=dev-oracle
      #- DB_ENYMAN_PORT=1521
      #- DB_ENYMAN_NAME=MIR0N
      - DB_ENYMAN_HOST=postgres
      - DB_ENYMAN_USERNAME=esq2025
      - DB_ENYMAN_PASSWORD=q
      # Messaging
      - AMQ_BROKER_URL=tcp://activemq:61616
      #- AMQ_USER=
      #- AMQ_PASSWORD=
      - ENYMAN_SERVICE_ID=entity-update-broadcast
      - ENYMAN_CTRL_ID=enyman.default
      - ENYMAN_MESSAGING_CLIENT_ID=enyman
      #- ENYMAN_MESSAGING_CONSUMER_ENABLED=false
    command: ["java", "-jar", "app.jar"]
    depends_on:
      postgres:
        condition: service_healthy
      activemq:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    networks:
      - esquirenet

  pacman:
    container_name: esq-pacman
    build:
      context: .
    image: esquire.pacman
    ports:
      - "3004:3004"
    environment:
      - PACMAN_PORT=3004
      - LOG_LEVEL_ROOT=ERROR
      - LOG_LEVEL_SF=ERROR
      - LOG_LEVEL_MIR0N=DEBUG
      - LOG_LEVEL_DEVELOP=DEBUG
      - LOG_LEVEL_MSG=INFO
      - DEVELOP_LOG_PATH=logs/pacMan-develop.log
      - MSG_LOG_PATH=logs/pacMan-msg.log
      - DB_PACMAN_VENDOR=dev-postgres
      - DB_PACMAN_PORT=5432
      - DB_PACMAN_NAME=esq2025
      #- DB_PACMAN_VENDOR=dev-oracle
      #- DB_PACMAN_PORT=1521
      #- DB_PACMAN_NAME=MIR0N
      - DB_PACMAN_HOST=postgres
      - DB_PACMAN_USERNAME=esq2025
      - DB_PACMAN_PASSWORD=q
      # Messaging
      - AMQ_BROKER_URL=tcp://activemq:61616
      #- AMQ_USER=
      #- AMQ_PASSWORD=
      - PACMAN_SERVICE_ID=entity-update-broadcast
      - PACMAN_CTRL_ID=pacman.default
      - PACMAN_MESSAGING_CLIENT_ID=pacman
    command: ["java", "-jar", "app.jar"]
    depends_on:
      postgres:
        condition: service_healthy
      activemq:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    networks:
      - esquirenet

  keysmith:
    container_name: esq-keysmith
    build:
      context: .
    image: esquire.keysmith
    ports:
      - "3005:3005"
    environment:
      - KEYSMITH_PORT=3005
      - LOG_LEVEL_ROOT=ERROR
      - LOG_LEVEL_SF=ERROR
      - LOG_LEVEL_MIR0N=DEBUG
      - LOG_LEVEL_DEVELOP=DEBUG
      - LOG_LEVEL_MSG=DEBUG
      - DEVELOP_LOG_PATH=logs/keySmith-develop.log
      - MSG_LOG_PATH=logs/keySmith-msg.log
      - DB_KEYSMITH_VENDOR=dev-postgres
      - DB_KEYSMITH_PORT=5432
      - DB_KEYSMITH_NAME=esq2025
      #- DB_KEYSMITH_VENDOR=dev-oracle
      #- DB_KEYSMITH_PORT=1521
      #- DB_KEYSMITH_NAME=MIR0N
      - DB_KEYSMITH_HOST=postgres
      - DB_KEYSMITH_USERNAME=esq2025
      - DB_KEYSMITH_PASSWORD=q
      # Messaging
      - AMQ_BROKER_URL=tcp://activemq:61616
      #- AMQ_USER=
      #- AMQ_PASSWORD=
      - KEYSMITH_MESSAGING_CLIENT_ID=keysmith
      - KEYSMITH_CTRL_ID=keysmith.default
    command: ["java", "-jar", "app.jar"]
    depends_on:
      postgres:
        condition: service_healthy
      activemq:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    networks:
      - esquirenet

  kcmaster:
    container_name: esq-kcmaster
    build:
      context: .
    image: esquire.kcmaster
    ports:
      - "3006:3006"
    environment:
      - KCMASTER_PORT=3006
      - LOG_LEVEL_ROOT=ERROR
      - LOG_LEVEL_SF=ERROR
      - LOG_LEVEL_MIR0N=DEBUG
      - LOG_LEVEL_DEVELOP=DEBUG
      - LOG_LEVEL_MSG=INFO
      - DEVELOP_LOG_PATH=logs/kcMaster-develop.log
      - MSG_LOG_PATH=logs/kcMaster-msg.log
      # Messaging
      - AMQ_BROKER_URL=tcp://activemq:61616
      #- AMQ_USER=
      #- AMQ_PASSWORD=
      - KCMASTER_SERVICE_ID=kc-sync
      - KCMASTER_CTRL_ID=kcmaster.default
      - KCMASTER_MESSAGING_CLIENT_ID=kcmaster
      # Keycloak
      - KC_BASE_URL=http://keycloak:8080
      - KC_REALM=esquire
      - KC_ADMIN_CLIENT_ID=esq-kcMaster
      - KC_ADMIN_CLIENT_SECRET=MHgq0Nu69u2uJ2johaK1wxQLMdakELXN
    command: ["java", "-jar", "app.jar"]
    depends_on:
      keycloak:
        condition: service_healthy
      activemq:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    networks:
      - esquirenet

  gateway:
    container_name: esq-gateway
    build:
      context: .
    image: esquire.gateway
    ports:
      - "7070:7070"
    healthcheck:
      # Use localhost:7070 because this command runs INSIDE the container
      test: ["CMD", "curl", "-f", "http://localhost:7070/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    environment:
      - GATEWAY_PORT=7070
      - LOG_LEVEL_DEVELOP=DEBUG
      - DEVELOP_LOG_PATH=logs/gateway-develop.log
      - BIZTREE_PORT=3002
      - BIZTREE_HOST=biztree
      - ENYMAN_PORT=3003
      - ENYMAN_HOST=enyman
      - PACMAN_PORT=3004
      - PACMAN_HOST=pacman
      - KEYSMITH_PORT=3005
      - KEYSMITH_HOST=keysmith
      - BACKEND_HOST=localhost
      - KEYCLOAK_HOST=esq-keycloak
      - KEYCLOAK_PORT=8080
      - KEYCLOAK_REALM=esquire
      - KEYCLOAK_CLIENT_ID=esq-angular
      - CORS_ALLOWED_ORIGINS=http://localhost:4200
      - LOG_LEVEL_ROOT=ERROR
      - LOG_LEVEL_SF=ERROR
      - LOG_LEVEL_MIR0N=DEBUG
      - GW_SERVICE_METRICS_ENABLED=true 
    command: ["java", "-jar", "app.jar"]
    depends_on:
      keycloak:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    networks:
      - esquirenet

  frontend:
    container_name: esq-frontend
    build:
      context: .
#      secrets:
#        - npmrc        
    image: esquire.frontend
    ports:
      - "4200:4200"
    environment:
      # These variables are injected into assets/config.json at container start
      - BACKEND_HOST=localhost
      - BACKEND_PORT=7070
      - KEYCLOAK_FACADE_HOST=localhost
      - KEYCLOAK_FACADE_PORT=8080
      - KEYCLOAK_REALM=esquire
      - KEYCLOAK_CLIENT_ID=esq-angular
    # Command overrides angular.json for Docker without changing local code
    command: >
          /bin/sh -c "
          envsubst < ./public/assets/config.json.template > ./public/assets/config.json && 
          npx ng serve --host 0.0.0.0 --port 4200 --poll 2000
          "
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - esquirenet
      
##    volumes:
##      - .:/app
##      - /app/node_modules # Prevents local node_modules from overwriting container's
## Mount ONLY the template as read-only
##      - ./public/assets/config.json.template:/public/assets/config.json.template:ro
#secrets:
#  npmrc:
#    file: ./.npmrc_composer 

networks:
  esquirenet:
    driver: "bridge"

