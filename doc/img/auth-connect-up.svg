<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1015 689" font-family="Calibri, Segoe UI, sans-serif">
  <defs>
    <marker id="arw" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" refX="10" refY="4.5" orient="auto">
      <path d="M0,0 L10,4.5 L0,9 Z" fill="#6ca43d"/>
    </marker>
    <marker id="arwo" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" refX="10" refY="4.5" orient="auto">
      <path d="M0,0 L10,4.5 L0,9 Z" fill="#ffffff" stroke="#6ca43d" stroke-width="1.2"/>
    </marker>
    <marker id="arwb" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" refX="10" refY="4.5" orient="auto">
      <path d="M0,0 L10,4.5 L0,9 Z" fill="#c55a11"/>
    </marker>
  </defs>
  <style>
    .hdr{fill:#5b9bd5;stroke:#41719c;stroke-width:1.5}
    .hdrtxt{fill:#ffffff;font-weight:bold;font-size:15px}
    .life{stroke:#5592c9;stroke-width:1.2;stroke-dasharray:4,3}
    .msg{stroke:#6ca43d;stroke-width:1.7;fill:none;marker-end:url(#arw)}
    .ret{stroke:#6ca43d;stroke-width:1.3;fill:none;stroke-dasharray:6,3;marker-end:url(#arwo)}
    .bus{stroke:#c55a11;stroke-width:1.7;fill:none;stroke-dasharray:8,3;marker-end:url(#arwb)}
    .mt{fill:#2b2b2b;font-size:12.5px}
    .note{fill:#fff3cd;stroke:#e0c068;stroke-width:1}
    .nt{fill:#5b4a00;font-size:12px}
    .title{fill:#1f3864;font-size:18px;font-weight:bold}
    .sec{fill:#1f3864;font-size:12.5px;font-weight:bold}
    .stk1{fill:#9ec3e6;stroke:#5a8bc0;stroke-width:1}
    .stk2{fill:#c5daf0;stroke:#7ba7d4;stroke-width:1}
    .xn{fill:#dbe9f7;font-size:10px}
    .leg{fill:#eef2f7;stroke:#c9d6e5;stroke-width:1}
    .legt{fill:#404040;font-size:11.5px}
    .legb{fill:#1f3864;font-size:11.5px;font-weight:bold}
    .box{fill:#5b9bd5;stroke:#41719c;stroke-width:1.5}
    .boxs{fill:#dbe9f7;font-size:11px}
    .busbox{fill:#fbe5d6;stroke:#c55a11;stroke-width:1.2}
    .bust{fill:#843c0c;font-size:12.5px;font-weight:bold}
    .bussub{fill:#843c0c;font-size:11px}
    .lbl{fill:#2b2b2b;font-size:11.5px}
  </style>

  <text class="title" x="20" y="28">Allow-connect UP -- activate a user (keySmith)</text>

  <!-- participants -->
  <rect class="hdr" x="27" y="44" width="136" height="34" rx="5"/><text class="hdrtxt" x="95" y="66" text-anchor="middle">UI</text><line class="life" x1="95" y1="78" x2="95" y2="591"/>
  <rect class="stk2" x="200" y="34" width="136" height="34" rx="5"/><rect class="stk1" x="196" y="39" width="136" height="34" rx="5"/><rect class="hdr" x="192" y="44" width="136" height="34" rx="5"/><text class="hdrtxt" x="260" y="66" text-anchor="middle">keySmith</text><text class="xn" x="322" y="55" text-anchor="end">xN</text><line class="life" x1="260" y1="78" x2="260" y2="591"/>
  <rect class="hdr" x="357" y="44" width="136" height="34" rx="5"/><text class="hdrtxt" x="425" y="66" text-anchor="middle">esq2025</text><line class="life" x1="425" y1="78" x2="425" y2="591"/>
  <rect class="stk2" x="530" y="34" width="136" height="34" rx="5"/><rect class="stk1" x="526" y="39" width="136" height="34" rx="5"/><rect class="hdr" x="522" y="44" width="136" height="34" rx="5"/><text class="hdrtxt" x="590" y="66" text-anchor="middle">kcMaster</text><text class="xn" x="652" y="55" text-anchor="end">xN</text><line class="life" x1="590" y1="78" x2="590" y2="591"/>
  <rect class="hdr" x="687" y="44" width="136" height="34" rx="5"/><text class="hdrtxt" x="755" y="66" text-anchor="middle">KeyCloak</text><line class="life" x1="755" y1="78" x2="755" y2="591"/>
  <rect class="stk2" x="860" y="34" width="136" height="34" rx="5"/><rect class="stk1" x="856" y="39" width="136" height="34" rx="5"/><rect class="hdr" x="852" y="44" width="136" height="34" rx="5"/><text class="hdrtxt" x="920" y="66" text-anchor="middle">gateway</text><text class="xn" x="982" y="55" text-anchor="end">xN</text><line class="life" x1="920" y1="78" x2="920" y2="591"/>

  <line class="msg" x1="95" y1="128" x2="256" y2="128"/>
  <text class="mt" x="177" y="106" text-anchor="middle">POST /esq-key-save</text>
  <text class="mt" x="177" y="121" text-anchor="middle" font-size="11">{ connectFlg: "Y" }</text>
  <line class="msg" x1="260" y1="180" x2="421" y2="180"/>
  <text class="mt" x="342" y="158" text-anchor="middle">au_connect_flg  N -&gt; Y</text>
  <text class="mt" x="342" y="173" text-anchor="middle" font-size="11">(TOTP reset to N)</text>
  <line class="msg" x1="260" y1="232" x2="586" y2="232"/>
  <text class="mt" x="425" y="210" text-anchor="middle">URQ - EVENT_CREATE  { login id, email }</text>
  <text class="mt" x="425" y="225" text-anchor="middle" font-size="11">over the IAM request bus</text>
  <line class="msg" x1="590" y1="284" x2="751" y2="284"/>
  <text class="mt" x="672" y="262" text-anchor="middle">createUser(login id, email,</text>
  <text class="mt" x="672" y="277" text-anchor="middle" font-size="11">"changeit", change-password)</text>
  <rect class="note" x="520" y="314" width="330" height="44" rx="4"/>
  <text class="nt" x="530" y="331">KeyCloak holds the login id, the email and the</text>
  <text class="nt" x="530" y="346">credential -- no roles, no Esquire claims</text>
  <line class="ret" x1="755" y1="398" x2="594" y2="398"/>
  <text class="mt" x="672" y="391" text-anchor="middle" font-size="11.5">created</text>
  <line class="ret" x1="590" y1="450" x2="264" y2="450"/>
  <text class="mt" x="425" y="443" text-anchor="middle" font-size="11.5">URS - done  (rod-id -&gt; originating keySmith)</text>
  <line class="bus" x1="260" y1="502" x2="916" y2="502"/>
  <text class="mt" x="590" y="480" text-anchor="middle">claims eviction  (access profile, uid)</text>
  <text class="mt" x="590" y="495" text-anchor="middle" font-size="11">over the Claim Broadcast Bus -- every save</text>
  <rect class="note" x="20" y="532" width="430" height="29" rx="4"/>
  <text class="nt" x="30" y="549">First login: the user must replace "changeit" with a real password.</text>
  <rect class="leg" x="20" y="605" width="975" height="60" rx="5"/>
  <text class="legt" x="30" y="624"><tspan class="legb">Redundancy:</tspan> keySmith, kcMaster and the gateway run at N replicas (stacked). The URQ is taken by any one</text>
  <text class="legt" x="30" y="640">kcMaster, and its URS reply goes back to the originating keySmith by rod-id. The claims eviction is a broadcast:</text>
  <text class="legt" x="30" y="656">every gateway replica drops the user from its own cache. A dashed orange arrow is a bus broadcast.</text>
</svg>
