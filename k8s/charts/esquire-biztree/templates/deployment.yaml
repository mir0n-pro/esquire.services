{{- $replicas := int (.Values.replicaCount | default 1) -}}
{{- if gt $replicas 10 -}}
{{- fail (printf "esquire-biztree: replicaCount=%d exceeds the cap of 10. The per-instance number is a single decimal digit (0-9) -- the fleet naming rule (pod ordinal -> rod-id <app>.<instanceNo>) caps replicas at 10." $replicas) -}}
{{- end -}}
{{- if lt $replicas 1 -}}
{{- fail (printf "esquire-biztree: replicaCount=%d must be >= 1" $replicas) -}}
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-biztree
  labels:
    app: {{ .Release.Name }}-biztree
spec:
  serviceName: {{ .Release.Name }}-biztree-hl
  replicas: {{ $replicas }}
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: {{ .Release.Name }}-biztree
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-biztree
    spec:
      containers:
        - name: biztree
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args: ["java", "-jar", "app.jar"]
          ports:
            - containerPort: {{ .Values.service.port }}
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-biztree-config
          env:
            - name: DB_BIZTREE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-biztree-secret
                  key: db-password
            # Downward API -- POD_NAME is the host identity EsqUtils.instanceHost() reads; instanceNo()
            # parses its trailing StatefulSet ordinal ("biztree-0" -> 0) so each pod owns a distinct rod-id.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          # readiness gates on the cacheReadiness indicator (cache loaded + serving) -- no traffic
          # until the bootstrap load completes; liveness is livenessState only so a slow load can't crashloop.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: {{ .Values.service.port }}
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: {{ .Values.service.port }}
            initialDelaySeconds: 40
            periodSeconds: 15
            timeoutSeconds: 5
          volumeMounts:
            - name: esquire-topology
              mountPath: /etc/esquire
              readOnly: true
      volumes:
        - name: esquire-topology
          configMap:
            name: esquire-topology
