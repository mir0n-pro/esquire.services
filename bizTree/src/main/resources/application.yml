spring:
  profiles:
    active: ${DB_BIZTREE_VENDOR:dev-postgres}
  application:
    name: biztree
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
logging:
  structured:
    format:
      console: ecs  # Use ecs,'logstash' or 'gelf' for other common formats
  level:
    root: ${LOG_LEVEL_ROOT:ERROR}
    org:
      springframework: ${LOG_LEVEL_SF:ERROR}
    pro:
      mir0n: ${LOG_LEVEL_MIR0N:ERROR}

---
# Development Oracle
spring:
  config:
    activate:
      on-profile: dev-oracle
  datasource:
    url: jdbc:oracle:thin:@//${DB_BIZTREE_HOST:localhost}:${DB_BIZTREE_PORT:1521}/${DB_BIZTREE_NAME:MIR0N}
    driverClassName: oracle.jdbc.OracleDriver
    username: ${DB_BIZTREE_USERNAME:esq2025}
    password: ${DB_BIZTREE_PASSWORD:q}   
    hikari:
      maximum-pool-size: 20
      minimum-idle: 20
      connection-timeout: 30000 
      max-lifetime: 1800000 
      idle-timeout: 600000    
  jpa:
    mapping-resources:
      - META-INF/oracle-tree-node.xml
      - META-INF/oracle-dictionary.xml
      - META-INF/oracle-entity.xml
      - META-INF/oracle-custom-field.xml
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
server:
  port: ${BIZTREE_PORT:3000}

---
# Development Postgres
spring:
  config:
    activate:
      on-profile: dev-postgres
  datasource:
    url: jdbc:postgresql://${DB_BIZTREE_HOST:localhost}:${DB_BIZTREE_PORT:5432}/${DB_BIZTREE_NAME:esq2025}
    username: ${DB_BIZTREE_USERNAME:esq2025}
    password: ${DB_BIZTREE_PASSWORD:q}   
    hikari:
      maximum-pool-size: 20
      minimum-idle: 20
      connection-timeout: 30000 
      max-lifetime: 1800000 
      idle-timeout: 600000    
  jpa:
    mapping-resources:
      - META-INF/postgres-tree-node.xml
      - META-INF/postgres-dictionary.xml
      - META-INF/postgres-entity.xml
      - META-INF/postgres-custom-field.xml
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
server:
  port: ${BIZTREE_PORT:3000}
