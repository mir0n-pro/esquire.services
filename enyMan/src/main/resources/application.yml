spring:
  profiles:
    active: ${DB_ENYMAN_VENDOR:dev-postgres}
  application:
    name: enyman
  activemq:
    broker-url: ${AMQ_BROKER_URL:tcp://localhost:61616}
    user: ${AMQ_USER:}
    password: ${AMQ_PASSWORD:}
    # Phase 1: no broker authorization required
  data:
    redis:
      # x-Rod audit option (d) target. Lettuce connects lazily, so it is dormant unless audit mode=redis.
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jms:
    # clientId on CachingConnectionFactory — required for durable subscriptions.
    # Must not be set on DefaultJmsListenerContainerFactory (shared connection proxy restriction).
    # Per-pod suffix from the StatefulSet ordinal (downward API → POD_INDEX env);
    # local dev / single-pod falls back to "enyman-0". Multiple enyMan instances
    # subscribing to the same topic (move-sync) need distinct clientIds.
    client-id: ${ENYMAN_MESSAGING_CLIENT_ID:enyman}-${POD_INDEX:0}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  mvc:
    problemdetails:
      enabled: true
# Messaging: entity broadcast producer
enyman:
  messaging:
    broker-url: ${AMQ_BROKER_URL:tcp://localhost:61616}
    # Identifies the messaging channel in outbound messages (ServiceID in FIX-JSON envelope)
    service-id: ${ENYMAN_SERVICE_ID:entity-update-broadcast}
    # Stable producer instance identifier (CtrlID in FIX-JSON envelope)
    ctrl-id: ${ENYMAN_CTRL_ID:enyman.default}
    # Stable per-pod client ID for durable subscriptions from this service.
    # Same composition as spring.jms.client-id above: base + StatefulSet ordinal.
    client-id: ${ENYMAN_MESSAGING_CLIENT_ID:enyman}-${POD_INDEX:0}
    # Set to true to activate the consumer template (disabled by default in phase 1)
    consumer:
      enabled: ${ENYMAN_MESSAGING_CONSUMER_ENABLED:false}
  # v1.2.6 Goal 3: in-process move queue. Single worker, FIFO. Cap is bounded so a runaway
  # producer can't grow the heap; on full the rig drops the item and logs an error via the
  # tryPut path (see MoveQueueManager.submitMove / submitReconcile). 16384 is comfortable for
  # normal load -- bursts of move + create traffic can sit in the queue while the worker
  # drains. Override via ENYMAN_MOVE_QUEUE_CAPACITY for stress tests.
  move-queue:
    capacity: ${ENYMAN_MOVE_QUEUE_CAPACITY:16384}
    # v1.2.6 Goal 3 toggle. true (default) -> CREATE-during-move triggers a path-reconcile task;
    # race 8b is closed. false -> reconciliation skipped; race-move-create sim reproduces the
    # race. Flipping to false here (or via env) is the negative-test setting.
    validate-create-during-move: ${ENYMAN_VALIDATE_CREATE_DURING_MOVE:true}
  # v1.2.7 audit logging. The FEATURE the deployer turns on/off; option-0 baseline = OFF (persist
  # nothing) -- a fresh deploy imposes no audit. x-rod is the fan-out IMPLEMENTATION it uses.
  audit-logging:
    enabled: ${ENYMAN_AUDIT_ENABLED:false}
    x-rod:
      # in-process = write the *_log here (option b); bus = publish to the audit queue, the standalone
      # xxRod service writes the *_log (option c).
      mode: ${ENYMAN_AUDIT_MODE:in-process}
      # xx-rod consumer worker pool that writes the *_log tables; keep <= the log datastore pool.
      pool-size: ${ENYMAN_AUDIT_POOL_SIZE:4}
      virtual-threads: ${ENYMAN_AUDIT_VIRTUAL_THREADS:false}
      # xy-rod producer feed: per-tx buffer, flush after commit; bounded backlog before backpressure.
      feed-capacity: ${ENYMAN_AUDIT_FEED_CAPACITY:4096}
      # (c) bus publisher (mode=bus only): 0 = single feed-worker synchronous publish (one JMS send per
      #   committed tx); N>0 = N async publisher threads over a dedicated useAsyncSend connection.
      bus:
        publisher-pool-size: ${ENYMAN_AUDIT_PUBLISHER_POOL_SIZE:0}
      # (d) redis (mode=redis only): the producer XADDs each event to this Redis Stream (the stream IS the
      #   audit log; no consumer service). max-len = approximate MAXLEN cap (0 = uncapped).
      redis:
        stream: ${ENYMAN_AUDIT_REDIS_STREAM:}
        max-len: ${ENYMAN_AUDIT_REDIS_MAX_LEN:0}
      # (b) where the in-process xx-rod writes the *_log tables:
      #   shared    = reuse the service datasource + its Hikari pool (phase 1).
      #   dedicated = a separate pool / vendor, configured under log-db below (phase 2/3).
      log-datastore: ${ENYMAN_AUDIT_LOG_DATASTORE:shared}
      # Read ONLY when log-datastore=dedicated. vendor selects the *_log SQL dialect
      # (dev-postgres -> INSERT..ON CONFLICT, dev-oracle -> MERGE) independently of the service's
      # own datasource -- so the log DB may be a DIFFERENT vendor than the business DB.
      log-db:
        vendor: ${ENYMAN_AUDIT_DB_VENDOR:dev-postgres}
        url: ${ENYMAN_AUDIT_DB_URL:}
        username: ${ENYMAN_AUDIT_DB_USERNAME:esq2025}
        password: ${ENYMAN_AUDIT_DB_PASSWORD:q}
        pool-size: ${ENYMAN_AUDIT_DB_POOL_SIZE:8}
      # [roadmap] mode: in-process (b, current) | bus (c). In bus mode the xy-rod publishes to the audit
      # queue and a standalone xx-rod service consumes + writes -- the log-db config then lives on that
      # service, and enyman keeps only a queue reference. Not wired until (c) is built.
management:
  health:
    redis:
      # The Redis health probe is OFF: Redis is only used when audit mode=redis (option d), so its
      # absence must not mark the service DOWN in the default (b)/(c) modes.
      enabled: false
logging:
  level:
    root: ${LOG_LEVEL_ROOT:ERROR}
    org:
      springframework: ${LOG_LEVEL_SF:ERROR}
      springframework.jms: ${LOG_LEVEL_JMS:INFO}
      apache:
        activemq: ${LOG_LEVEL_AMQ:INFO}
    pro:
      mir0n: ${LOG_LEVEL_MIR0N:INFO}
    develop: ${LOG_LEVEL_DEVELOP:DEBUG}
    msg: ${LOG_LEVEL_MSG:INFO}
  develop:
    log-path: ${DEVELOP_LOG_PATH:logs/enyMan-develop.log}
  msg:
    log-path: ${MSG_LOG_PATH:logs/enyMan-msg.log}

---
# Development Oracle
spring:
  config:
    activate:
      on-profile: dev-oracle
  datasource:
    url: jdbc:oracle:thin:@//${DB_ENYMAN_HOST:localhost}:${DB_ENYMAN_PORT:1521}/${DB_ENYMAN_NAME:MIR0N}
    driverClassName: oracle.jdbc.OracleDriver
    username: ${DB_ENYMAN_USERNAME:esq2025}
    password: ${DB_ENYMAN_PASSWORD:q}   
    hikari:
      maximum-pool-size: 20
      minimum-idle: 20
      connection-timeout: 30000 
      max-lifetime: 1800000 
      idle-timeout: 600000    
  jpa:
    mapping-resources:
      - META-INF/oracle-dictionary.xml
      - META-INF/oracle-entity.xml
      - META-INF/oracle-custom-field.xml
      - META-INF/oracle-acct.xml
      - META-INF/oracle-roles.xml
      - META-INF/audit/oracle-par.xml
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
server:
  port: ${ENYMAN_PORT:3000}

---
# Development Postgres
spring:
  config:
    activate:
      on-profile: dev-postgres
  datasource:
    url: jdbc:postgresql://${DB_ENYMAN_HOST:localhost}:${DB_ENYMAN_PORT:5432}/${DB_ENYMAN_NAME:esq2025}
    username: ${DB_ENYMAN_USERNAME:esq2025}
    password: ${DB_ENYMAN_PASSWORD:q}   
    hikari:
      maximum-pool-size: 20
      minimum-idle: 20
      connection-timeout: 30000 
      max-lifetime: 1800000 
      idle-timeout: 600000    
  jpa:
    mapping-resources:
      - META-INF/postgres-dictionary.xml
      - META-INF/postgres-entity.xml
      - META-INF/postgres-custom-field.xml
      - META-INF/postgres-acct.xml
      - META-INF/postgres-roles.xml
      - META-INF/audit/postgres-par.xml
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
server:
  port: ${ENYMAN_PORT:3000}
