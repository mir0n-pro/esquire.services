image:
  repository: esquire.kcmaster
  tag: latest
  pullPolicy: IfNotPresent

springProfilesActive: console

service:
  port: 3006

messaging:
  brokerUrl: tcp://esquire-infra-amq-activemq:61616
  clientId: kcmaster

keycloak:
  # KC serves under HTTP_RELATIVE_PATH=/kc-auth in the infra-kc chart;
  # kcMaster's Keycloak admin client (KeycloakBuilder) must hit
  # base + /realms/{realm}/... so the /kc-auth prefix has to be in baseUrl.
  baseUrl: http://esquire-infra-kc-keycloak:8080/kc-auth
  realm: esquire
  # Confidential service-account client seeded into the esquire realm import;
  # admin-cli is a public client (no secret, no client_credentials support) and
  # cannot drive the KC admin REST API. Matches the compose default.
  adminClientId: esq-kcMaster
  adminClientSecret: MHgq0Nu69u2uJ2johaK1wxQLMdakELXN

logging:
  levelRoot: ERROR
  levelSf: ERROR
  levelMir0n: DEBUG
  levelDevelop: DEBUG
  levelMsg: DEBUG
  developLogPath: /tmp/kcMaster-develop.log
  msgLogPath: /tmp/kcMaster-msg.log
