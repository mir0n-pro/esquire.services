# Grafana Tempo trace store for the T2 observability stack (local/dev k8s only; not deployed on OKE).
image:
  repository: grafana/tempo
  tag: "2.7.1"
  pullPolicy: IfNotPresent

# Resource budget -- MEASURED on local k8s under a 200-VU super-load (2026-07-14), not guessed: peak RSS
# 952Mi and peak 1.16 cores at 657 rps, and the box tops out near 1130 rps with observability on, so the
# limits carry headroom over that ceiling rather than over the sample. Requests are the RESERVATION the
# scheduler holds; limits are the CEILING. With neither, this pod runs BestEffort -- no reservation, no
# ceiling, competing for the very CPU the JVMs are capped on, and FIRST in line to be evicted under the load
# that most needs observing.
resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 3000m
    memory: 2Gi

# Storage is the SYSTEM ADMIN's choice -- Esquire does not dictate it. The default is emptyDir: history lives
# and dies with the pod, which is the right default for a dev/demo stack and costs nothing. Set
# persistence.enabled=true (with a storageClass and size that suit the cluster) to keep it across restarts.
persistence:
  enabled: false
  storageClass: ""          # "" = the cluster default StorageClass
  size: 20Gi
