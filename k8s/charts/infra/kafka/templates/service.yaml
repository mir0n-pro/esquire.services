apiVersion: v1
kind: Service
metadata:
  # NB: service name == release name (esquire-infra-kafka) so it matches the topology endpoint
  # esquire-infra-kafka:9092 (and the broker's advertised PLAINTEXT listener below).
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  type: ClusterIP
  selector:
    app: {{ .Release.Name }}
  ports:
    - name: kafka
      port: 9092
      targetPort: 9092
