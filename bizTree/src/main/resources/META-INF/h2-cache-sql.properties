# H2 in-memory cache SQL
# Vendor: H2
# Analogous to oracle-tree-node.xml / postgres-tree-node.xml for the primary datasource.
# A different embedded DB vendor would supply its own *-cache-sql.properties file.

# ---- DDL ----

# The {table} token is substituted per monad by CacheSqlSet.forTable().
# Table name, index names and the PK constraint name are all parameterized so
# two monads (Taijitu) can hold distinct tables in one H2 instance without name
# collisions.

biztree.cache.sql.ddl.create-table=\
  CREATE TABLE IF NOT EXISTS {table} (\
    TREE_PK             VARCHAR(33)  NOT NULL,\
    TREE_ET_PK          INTEGER      NOT NULL DEFAULT 0,\
    TREE_NAME           VARCHAR(50)  NOT NULL,\
    TREE_DESC           VARCHAR(1024),\
    TREE_TREE_PK_PARENT VARCHAR(33),\
    TREE_TREE_PK_LINK   VARCHAR(33),\
    TREE_ENTITY_PK      BIGINT,\
    TREE_LEVEL          INTEGER,\
    TREE_PATH           VARCHAR(2000),\
    TREE_ENTITY_PATH    VARCHAR(2000),\
    TREE_STATUS         INTEGER      DEFAULT 0,\
    CONSTRAINT {table}_PK PRIMARY KEY (TREE_PK)\
  )

biztree.cache.sql.ddl.create-index-parent=\
  CREATE INDEX IF NOT EXISTS {table}_PARENT_I ON {table} (TREE_TREE_PK_PARENT)

biztree.cache.sql.ddl.create-index-entity-pk=\
  CREATE INDEX IF NOT EXISTS {table}_ENTITY_PK_I ON {table} (TREE_ENTITY_PK)

# ---- Repository ----

# Vendor-specific single-row limiter
biztree.cache.sql.repo.select-one=LIMIT 1

biztree.cache.sql.repo.select-cols=\
  SELECT tree_pk, tree_tree_pk_parent, tree_tree_pk_link, tree_name, tree_et_pk,\
         tree_status, tree_entity_pk, tree_level - ? AS tree_level_adj,\
         tree_desc, tree_path \
  FROM {table}\u0020

biztree.cache.sql.repo.find-root=\
  WHERE tree_pk = ? AND tree_entity_path LIKE ?

biztree.cache.sql.repo.find-nodes=\
  WHERE tree_tree_pk_parent = ? AND tree_entity_path LIKE ?

biztree.cache.sql.repo.find-path=\
  SELECT tree_path FROM {table} \
  WHERE tree_pk = ? AND tree_tree_pk_link IS NULL\u0020

biztree.cache.sql.repo.find-by-entity-id=\
  WHERE tree_entity_pk = ? AND tree_tree_pk_link IS NULL AND tree_entity_path LIKE ?\u0020

biztree.cache.sql.repo.find-by-name-kind=\
  WHERE tree_name = ? AND tree_et_pk = ? AND tree_entity_path LIKE ?\u0020

biztree.cache.sql.repo.update-node=\
  UPDATE {table} SET \
    tree_name   = CASE WHEN ? IS NULL   THEN tree_name   ELSE ? END, \
    tree_desc   = CASE WHEN ? = CHAR(0) THEN tree_desc   ELSE ? END, \
    tree_status = CASE WHEN ? IS NULL   THEN tree_status ELSE ? END \
  WHERE tree_entity_pk = ?

biztree.cache.sql.repo.delete-node=\
  DELETE FROM {table} WHERE ? IN (tree_pk, tree_tree_pk_link, tree_tree_pk_parent)

biztree.cache.sql.repo.move-node=\
  UPDATE {table} \
  SET tree_path = ?, tree_entity_path = ?, tree_level = ?, tree_tree_pk_parent = ? \
  WHERE tree_pk = ?

biztree.cache.sql.repo.move-acct-link=\
  UPDATE {table} \
  SET tree_pk = ?, tree_path = ?, tree_entity_path = ?, tree_level = ?, tree_tree_pk_parent = ? \
  WHERE tree_tree_pk_link = ?

biztree.cache.sql.repo.find-folder-pks=\
  SELECT tree_pk FROM {table} \
  WHERE tree_tree_pk_parent = ? AND tree_entity_pk IS NULL

# Recursive subtree: every cache row whose tree_path starts with the seed's
# tree_path. Includes the seed itself, all real-entity descendants, all virtual
# folder nodes, and all account shortcut nodes. Used by GET /esq-tree for the
# CompareTrees diff scenario.
biztree.cache.sql.repo.find-subtree=\
  WHERE tree_path LIKE \
        (SELECT tree_path FROM {table} WHERE tree_pk = ? LIMIT 1) || '%' \
    AND tree_entity_path LIKE ?

# Full table wipe (night-watch CLEAR, before a shadow reload).
biztree.cache.sql.repo.clear-all=\
  TRUNCATE TABLE {table}

# Order-independent MD5 digest of the whole table (night-watch CHECKSUM). Rows are
# concatenated in TREE_PK order so the digest is independent of physical row order;
# COALESCE(...,'') keeps an empty table's digest non-null (MD5 of the empty string).
biztree.cache.sql.repo.checksum=\
  SELECT RAWTOHEX(HASH('MD5', STRINGTOUTF8(COALESCE(GROUP_CONCAT( \
    TREE_PK || '~' || TREE_ET_PK || '~' || COALESCE(TREE_NAME,'') || '~' || COALESCE(TREE_DESC,'') || '~' || \
    COALESCE(TREE_TREE_PK_PARENT,'') || '~' || COALESCE(TREE_TREE_PK_LINK,'') || '~' || \
    COALESCE(CAST(TREE_ENTITY_PK AS VARCHAR),'') || '~' || COALESCE(CAST(TREE_LEVEL AS VARCHAR),'') || '~' || \
    COALESCE(TREE_PATH,'') || '~' || COALESCE(TREE_ENTITY_PATH,'') || '~' || TREE_STATUS \
    ORDER BY TREE_PK SEPARATOR '|'), '')))) \
  FROM {table}

# ---- Loader ----

biztree.cache.sql.loader.insert-node=\
  INSERT INTO {table}\
    (tree_pk, tree_et_pk, tree_name, tree_desc,\
     tree_tree_pk_parent, tree_tree_pk_link, tree_entity_pk,\
     tree_level, tree_path, tree_entity_path, tree_status)\
  VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)

biztree.cache.sql.loader.update-path=\
  UPDATE {table} SET tree_level = ?, tree_path = ? WHERE tree_pk = ?

biztree.cache.sql.loader.select-paths=\
  SELECT tree_pk, tree_tree_pk_parent FROM {table}
