services:
  gateward:
    build:
      context: .
    image: esquire.gateward
    ports:
      - "7070:7070"
    environment:
      - GATEWARD_PORT=7070
      - LOG_LEVEL_ROOT=ERROR
      - LOG_LEVEL_SF=ERROR
      - LOG_LEVEL_MIR0N=DEBUG
      # the cache half: it fills itself from the database at start-up
      - DB_BIZTREE_VENDOR=dev-postgres
      - DB_BIZTREE_HOST=host.docker.internal
      - DB_BIZTREE_PORT=5432
      - DB_BIZTREE_NAME=esq2025
      - DB_BIZTREE_USERNAME=esq2025
      - DB_BIZTREE_PASSWORD=q
    command: ["java", "-jar", "app.jar"]
    networks:
      - esquirenet
networks:
  esquirenet:
    driver: "bridge"
