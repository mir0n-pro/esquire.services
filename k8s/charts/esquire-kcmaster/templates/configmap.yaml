apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-kcmaster-config
  labels:
    app: {{ .Release.Name }}-kcmaster
data:
  SPRING_PROFILES_ACTIVE:         {{ .Values.springProfilesActive | default "" | quote }}
  KCMASTER_PORT:                  {{ .Values.service.port | quote }}
  TOPOLOGY_IMPORT:        {{ .Values.topologyImport | quote }}
  # --- v1.2.10 VT (UNVALIDATED test lever, default OFF -- see HA doc 5.5) ---
  ESQ_VIRTUAL_THREADS:            {{ .Values.esqVirtualThreads | quote }}
  # --- KC admin client (secret -> Secret, injected as env in the deployment) ---
  KC_BASE_URL:                    {{ .Values.keycloak.baseUrl | quote }}
  KC_REALM:                       {{ .Values.keycloak.realm | quote }}
  KC_ADMIN_CLIENT_ID:             {{ .Values.keycloak.adminClientId | quote }}
  # KC_ADMIN_CLIENT_SECRET: from kc-admin-client-secret (Secret) via the deployment env
  # --- path-buffer knobs ---
  KCMASTER_PATH_BUFFER_TTL_MS:    {{ .Values.pathBuffer.ttlMs | quote }}
  KCMASTER_PATH_BUFFER_PRUNE_MS:  {{ .Values.pathBuffer.pruneMs | quote }}
  # --- kc-bus ref (SERVER: receive URQ / publish URS) ---
  KC_BUS_ID:                      {{ .Values.kc.busId | quote }}
  KC_SLOT_ID:                  {{ .Values.kc.slotId | quote }}
  KC_REQUEST_POOL_SIZE:           {{ .Values.kc.requestPoolSize | quote }}
  KC_REQUEST_CONCURRENCY:         {{ .Values.kc.requestConcurrency | quote }}
  KC_RESPONSE_PUBLISHER_POOL_SIZE: {{ .Values.kc.responsePublisherPoolSize | quote }}
  KC_SEND_RETRY:                  {{ .Values.kc.sendRetry | quote }}
  KC_SEND_RETRY_BACKOFF_SEC:          {{ .Values.kc.sendRetryBackoff | quote }}
  KC_SEND_RETRY_MAX_ATTEMPTS:     {{ .Values.kc.sendRetryMaxAttempts | quote }}
  KC_POOL_MODE:                   {{ .Values.kc.poolMode | quote }}
  # --- entity-bus ref (CONSUMER: drain entity broadcast) ---
  ENTITY_BUS_ID:                  {{ .Values.entity.busId | quote }}
  ENTITY_SLOT_ID:              {{ .Values.entity.slotId | quote }}
  ENTITY_BROADCAST_POOL_SIZE:     {{ .Values.entity.broadcastPoolSize | quote }}
  ENTITY_BROADCAST_CONCURRENCY:   {{ .Values.entity.broadcastConcurrency | quote }}
  ENTITY_BROADCAST_POOL_MODE:       {{ .Values.entity.poolMode | quote }}
  # --- logging ---
  LOG_LEVEL_ROOT:                 {{ .Values.logging.levelRoot | quote }}
  LOG_LEVEL_SF:                   {{ .Values.logging.levelSf | quote }}
  LOG_LEVEL_MIR0N:                {{ .Values.logging.levelMir0n | quote }}
  LOG_LEVEL_DEVELOP:              {{ .Values.logging.levelDevelop | quote }}
  LOG_LEVEL_MSG:                  {{ .Values.logging.levelMsg | quote }}
  LOG_LEVEL_AMQ:                  {{ .Values.logging.levelAmq | quote }}
  LOG_LEVEL_JMS:                  {{ .Values.logging.levelJms | quote }}
  DEVELOP_LOG_PATH:               {{ .Values.logging.developLogPath | quote }}
  MSG_LOG_PATH:                   {{ .Values.logging.msgLogPath | quote }}
  # --- v1.2.11 O2 distributed tracing (opt-in; OFF by default; o11y-on enables it) ---
  ESQ_OBSERVABILITY_ENABLED:  {{ .Values.observability.enabled | quote }}
  # Per-pillar enable (I41): default to the master, override to run one pillar off. tracingEnabled=false ->
  # metrics-only (service-mesh coexistence). Empty string follows the master; any explicit value (incl. false) wins
  # -- toString+eq "" avoids Helm's default-trap where --set x=false (boolean) would be swallowed as empty.
  ESQ_TRACING_ENABLED:        {{ if eq (toString .Values.observability.tracingEnabled) "" }}{{ .Values.observability.enabled | quote }}{{ else }}{{ .Values.observability.tracingEnabled | quote }}{{ end }}
  ESQ_METRICS_ENABLED:        {{ if eq (toString .Values.observability.metricsEnabled) "" }}{{ .Values.observability.enabled | quote }}{{ else }}{{ .Values.observability.metricsEnabled | quote }}{{ end }}
  ESQ_METRICS_HISTOGRAMS:     {{ .Values.observability.metricsHistograms | quote }}
  ESQ_METRICS_BANDWIDTH:      {{ .Values.observability.metricsBandwidth | quote }}
  ESQ_METRICS_BUSINESS:      {{ .Values.observability.metricsBusiness | quote }}
  ESQ_OTLP_ENDPOINT:          {{ .Values.tracing.otlpEndpoint | quote }}
  ESQ_TRACING_SAMPLING_RATIO: {{ .Values.tracing.samplingRatio | quote }}
  ESQ_TRACING_MARKS_ENABLED:  {{ .Values.tracing.marksEnabled | quote }}
  ESQ_MSG_BUS_ALIVE_TRACE:    {{ .Values.tracing.msgBusAliveTrace | quote }}
  ESQ_TRACING_EXCLUDED_PATHS: {{ .Values.tracing.excludedPaths | quote }}
