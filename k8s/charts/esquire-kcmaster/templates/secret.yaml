apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-kcmaster-secret
  labels:
    app: {{ .Release.Name }}-kcmaster
type: Opaque
data:
  kc-admin-client-secret: {{ required "keycloak.adminClientSecret must be set (helm --set keycloak.adminClientSecret=...)" .Values.keycloak.adminClientSecret | b64enc | quote }}
