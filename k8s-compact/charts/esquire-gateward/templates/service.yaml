apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-gateward
  labels:
    app: {{ .Release.Name }}-gateward
spec:
  type: {{ .Values.service.type | default "ClusterIP" }}
  selector:
    app: {{ .Release.Name }}-gateward
  ports:
    - port: {{ .Values.service.lbPort }}
      targetPort: {{ .Values.service.port }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-gateward-hl
  labels:
    app: {{ .Release.Name }}-gateward
spec:
  clusterIP: None
  selector:
    app: {{ .Release.Name }}-gateward
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
