<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 624" font-family="Calibri, Segoe UI, sans-serif">
  <defs>
    <marker id="arw" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" refX="10" refY="4.5" orient="auto">
      <path d="M0,0 L10,4.5 L0,9 Z" fill="#6ca43d"/>
    </marker>
    <marker id="arwo" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" refX="10" refY="4.5" orient="auto">
      <path d="M0,0 L10,4.5 L0,9 Z" fill="#ffffff" stroke="#6ca43d" stroke-width="1.2"/>
    </marker>
  </defs>
  <style>
    .hdr{fill:#5b9bd5;stroke:#41719c;stroke-width:1.5}
    .hdrtxt{fill:#ffffff;font-weight:bold;font-size:15px}
    .life{stroke:#5592c9;stroke-width:1.2;stroke-dasharray:4,3}
    .msg{stroke:#6ca43d;stroke-width:1.7;fill:none;marker-end:url(#arw)}
    .ret{stroke:#6ca43d;stroke-width:1.3;fill:none;stroke-dasharray:6,3;marker-end:url(#arwo)}
    .mt{fill:#2b2b2b;font-size:12.5px}
    .note{fill:#fff3cd;stroke:#e0c068;stroke-width:1}
    .nt{fill:#5b4a00;font-size:12px}
    .pend{fill:#f4b183}
    .title{fill:#1f3864;font-size:18px;font-weight:bold}
    .stk1{fill:#9ec3e6;stroke:#5a8bc0;stroke-width:1}
    .stk2{fill:#c5daf0;stroke:#7ba7d4;stroke-width:1}
    .xn{fill:#dbe9f7;font-size:10px}
    .leg{fill:#eef2f7;stroke:#c9d6e5;stroke-width:1}
    .legt{fill:#404040;font-size:11.5px}
    .legb{fill:#1f3864;font-size:11.5px;font-weight:bold}
    .div{stroke:#b0b0b0;stroke-width:1.2;stroke-dasharray:7,4}
    .divbox{fill:#eef2f7;stroke:#b0b0b0;stroke-width:1}
    .divtxt{fill:#404040;font-size:12px;font-style:italic}
  </style>

  <text class="title" x="20" y="28">TFA ENABLE -- turn on two-factor (the ping-pong)</text>

  <g>
    <rect class="hdr" x="20"  y="44" width="140" height="34" rx="5"/><text class="hdrtxt" x="90"  y="66" text-anchor="middle">UI</text><line class="life" x1="90"  y1="78" x2="90"  y2="560"/>
    <rect class="stk2" x="203" y="34" width="140" height="34" rx="5"/><rect class="stk1" x="199" y="39" width="140" height="34" rx="5"/><rect class="hdr" x="195" y="44" width="140" height="34" rx="5"/><text class="hdrtxt" x="265" y="66" text-anchor="middle">keySmith</text><text class="xn" x="329" y="55" text-anchor="end">xN</text><line class="life" x1="265" y1="78" x2="265" y2="560"/>
    <rect class="hdr" x="370" y="44" width="140" height="34" rx="5"/><text class="hdrtxt" x="440" y="66" text-anchor="middle">esq2025</text><line class="life" x1="440" y1="78" x2="440" y2="560"/>
    <rect class="stk2" x="553" y="34" width="140" height="34" rx="5"/><rect class="stk1" x="549" y="39" width="140" height="34" rx="5"/><rect class="hdr" x="545" y="44" width="140" height="34" rx="5"/><text class="hdrtxt" x="615" y="66" text-anchor="middle">kcMaster</text><text class="xn" x="679" y="55" text-anchor="end">xN</text><line class="life" x1="615" y1="78" x2="615" y2="560"/>
    <rect class="hdr" x="720" y="44" width="140" height="34" rx="5"/><text class="hdrtxt" x="790" y="66" text-anchor="middle">KeyCloak</text><line class="life" x1="790" y1="78" x2="790" y2="560"/>
  </g>

  <line class="msg" x1="90" y1="120" x2="261" y2="120"/>
  <text class="mt" x="176" y="107" text-anchor="middle">POST /esq-key-save</text>
  <text class="mt" x="176" y="116" text-anchor="middle" font-size="11">{ tfaMethod: "G" }</text>

  <line class="msg" x1="265" y1="170" x2="436" y2="170"/>
  <text class="mt" x="352" y="163" text-anchor="middle">au_tfa_method = 'g'</text>
  <rect class="note" x="372" y="176" width="136" height="22" rx="4"/>
  <text class="nt" x="440" y="191" text-anchor="middle">PENDING (lowercase)</text>

  <line class="msg" x1="265" y1="230" x2="611" y2="230"/>
  <text class="mt" x="438" y="217" text-anchor="middle">URQ - EVENT_UPDATE { requireTotp }</text>
  <text class="mt" x="438" y="226" text-anchor="middle" font-size="11">over the IAM request bus</text>

  <line class="msg" x1="615" y1="278" x2="786" y2="278"/>
  <text class="mt" x="702" y="271" text-anchor="middle" font-size="11">add CONFIGURE_TOTP action</text>

  <!-- divider -->
  <line class="div" x1="20" y1="316" x2="860" y2="316"/>
  <rect class="divbox" x="230" y="304" width="420" height="24" rx="4"/>
  <text class="divtxt" x="440" y="320" text-anchor="middle">next login: KeyCloak shows the QR, the user scans, the action clears</text>

  <line class="msg" x1="90" y1="372" x2="261" y2="372"/>
  <text class="mt" x="176" y="359" text-anchor="middle">GET /esq-key</text>
  <text class="mt" x="176" y="368" text-anchor="middle" font-size="11">(self-read, no id)</text>

  <line class="msg" x1="265" y1="424" x2="436" y2="424"/>
  <text class="mt" x="352" y="411" text-anchor="middle">sees 'g', confirms</text>
  <text class="mt" x="352" y="420" text-anchor="middle" font-size="11">g -&gt; G</text>

  <line class="ret" x1="265" y1="474" x2="94" y2="474"/>
  <text class="mt" x="176" y="467" text-anchor="middle">tfaMethod = "G"</text>
  <rect class="note" x="108" y="480" width="136" height="22" rx="4"/>
  <text class="nt" x="176" y="495" text-anchor="middle">ACTIVE (confirmed)</text>

  <rect class="note" x="20" y="522" width="600" height="30" rx="4"/>
  <text class="nt" x="30" y="541">esq2025 carries the pending/active state; the OTP secret itself lives only in KeyCloak.</text>

  <rect class="leg" x="20" y="562" width="840" height="42" rx="5"/>
  <text class="legt" x="30" y="581"><tspan class="legb">Redundancy:</tspan> keySmith and kcMaster run at N replicas (stacked). The URQ goes to any one kcMaster; the later</text>
  <text class="legt" x="30" y="597">self-read can hit any keySmith replica and still confirms, because the pending state lives in shared esq2025.</text>
</svg>
