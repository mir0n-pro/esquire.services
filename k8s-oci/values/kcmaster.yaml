# Prod overrides for k8s/charts/esquire-kcmaster
image:
  repository: ghcr.io/mir0n-pro/esquire.kcmaster
  # tag injected by oke-up.bat (--set image.tag=%image_tag%) -- single release tag for the whole stack.
  pullPolicy: Always

springProfilesActive: console

# actuator/management probe port (F0 A6); set here to keep the OKE overlay in sync with the chart default (RF3)
service:
  managementPort: 8090

keycloak:
  baseUrl: http://esquire-infra-kc-keycloak:8080/kc-auth   # internal KC URL + /kc-auth (v1.2.3)
  realm: esquire
  # esq-kcMaster = the confidential service-account client (client_credentials); admin-cli is public and CANNOT
  # drive the KC admin REST API. The secret is injected UNIFORMLY via --set keycloak.adminClientSecret at install
  # -- same mechanism as the BFF (keycloak.clientSecret) and gateway (tokenRelay.phantom.exchangeClientSecret)
  # secrets -- so it is not committed here.
  adminClientId: esq-kcMaster

logging:
  levelRoot: ERROR
  levelSf: WARN
  levelMir0n: ERROR
  levelDevelop: "OFF"
  levelMsg: "OFF"

nodeSelector:
  tier: app

# v1.2.10 HA (OKE Always-Free): x2 replicas, best-effort spread across the 3 app-tier nodes.
replicaCount: 2
topologySpread:
  enabled: true

# Memory-bounded for the 1 OCPU / 6 GB app nodes. kcMaster has no DB datasource and no
# inbound HTTP load surface (it drains the KC bus), so only resources + send-retry apply
# -- no R1-R5 timeout/pool knobs.
resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: 750m
    memory: 768Mi

# producer send-retry (block mode) on the KC R&R server response leg.
kc:
  sendRetry: "true"
