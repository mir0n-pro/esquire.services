spring:
  profiles:
    active: ${DB_XXROD_VENDOR:dev-postgres}
  application:
    name: xxrod
  mvc:
    problemdetails:
      enabled: true
  config:
    import: "${ESQUIRE_TOPOLOGY_IMPORT:file:/etc/esquire/topology.yml}"
xxrod:
  director:
    type: ${XXROD_DIRECTOR:audit}
# Bus TOPOLOGY (which buses exist + their transport) is the shared esquire-topology.yml imported above.
# xxRod is the bus CONSUMER -- it drains the chosen bus audit sink (audit-c = AMQ / audit-ck = Kafka) to the *_log.
# The in-process (audit-b) and producer-only stream sinks (audit-d / audit-dk) have no xxRod consumer.
esquire:
  audit-bus:
    messaging-bus:
      bus-id: ${ESQUIRE_AUDIT_BUS_ID:audit-c}
      slot-id: ${ESQUIRE_AUDIT_SERVICE_ID:audit}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:ERROR}
    org:
      springframework: ${LOG_LEVEL_SF:ERROR}
      springframework.jms: ${LOG_LEVEL_JMS:INFO}
      apache:
        activemq: ${LOG_LEVEL_AMQ:INFO}
    pro:
      mir0n: ${LOG_LEVEL_MIR0N:ERROR}
    develop: ${LOG_LEVEL_DEVELOP:DEBUG}
    msg: ${LOG_LEVEL_MSG:INFO}
  develop:
    log-path: ${DEVELOP_LOG_PATH:logs/xxRod-develop.log}
  msg:
    log-path: ${MSG_LOG_PATH:logs/xxRod-msg.log}

---
spring:
  config:
    activate:
      on-profile: dev-postgres
  datasource:
    url: jdbc:postgresql://${DB_XXROD_HOST:localhost}:${DB_XXROD_PORT:5432}/${DB_XXROD_NAME:esq2025}
    username: ${DB_XXROD_USERNAME:esq2025}
    password: ${DB_XXROD_PASSWORD:q}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      connection-timeout: 30000
      max-lifetime: 1800000
      idle-timeout: 600000
server:
  port: ${XXROD_PORT:3007}

---
spring:
  config:
    activate:
      on-profile: dev-oracle
  datasource:
    url: jdbc:oracle:thin:@//${DB_XXROD_HOST:localhost}:${DB_XXROD_PORT:1521}/${DB_XXROD_NAME:MIR0N}
    driverClassName: oracle.jdbc.OracleDriver
    username: ${DB_XXROD_USERNAME:esq2025}
    password: ${DB_XXROD_PASSWORD:q}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      connection-timeout: 30000
      max-lifetime: 1800000
      idle-timeout: 600000
server:
  port: ${XXROD_PORT:3007}
