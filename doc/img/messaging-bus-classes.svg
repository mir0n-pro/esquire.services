  <rect x="570" y="44" width="290" height="348" rx="9" fill="#fbfcfd" stroke="#c3cedb" stroke-width="1.4"/>
  <rect x="570" y="44" width="290" height="26" rx="9" fill="#4D6A8D"/>
  <text x="715" y="62" text-anchor="middle" font-weight="600" fill="#ffffff">messaging.transport &#8212; driver SPI</text>

  <rect x="582" y="80"  width="266" height="28" rx="6" fill="#eef2f7" stroke="#4D6A8D" stroke-width="1.3"/><text x="715" y="98"  text-anchor="middle" font-weight="600" fill="#1f2a36">ITransportProvider</text>
  <rect x="582" y="116" width="266" height="28" rx="6" fill="#eef2f7" stroke="#4D6A8D" stroke-width="1.3"/><text x="715" y="134" text-anchor="middle" fill="#1f2a36">TransportProviders  (resolver)</text>
  <rect x="582" y="152" width="266" height="28" rx="6" fill="#eef2f7" stroke="#4D6A8D" stroke-width="1.3"/><text x="715" y="170" text-anchor="middle" fill="#1f2a36">TransportMessage</text>
  <rect x="582" y="188" width="266" height="28" rx="6" fill="#eef2f7" stroke="#4D6A8D" stroke-width="1.3"/><text x="715" y="206" text-anchor="middle" fill="#1f2a36">TransportSettings</text>
  <rect x="582" y="224" width="266" height="28" rx="6" fill="#eef2f7" stroke="#4D6A8D" stroke-width="1.3"/><text x="715" y="242" text-anchor="middle" font-size="11" fill="#1f2a36">PublishSettings &#183; ConsumeSettings</text>
  <rect x="582" y="260" width="266" height="28" rx="6" fill="#eef2f7" stroke="#4D6A8D" stroke-width="1.3"/><text x="715" y="278" text-anchor="middle" fill="#1f2a36">BusIdentity</text>
  <rect x="582" y="296" width="266" height="28" rx="6" fill="#eef2f7" stroke="#4D6A8D" stroke-width="1.3"/><text x="715" y="314" text-anchor="middle" fill="#1f2a36">TransportHealth  (enum)</text>
  <rect x="582" y="332" width="266" height="28" rx="6" fill="#e7edf4" stroke="#4D6A8D" stroke-width="1.3"/><text x="715" y="350" text-anchor="middle" font-size="11" fill="#1f2a36">drivers: tp-activemq / kafka / redis</text>

  <!-- cross-panel arrows -->
  <line x1="280" y1="94" x2="305" y2="94" stroke="#5b5b5b" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="292" y="88" text-anchor="middle" font-size="9.5" fill="#54627a">builds</text>
  <line x1="545" y1="94" x2="570" y2="94" stroke="#5b5b5b" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="557" y="88" text-anchor="middle" font-size="9.5" fill="#54627a">driver</text>
</svg>
