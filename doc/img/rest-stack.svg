<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="772" viewBox="0 0 1000 772" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5b6b7a"/>
    </marker>
  </defs>

  <text x="500" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#26384a">Esquire REST stack -- workers, pools and the end-to-end timeout ladder</text>
  <text x="500" y="50" text-anchor="middle" font-size="12" fill="#5b6b7a">each tier has its own concurrency model; values shown as  current -&gt; local-k8s best</text>

  <!-- ===== LEFT: the five tiers (outermost at top -> innermost at bottom) ===== -->
  <!-- tier card helper geometry: x=28 w=560 -->

  <!-- 1 Browser / Angular -->
  <rect x="28" y="64" width="560" height="86" rx="8" fill="#eef4f9" stroke="#4D6A8D" stroke-width="1.8"/>
  <text x="44" y="86" font-size="14" font-weight="bold" fill="#26384a">1. Browser / Angular SPA</text>
  <text x="44" y="106" font-size="12" fill="#3a4a5a">concurrency: 6 connections / host (HTTP/1.1)</text>
  <text x="44" y="126" font-size="12" fill="#3a4a5a">HttpClient timeout:</text>
  <text x="172" y="126" font-size="12" fill="#b5651d">none</text>
  <text x="206" y="126" font-size="12" fill="#3a4a5a">-&gt;</text>
  <text x="224" y="126" font-size="12" font-weight="bold" fill="#2f7a2f">40s</text>
  <text x="44" y="143" font-size="11" fill="#7a8794">top of the ladder: a clean error if the whole chain hangs</text>

  <!-- 2 BFF -->
  <rect x="28" y="158" width="560" height="86" rx="8" fill="#eef4f9" stroke="#4D6A8D" stroke-width="1.8"/>
  <text x="44" y="180" font-size="14" font-weight="bold" fill="#26384a">2. BFF (Node / Express)  --  2 replicas + shared redis session</text>
  <text x="44" y="200" font-size="12" fill="#3a4a5a">concurrency: single event loop; scale = replicas (NOT threads)</text>
  <text x="44" y="220" font-size="12" fill="#3a4a5a">proxy / request timeout:</text>
  <text x="196" y="220" font-size="12" fill="#b5651d">5min (default)</text>
  <text x="288" y="220" font-size="12" fill="#3a4a5a">-&gt;</text>
  <text x="306" y="220" font-size="12" font-weight="bold" fill="#2f7a2f">32s / 35s</text>
  <text x="44" y="237" font-size="11" fill="#7a8794">thin proxy: never retries (one retry layer = the gateway)</text>

  <!-- 3 Gateway -->
  <rect x="28" y="252" width="560" height="96" rx="8" fill="#eef7ee" stroke="#5a8a5a" stroke-width="1.8"/>
  <text x="44" y="274" font-size="14" font-weight="bold" fill="#26384a">3. Gateway (Spring Cloud Gateway / Netty -- REACTIVE)</text>
  <text x="44" y="294" font-size="12" fill="#3a4a5a">concurrency: event loop (~CPU count), non-blocking -- no request thread pool</text>
  <text x="44" y="313" font-size="12" fill="#3a4a5a">backend conn pool:</text>
  <text x="160" y="313" font-size="12" fill="#b5651d">default</text>
  <text x="206" y="313" font-size="12" fill="#3a4a5a">-&gt;</text>
  <text x="224" y="313" font-size="12" font-weight="bold" fill="#2f7a2f">~64 maxConnections</text>
  <text x="44" y="333" font-size="12" font-weight="bold" fill="#2f5a2f">deadline = CB TimeLimiter 10s normal / 30s slow  (THE ANCHOR);  connect 2s</text>

  <!-- 4 Service -->
  <rect x="28" y="356" width="560" height="116" rx="8" fill="#fbf2e7" stroke="#b5651d" stroke-width="1.8"/>
  <text x="44" y="378" font-size="14" font-weight="bold" fill="#26384a">4. Service (Spring MVC / Tomcat -- BLOCKING, thread-per-request)</text>
  <text x="44" y="398" font-size="12" fill="#3a4a5a">Tomcat threads.max:</text>
  <text x="172" y="398" font-size="12" fill="#b5651d">200 (default)</text>
  <text x="258" y="398" font-size="12" fill="#3a4a5a">-&gt;</text>
  <text x="276" y="398" font-size="12" font-weight="bold" fill="#2f7a2f">25</text>
  <text x="300" y="398" font-size="11" fill="#7a8794">(~2x pool: rule R2)</text>
  <text x="44" y="418" font-size="12" fill="#3a4a5a">Hikari pool / idle:</text>
  <text x="160" y="418" font-size="12" fill="#b5651d">20 / 20</text>
  <text x="212" y="418" font-size="12" fill="#3a4a5a">-&gt;</text>
  <text x="230" y="418" font-size="12" font-weight="bold" fill="#2f7a2f">10 / 2</text>
  <text x="282" y="418" font-size="12" fill="#3a4a5a">;  conn-timeout</text>
  <text x="378" y="418" font-size="12" fill="#b5651d">30s</text>
  <text x="406" y="418" font-size="12" fill="#3a4a5a">-&gt;</text>
  <text x="424" y="418" font-size="12" font-weight="bold" fill="#2f7a2f">5s</text>
  <text x="44" y="438" font-size="12" fill="#3a4a5a">query timeout (JDBC):</text>
  <text x="216" y="438" font-size="12" fill="#b5651d">none</text>
  <text x="250" y="438" font-size="12" fill="#3a4a5a">-&gt;</text>
  <text x="268" y="438" font-size="12" font-weight="bold" fill="#2f7a2f">8s</text>
  <text x="292" y="438" font-size="12" fill="#3a4a5a">;  JDBC socket</text>
  <text x="382" y="438" font-size="12" font-weight="bold" fill="#2f7a2f">35s + keepAlive</text>
  <text x="44" y="457" font-size="11" fill="#a23a2a">gap today: 200 threads contend for 20 conns; a stuck query pins a conn forever</text>

  <!-- 5 Postgres -->
  <rect x="28" y="480" width="560" height="80" rx="8" fill="#f4e9ef" stroke="#8a4d6a" stroke-width="1.8"/>
  <text x="44" y="502" font-size="14" font-weight="bold" fill="#26384a">5. PostgreSQL  (shared, single instance)</text>
  <text x="44" y="522" font-size="12" fill="#3a4a5a">max_connections:</text>
  <text x="156" y="522" font-size="12" font-weight="bold" fill="#26384a">200</text>
  <text x="190" y="522" font-size="12" fill="#3a4a5a">;  in use now:</text>
  <text x="282" y="522" font-size="12" fill="#a23a2a">186  (93% -- almost full)</text>
  <text x="44" y="541" font-size="12" fill="#3a4a5a">after right-sizing pools:</text>
  <text x="200" y="541" font-size="12" font-weight="bold" fill="#2f7a2f">~112</text>
  <text x="240" y="541" font-size="11" fill="#7a8794">(budget x0.8 = 160; room for a 3rd replica)</text>

  <!-- flow arrows down the left edge -->
  <line x1="18" y1="107" x2="18" y2="195" stroke="#5b6b7a" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="18" y1="201" x2="18" y2="296" stroke="#5b6b7a" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="18" y1="302" x2="18" y2="402" stroke="#5b6b7a" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="18" y1="408" x2="18" y2="516" stroke="#5b6b7a" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- ===== RIGHT: the timeout ladder (nested, outer waits longer) ===== -->
  <text x="790" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#26384a">Timeout ladder (rule R1)</text>
  <text x="790" y="102" text-anchor="middle" font-size="11" fill="#7a8794">each outer waits longer -> the INNER fails first -> clean error</text>

  <rect x="612" y="116" width="356" height="300" rx="8" fill="#f3f7fb" stroke="#4D6A8D" stroke-width="1.8"/>
  <text x="628" y="136" font-size="12.5" font-weight="bold" fill="#26384a">Browser 40s</text>

  <rect x="636" y="148" width="308" height="248" rx="7" fill="#eaf1f8" stroke="#4D6A8D" stroke-width="1.5"/>
  <text x="652" y="168" font-size="12.5" font-weight="bold" fill="#26384a">BFF 35s</text>

  <rect x="660" y="180" width="260" height="196" rx="6" fill="#eef7ee" stroke="#5a8a5a" stroke-width="1.5"/>
  <text x="676" y="200" font-size="12.5" font-weight="bold" fill="#2f5a2f">Gateway deadline 30s / 10s</text>
  <text x="676" y="216" font-size="10.5" fill="#5b6b7a">the anchor -- bounds the whole retry sequence</text>

  <rect x="684" y="228" width="212" height="128" rx="6" fill="#fbf2e7" stroke="#b5651d" stroke-width="1.5"/>
  <text x="700" y="248" font-size="12.5" font-weight="bold" fill="#8a4a10">DB query timeout 8s</text>
  <text x="700" y="266" font-size="10.5" fill="#5b6b7a">fires first; service returns a</text>
  <text x="700" y="280" font-size="10.5" fill="#5b6b7a">clean error up the chain</text>

  <rect x="708" y="296" width="164" height="44" rx="5" fill="#ffffff" stroke="#9aa7b3" stroke-width="1.3"/>
  <text x="724" y="314" font-size="11.5" fill="#26384a">query / acquire / send</text>
  <text x="724" y="330" font-size="10.5" fill="#7a8794">the actual blocking wait</text>

  <line x1="612" y1="392" x2="968" y2="392" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="624" y="408" font-size="11" fill="#c0392b">JDBC socketTimeout 35s -- hard backstop above the slow deadline</text>

  <!-- normal vs slow note -->
  <rect x="612" y="430" width="356" height="86" rx="8" fill="#fbf6e9" stroke="#c9881f" stroke-width="1.5"/>
  <text x="628" y="450" font-size="12.5" font-weight="bold" fill="#6a4a0f">Query timeout: 8s default, move tx = NONE (R6)</text>
  <text x="628" y="469" font-size="11" fill="#4a3a18">ONE global default -- NOT per-query tuning. JDBC timeout</text>
  <text x="628" y="486" font-size="11" fill="#4a3a18">works on PG + Oracle (Oracle has no statement_timeout).</text>
  <text x="628" y="502" font-size="11" fill="#4a3a18">move async tx opts out: path-table lock runs long.</text>

  <!-- ===== BOTTOM: DB budget + move semantics ===== -->
  <rect x="28" y="576" width="466" height="176" rx="8" fill="#fbf6e9" stroke="#c9881f" stroke-width="1.6"/>
  <text x="44" y="598" font-size="13.5" font-weight="bold" fill="#6a4a0f">DB connection budget (rule R3 -- the binding constraint)</text>
  <text x="44" y="620" font-size="11.5" fill="#4a3a18">SUM( pool x replicas ) + datakeep + admin  =&lt;  max_connections x 0.8</text>
  <text x="44" y="641" font-size="11.5" fill="#4a3a18">local: 200 x 0.8 = 160 usable for app pools</text>
  <text x="44" y="660" font-size="11.5" fill="#4a3a18">5 DB services x 2 replicas x 10  +  12 (datakeep)  =  112   OK</text>
  <text x="44" y="681" font-size="11.5" fill="#a23a2a">today: idle=20 holds 186 of 200 -- no headroom for a 3rd replica</text>
  <text x="44" y="704" font-size="11.5" fill="#4a3a18">fix: pool 20 -&gt; 10, idle 20 -&gt; 2  (biztree -&gt; 5: cache, low DB)</text>
  <text x="44" y="727" font-size="11" fill="#7a8794">Tomcat threads track the pool (R2); both shrink together.</text>
  <text x="44" y="744" font-size="11" fill="#7a8794">DB-bound services: effective concurrency = the pool, not the thread count.</text>

  <rect x="506" y="576" width="466" height="176" rx="8" fill="#eef4f9" stroke="#4D6A8D" stroke-width="1.6"/>
  <text x="522" y="598" font-size="13.5" font-weight="bold" fill="#26384a">k8s resources (rule R4) + move semantics</text>
  <text x="522" y="620" font-size="11.5" fill="#3a4a5a">Today: service pods (gateway incl.) have NO cpu/mem</text>
  <text x="522" y="637" font-size="11.5" fill="#3a4a5a">requests/limits -&gt; BestEffort QoS (first OOM-killed).</text>
  <text x="522" y="658" font-size="11.5" fill="#3a4a5a">Best: requests 250m/512Mi, limits 1/768Mi, -Xmx 512m;</text>
  <text x="522" y="675" font-size="11.5" fill="#3a4a5a">SUM(requests) =&lt; allocatable x 0.7 (node 24 vCPU / 16Gi).</text>
  <text x="522" y="696" font-size="11.5" fill="#3a4a5a">CPU limits are the precondition for an HPA later.</text>
  <text x="522" y="719" font-size="11.5" font-weight="bold" fill="#2f5a2f">move = async 202 ACK; durability via the move queue,</text>
  <text x="522" y="736" font-size="11.5" font-weight="bold" fill="#2f5a2f">NOT the REST deadline -- so move is a fast, normal call.</text>
</svg>
