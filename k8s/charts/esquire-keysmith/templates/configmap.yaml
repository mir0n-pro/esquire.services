apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-keysmith-config
  labels:
    app: {{ .Release.Name }}-keysmith
data:
  SPRING_PROFILES_ACTIVE:         {{ .Values.springProfilesActive | default "" | quote }}
  KEYSMITH_PORT:                  {{ .Values.service.port | quote }}
  TOPOLOGY_IMPORT:        {{ .Values.topologyImport | quote }}
  # --- datasource (password -> Secret, injected as env in the deployment) ---
  DB_KEYSMITH_VENDOR:             {{ .Values.db.vendor | quote }}
  DB_KEYSMITH_HOST:               {{ .Values.db.host | quote }}
  DB_KEYSMITH_PORT:               {{ .Values.db.port | quote }}
  DB_KEYSMITH_NAME:               {{ .Values.db.name | quote }}
  DB_KEYSMITH_USERNAME:           {{ .Values.db.username | quote }}
  # --- resilience (R1-R5): timeout ladder / pool sizing / fail-fast DB ---
  ESQ_TX_TIMEOUT_S:               {{ .Values.resilience.txTimeoutSeconds | quote }}
  ESQ_TOMCAT_MAX_THREADS:         {{ .Values.resilience.tomcatMaxThreads | quote }}
  ESQ_TOMCAT_ACCEPT_COUNT:        {{ .Values.resilience.tomcatAcceptCount | quote }}
  ESQ_DB_POOL_MAX:                {{ .Values.resilience.dbPoolMax | quote }}
  ESQ_DB_POOL_MIN_IDLE:           {{ .Values.resilience.dbPoolMinIdle | quote }}
  ESQ_DB_CONNECT_TIMEOUT_MS:      {{ .Values.resilience.dbConnectTimeoutMs | quote }}
  ESQ_DB_SOCKET_TIMEOUT_S:        {{ .Values.resilience.dbSocketTimeoutSeconds | quote }}
  ESQ_DB_TCP_KEEPALIVE:           {{ .Values.resilience.dbTcpKeepAlive | quote }}
  # --- v1.2.10 VT (UNVALIDATED test lever, default OFF -- see HA doc 5.5) ---
  ESQ_VIRTUAL_THREADS:            {{ .Values.esqVirtualThreads | quote }}
  # --- kc-bus ref (CLIENT: post URQ / receive URS) ---
  KC_BUS_ID:                      {{ .Values.kc.busId | quote }}
  KC_SLOT_ID:                  {{ .Values.kc.slotId | quote }}
  KEYSMITH_KC_RESPONSE_POOL_SIZE: {{ .Values.kc.responsePoolSize | quote }}
  KEYSMITH_KC_RESPONSE_CONCURRENCY:  {{ .Values.kc.responseConcurrency | quote }}
  KEYSMITH_KC_PUBLISHER_POOL_SIZE:   {{ .Values.kc.publisherPoolSize | quote }}
  KC_SEND_RETRY:                  {{ .Values.kc.sendRetry | quote }}
  KC_SEND_RETRY_BACKOFF_SEC:          {{ .Values.kc.sendRetryBackoff | quote }}
  KC_SEND_RETRY_MAX_ATTEMPTS:     {{ .Values.kc.sendRetryMaxAttempts | quote }}
  KC_POOL_MODE:                   {{ .Values.kc.poolMode | quote }}
  # --- audit-bus ref + in-process (b) knobs ---
  AUDIT_BUS_ID:           {{ .Values.audit.busId | quote }}
  AUDIT_SLOT_ID:       {{ .Values.audit.slotId | quote }}
  AUDIT_POOL_SIZE:        {{ .Values.audit.poolSize | quote }}
  AUDIT_FEED_CAPACITY:    {{ .Values.audit.feedCapacity | quote }}
  AUDIT_POOL_MODE:        {{ .Values.audit.poolMode | quote }}
  DB_DATAKEEP_URL:       {{ .Values.audit.datasource.url | quote }}
  DB_DATAKEEP_USERNAME:  {{ .Values.audit.datasource.username | quote }}
  DB_DATAKEEP_POOL_SIZE: {{ .Values.audit.datasource.poolSize | quote }}
  # DB_DATAKEEP_PASSWORD: chains from DB_KEYSMITH_PASSWORD (Secret) via application.yml
  # --- logging ---
  LOG_LEVEL_ROOT:                 {{ .Values.logging.levelRoot | quote }}
  LOG_LEVEL_SF:                   {{ .Values.logging.levelSf | quote }}
  LOG_LEVEL_MIR0N:                {{ .Values.logging.levelMir0n | quote }}
  LOG_LEVEL_DEVELOP:              {{ .Values.logging.levelDevelop | quote }}
  LOG_LEVEL_MSG:                  {{ .Values.logging.levelMsg | quote }}
  LOG_LEVEL_AMQ:                  {{ .Values.logging.levelAmq | quote }}
  LOG_LEVEL_JMS:                  {{ .Values.logging.levelJms | quote }}
  DEVELOP_LOG_PATH:               {{ .Values.logging.developLogPath | quote }}
  MSG_LOG_PATH:                   {{ .Values.logging.msgLogPath | quote }}
  # --- v1.2.11 O2 distributed tracing (opt-in; OFF by default; o11y-on enables it) ---
  ESQ_OBSERVABILITY_ENABLED:  {{ .Values.observability.enabled | quote }}
  ESQ_OTLP_ENDPOINT:          {{ .Values.tracing.otlpEndpoint | quote }}
  ESQ_TRACING_SAMPLING_RATIO: {{ .Values.tracing.samplingRatio | quote }}
  ESQ_TRACING_MARKS_ENABLED:  {{ .Values.tracing.marksEnabled | quote }}
  ESQ_TRACING_EXCLUDED_PATHS: {{ .Values.tracing.excludedPaths | quote }}
