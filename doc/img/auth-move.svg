<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 656" font-family="Calibri, Segoe UI, sans-serif">
  <defs>
    <marker id="arw" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" refX="10" refY="4.5" orient="auto">
      <path d="M0,0 L10,4.5 L0,9 Z" fill="#6ca43d"/>
    </marker>
  </defs>
  <style>
    .hdr{fill:#5b9bd5;stroke:#41719c;stroke-width:1.5}
    .hdrtxt{fill:#ffffff;font-weight:bold;font-size:15px}
    .life{stroke:#5592c9;stroke-width:1.2;stroke-dasharray:4,3}
    .msg{stroke:#6ca43d;stroke-width:1.7;fill:none;marker-end:url(#arw)}
    .mt{fill:#2b2b2b;font-size:12.5px}
    .note{fill:#fff3cd;stroke:#e0c068;stroke-width:1}
    .nt{fill:#5b4a00;font-size:12px}
    .race{fill:#fde2e2;stroke:#d98b8b;stroke-width:1.2}
    .racet{fill:#7a2b2b;font-size:12px}
    .title{fill:#1f3864;font-size:18px;font-weight:bold}
    .stk1{fill:#9ec3e6;stroke:#5a8bc0;stroke-width:1}
    .stk2{fill:#c5daf0;stroke:#7ba7d4;stroke-width:1}
    .xn{fill:#dbe9f7;font-size:10px}
    .leg{fill:#eef2f7;stroke:#c9d6e5;stroke-width:1}
    .legt{fill:#404040;font-size:11.5px}
    .legb{fill:#1f3864;font-size:11.5px;font-weight:bold}
    .div{stroke:#b0b0b0;stroke-width:1.2;stroke-dasharray:7,4}
    .divbox{fill:#eef2f7;stroke:#b0b0b0;stroke-width:1}
    .divtxt{fill:#404040;font-size:12px;font-style:italic}
  </style>

  <text class="title" x="20" y="28">Move a user -- rootpath synchronization (+ create-while-move safety-net)</text>

  <g>
    <rect class="hdr" x="20"  y="44" width="140" height="34" rx="5"/><text class="hdrtxt" x="90"  y="66" text-anchor="middle">UI</text><line class="life" x1="90"  y1="78" x2="90"  y2="590"/>
    <rect class="stk2" x="203" y="34" width="140" height="34" rx="5"/><rect class="stk1" x="199" y="39" width="140" height="34" rx="5"/><rect class="hdr" x="195" y="44" width="140" height="34" rx="5"/><text class="hdrtxt" x="265" y="66" text-anchor="middle">enyMan</text><text class="xn" x="329" y="55" text-anchor="end">xN</text><line class="life" x1="265" y1="78" x2="265" y2="590"/>
    <rect class="hdr" x="370" y="44" width="140" height="34" rx="5"/><text class="hdrtxt" x="440" y="66" text-anchor="middle">esq2025</text><line class="life" x1="440" y1="78" x2="440" y2="590"/>
    <rect class="stk2" x="553" y="34" width="140" height="34" rx="5"/><rect class="stk1" x="549" y="39" width="140" height="34" rx="5"/><rect class="hdr" x="545" y="44" width="140" height="34" rx="5"/><text class="hdrtxt" x="615" y="66" text-anchor="middle">kcMaster</text><text class="xn" x="679" y="55" text-anchor="end">xN</text><line class="life" x1="615" y1="78" x2="615" y2="590"/>
    <rect class="hdr" x="720" y="44" width="140" height="34" rx="5"/><text class="hdrtxt" x="790" y="66" text-anchor="middle">KeyCloak</text><line class="life" x1="790" y1="78" x2="790" y2="590"/>
  </g>

  <line class="msg" x1="90" y1="122" x2="261" y2="122"/>
  <text class="mt" x="176" y="109" text-anchor="middle">POST /esq-command</text>
  <text class="mt" x="176" y="118" text-anchor="middle" font-size="11">MOVE (subtree)</text>

  <line class="msg" x1="265" y1="172" x2="436" y2="172"/>
  <text class="mt" x="352" y="159" text-anchor="middle">update ep_path</text>
  <text class="mt" x="352" y="168" text-anchor="middle" font-size="11">(subtree, parents-first)</text>

  <line class="msg" x1="265" y1="226" x2="611" y2="226"/>
  <text class="mt" x="440" y="213" text-anchor="middle">URQ - EVENT_UPDATE_PATH   (authoritative)</text>
  <text class="mt" x="440" y="222" text-anchor="middle" font-size="11">over the IAM request bus</text>

  <line class="msg" x1="615" y1="274" x2="786" y2="274"/>
  <text class="mt" x="702" y="261" text-anchor="middle">re-stamp esq_rootpath</text>
  <text class="mt" x="702" y="270" text-anchor="middle" font-size="11">(if the KC user exists)</text>

  <line class="div" x1="20" y1="316" x2="860" y2="316"/>
  <rect class="divbox" x="250" y="304" width="380" height="24" rx="4"/>
  <text class="divtxt" x="440" y="320" text-anchor="middle">create-while-move safety-net (the race-8c fix)</text>

  <line class="msg" x1="265" y1="366" x2="611" y2="366"/>
  <text class="mt" x="440" y="353" text-anchor="middle">entity broadcast - EVENT_UPDATE_PATH   (topic)</text>
  <text class="mt" x="440" y="362" text-anchor="middle" font-size="11">fan-out copy of the same move</text>

  <!-- self-message: park in buffer -->
  <path class="msg" d="M615,392 h46 v26 h-42"/>
  <text class="mt" x="668" y="404" font-size="11">park in</text>
  <text class="mt" x="668" y="416" font-size="11">KcPathBuffer</text>

  <rect class="race" x="20" y="446" width="840" height="70" rx="6"/>
  <text class="racet" x="34" y="468" font-weight="bold">The race we fought (race-8c): a user created WHILE being moved.</text>
  <text class="racet" x="34" y="486">If the KC identity does not exist yet, the authoritative URQ silently skips -- so the broadcast copy parks the new</text>
  <text class="racet" x="34" y="502">path in KcPathBuffer (per kcMaster pod). The next keySmith CREATE URQ flushes the buffer and applies the</text>
  <text class="racet" x="34" y="518">post-move path, so the relocation is never lost. When the user already exists, the URQ owns it and the topic stays passive.</text>

  <rect class="leg" x="20" y="540" width="840" height="42" rx="5"/>
  <text class="legt" x="30" y="559"><tspan class="legb">Redundancy:</tspan> enyMan and kcMaster run at N replicas (stacked). The URQ is competing-consumed by ONE kcMaster;</text>
  <text class="legt" x="30" y="575">the entity topic fans out to EVERY kcMaster replica, each with its own KcPathBuffer -- which is why the race-8c fix is per-pod.</text>
</svg>
