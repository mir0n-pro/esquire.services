# Grafana UI for the T1 observability stack (local/dev k8s only).
image:
  repository: grafana/grafana
  tag: "11.5.2"
  pullPolicy: IfNotPresent
admin:
  user: admin
  password: admin
ingress:
  # Browsers resolve *.localhost -> 127.0.0.1 (RFC 6761); ingress-nginx binds localhost:80.
  host: grafana.localhost
loki:
  url: http://esquire-infra-loki:3100
tempo:
  url: http://esquire-infra-tempo:3200
prometheus:
  url: http://esquire-infra-prometheus:9090

# Resource budget -- MEASURED on local k8s under a 200-VU super-load (2026-07-14), not guessed: peak RSS
# 118Mi and peak 0.04 cores at 657 rps, and the box tops out near 1130 rps with observability on, so the
# limits carry headroom over that ceiling rather than over the sample. Requests are the RESERVATION the
# scheduler holds; limits are the CEILING. With neither, this pod runs BestEffort -- no reservation, no
# ceiling, competing for the very CPU the JVMs are capped on, and FIRST in line to be evicted under the load
# that most needs observing.
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Storage is the SYSTEM ADMIN's choice -- Esquire does not dictate it. The default is emptyDir: history lives
# and dies with the pod, which is the right default for a dev/demo stack and costs nothing. Set
# persistence.enabled=true (with a storageClass and size that suit the cluster) to keep it across restarts.
persistence:
  enabled: false
  storageClass: ""          # "" = the cluster default StorageClass
  size: 2Gi

# The topology board, overridable per SHAPE. Empty = use the chart's own dashboards/esquire-topology.json,
# which is the local-k8s COMPACT board. The OKE launcher passes the super-compact board here with
# --set-file dashboardTopology=grafana/esquire-topology.json -- same chart, the picture its cluster runs.
dashboardTopology: ""
