spring:
  profiles:
    active: ${DB_KEYSMITH_VENDOR:dev-postgres}
  application:
    name: keysmith
  # Request-path query/transaction cap (seconds): -1 = no cap (pre-HA default; behaviour unchanged when unset).
  # Set ESQ_TX_TIMEOUT_S (e.g. 8) to bound the common request path so a stuck query frees its worker + connection.
  transaction:
    default-timeout: ${ESQ_TX_TIMEOUT_S:-1}
  config:
    import: "${TOPOLOGY_IMPORT:optional:file:/etc/esquire/topology.yml}"
keysmith:
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  mvc:
    problemdetails:
      enabled: true
  # this service's OWN overlay of the global esquire.messaging-bus catalog: its in-process audit-b leg
  # (datasource is service-specific), under the service namespace.
  messaging-bus:
    - bus-id: audit-b
      slots:
        - slot-id: audit
          x-rod:
            rod-class: pro.mir0n.esquire.dataKeep.keep.XRodInProcessKeep
            director: pro.mir0n.esquire.audit.AuditKeepDirector
            pool-size: ${AUDIT_POOL_SIZE:4}
            feed-capacity: ${AUDIT_FEED_CAPACITY:4096}
            virtual-threads: ${AUDIT_VIRTUAL_THREADS:false}
            datasource:
              # the keep's OWN dedicated *_log pool, from the url/hikari below.
              url: ${DB_DATAKEEP_URL:jdbc:postgresql://${DB_KEYSMITH_HOST:localhost}:${DB_KEYSMITH_PORT:5432}/${DB_KEYSMITH_NAME:esq2025}}
              username: ${DB_DATAKEEP_USERNAME:${DB_KEYSMITH_USERNAME:esq2025}}
              password: ${DB_DATAKEEP_PASSWORD:${DB_KEYSMITH_PASSWORD:q}}
              # per-apply statement cap (seconds): 0 = uncapped (pre-HA default). The keep surface of the cap.
              query-timeout-seconds: ${ESQ_KEEP_QUERY_TIMEOUT_S:0}
              hikari:
                maximum-pool-size: ${DB_DATAKEEP_POOL_SIZE:2}
esquire:
  audit-bus:
    messaging-bus:
      bus-id: ${AUDIT_BUS_ID:audit-b}
      slot-id: ${AUDIT_SLOT_ID:audit}
      role: SERVER   # the service is the audit SERVER: it broadcasts its log events (in-process keep applies them)
  kc-bus:
    messaging-bus:
      bus-id: ${KC_BUS_ID:esquire.kc}
      slot-id: ${KC_SLOT_ID:kc}
      role: CLIENT
      x-rod:
        pool-size: ${KEYSMITH_KC_RESPONSE_POOL_SIZE:2}
        concurrency: ${KEYSMITH_KC_RESPONSE_CONCURRENCY:1}
        publisher-pool-size: ${KEYSMITH_KC_PUBLISHER_POOL_SIZE:0}
        # producer send-retry on the KC R&R bus (the CLIENT request leg); opt-in, default OFF here, ON in docker +
        # the local-k8s overlay -- OKE stays on this pre-HA default. Block mode (max-attempts 0): hold + retry over
        # the backoff ladder until the broker recovers so the KC sync request still goes through. A request
        # replayed after the caller's reply timeout still does the work; the late reply is orphaned (no
        # correlation) and the KC sync is idempotent.
        send-retry: ${KC_SEND_RETRY:false}
        send-retry-backoff: ${KC_SEND_RETRY_BACKOFF:1,2,5,5}
        send-retry-max-attempts: ${KC_SEND_RETRY_MAX_ATTEMPTS:0}
logging:
  level:
    root: ${LOG_LEVEL_ROOT:ERROR}
    org:
      springframework: ${LOG_LEVEL_SF:ERROR}
      springframework.jms: ${LOG_LEVEL_JMS:ERROR}
      apache:
        activemq: ${LOG_LEVEL_AMQ:ERROR}
    pro:
      mir0n: ${LOG_LEVEL_MIR0N:ERROR}
    develop: ${LOG_LEVEL_DEVELOP:DEBUG}
    msg: ${LOG_LEVEL_MSG:INFO}
  develop:
    log-path: ${DEVELOP_LOG_PATH:logs/keySmith-develop.log}
  msg:
    log-path: ${MSG_LOG_PATH:logs/keySmith-msg.log}
management:
  endpoint:
    health:
      probes:
        enabled: true               # expose the liveness + readiness health groups
      show-details: always
      # messagingBus is registered DYNAMICALLY at ApplicationReadyEvent (after the membership-validating context
      # refresh), so the startup check must be off; the readiness group resolves it at request time.
      validate-group-membership: false
      group:
        # bus health depools the pod (READINESS), never liveness -- a broker outage must not let liveness kill it.
        readiness:
          include: readinessState, messagingBus

---
# Development Oracle
spring:
  config:
    activate:
      on-profile: dev-oracle
  datasource:
    url: jdbc:oracle:thin:@//${DB_KEYSMITH_HOST:localhost}:${DB_KEYSMITH_PORT:1521}/${DB_KEYSMITH_NAME:MIR0N}
    driverClassName: oracle.jdbc.OracleDriver
    username: ${DB_KEYSMITH_USERNAME:esq2025}
    password: ${DB_KEYSMITH_PASSWORD:q}
    hikari:
      # pool sizing + connect-timeout: pre-HA defaults = current values; HA values (smaller pool, fast
      # connect-timeout) set per service in the local-k8s chart (R3/R5).
      maximum-pool-size: ${ESQ_DB_POOL_MAX:20}
      minimum-idle: ${ESQ_DB_POOL_MIN_IDLE:20}
      connection-timeout: ${ESQ_DB_CONNECT_TIMEOUT_MS:30000}
      max-lifetime: 1800000
      idle-timeout: 600000
  jpa:
    mapping-resources:
      - META-INF/oracle-access-profile.xml
      - META-INF/oracle-roles.xml
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
server:
  port: ${KEYSMITH_PORT:3000}
  tomcat:
    threads:
      # request worker threads (pre-HA default = Boot's 200). HA bounds the worker pool so a slow
      # downstream cannot exhaust threads fleet-wide; local-k8s value set in the chart (R2).
      max: ${ESQ_TOMCAT_MAX_THREADS:200}
    accept-count: ${ESQ_TOMCAT_ACCEPT_COUNT:100}

---
# Development Postgres
spring:
  config:
    activate:
      on-profile: dev-postgres
  datasource:
    url: jdbc:postgresql://${DB_KEYSMITH_HOST:localhost}:${DB_KEYSMITH_PORT:5432}/${DB_KEYSMITH_NAME:esq2025}
    username: ${DB_KEYSMITH_USERNAME:esq2025}
    password: ${DB_KEYSMITH_PASSWORD:q}
    hikari:
      # pool sizing + connect-timeout: pre-HA defaults = current values; HA values (smaller pool, fast
      # connect-timeout) set per service in the local-k8s chart (R3/R5).
      maximum-pool-size: ${ESQ_DB_POOL_MAX:20}
      minimum-idle: ${ESQ_DB_POOL_MIN_IDLE:20}
      connection-timeout: ${ESQ_DB_CONNECT_TIMEOUT_MS:30000}
      max-lifetime: 1800000
      idle-timeout: 600000
      # pgjdbc socketTimeout (s) + tcpKeepAlive: pre-HA defaults = off (0 / false). HA (local-k8s chart)
      # makes a vanished DB fail fast on a half-open socket instead of hanging a worker (R1/R5).
      data-source-properties:
        socketTimeout: ${ESQ_DB_SOCKET_TIMEOUT_S:0}
        tcpKeepAlive: ${ESQ_DB_TCP_KEEPALIVE:false}
  jpa:
    mapping-resources:
      - META-INF/postgres-access-profile.xml
      - META-INF/postgres-roles.xml
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
server:
  port: ${KEYSMITH_PORT:3000}
  tomcat:
    threads:
      # request worker threads (pre-HA default = Boot's 200). HA bounds the worker pool so a slow
      # downstream cannot exhaust threads fleet-wide; local-k8s value set in the chart (R2).
      max: ${ESQ_TOMCAT_MAX_THREADS:200}
    accept-count: ${ESQ_TOMCAT_ACCEPT_COUNT:100}
