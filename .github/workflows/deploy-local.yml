# Esquire services -- deploy to the LOCAL targets (phase 2): docker-compose AND Docker Desktop k8s.
# On an intermediate commit (push to a pending-** branch), a SELF-HOSTED runner on the dev box builds
# the full stack and brings it up on BOTH local targets and runs the e2e suite against each, so a green
# pipeline proves both environments come up on the pending code AND still behave -- the two Token Relay
# specs included, which no other pipeline runs. Full stack = the 6 Java services + the explorer backend/BFF (plus the
# explorer frontend container on docker-compose), so the explorer repo is checked out alongside this one.
#
# SECURITY (public repo + self-hosted runner): triggers ONLY on push to our own pending-** branches,
# NEVER on pull_request -- a fork PR cannot push to our branches, so it can never run on the runner.
# Design: doc/Esquire.GitHubActions.md (sections 4.2, 9a). Logic: .github/scripts/deploy-local.cmd
# (reuses k8s/*.bat) for k8s, and .github/scripts/deploy-compose.cmd (reuses compose/compose-rebuild.bat)
# for docker-compose -- the *.bat scripts remain the single source of deploy logic.
name: Deploy local

on:
  push:
    branches:
      - "pending-**"

# Serialize deploys; do NOT cancel a deploy already in flight (helm/k8s mid-rollout).
concurrency:
  group: deploy-local
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-local:
    # The self-hosted runner on the Windows dev box (Docker Desktop k8s). Matches on the built-in
    # self-hosted + windows labels; with a single runner no custom label is needed.
    runs-on: [self-hosted, windows]
    steps:
      - name: Checkout services
        uses: actions/checkout@v5
        with:
          path: services

      # explorer (backend/BFF image) and db.seed (the postgres-image build input, NOT a deployed service)
      # both live in sibling repos. A sprint that touches them has a same-named pending branch; a sprint that
      # does not has none, and must still deploy. The ref is RESOLVED first -- ls-remote asks which branch is
      # there -- so each repo is checked out once, at a ref known to exist. Checking out a guess and letting
      # it fail painted two red Error lines and a 12-second retry into every otherwise green run.
      #
      # Both spellings are tried because the branch is named pending-1.2.13 here and may be pending-v1.2.13
      # there; develop is the answer when neither exists.
      - name: Resolve the explorer / db.seed refs
        id: refs
        shell: bash
        run: |
          ref="${{ github.ref_name }}"
          case "$ref" in
            pending-v*) alt="pending-${ref#pending-v}" ;;
            pending-*)  alt="pending-v${ref#pending-}" ;;
            *)          alt="$ref" ;;
          esac

          pick() {
            got=""
            for cand in "$ref" "$alt"; do
              if [ -z "$got" ] && git ls-remote --heads --exit-code "https://github.com/$1" "refs/heads/$cand" >/dev/null 2>&1; then
                got="$cand"
              fi
            done
            if [ -z "$got" ]; then
              got="develop"
            fi
            echo "$got"
          }

          explorer="$(pick mir0n-pro/esquire.explorer)"
          dbseed="$(pick mir0n-pro/esquire.db.seed)"
          echo "explorer=$explorer" >> "$GITHUB_OUTPUT"
          echo "dbseed=$dbseed"     >> "$GITHUB_OUTPUT"
          echo "explorer -> $explorer"
          echo "db.seed  -> $dbseed"

      - name: Checkout explorer
        uses: actions/checkout@v5
        with:
          repository: mir0n-pro/esquire.explorer
          ref: ${{ steps.refs.outputs.explorer }}
          path: explorer

      - name: Checkout db.seed
        uses: actions/checkout@v5
        with:
          repository: mir0n-pro/esquire.db.seed
          ref: ${{ steps.refs.outputs.dbseed }}
          path: db.seed

      # Say what was actually checked out. A deploy that silently substitutes develop is the failure this guards.
      - name: Report the refs used
        shell: bash
        run: |
          for d in explorer db.seed; do
            cd "$d"
            echo "$d built from: $(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo detached) @ $(git rev-parse --short HEAD)"
            cd ..
          done

      - name: Build + bring up the full stack on Docker Desktop k8s
        shell: cmd
        # deploy-local.cmd calls k8s\k8s-up.bat and k8s-compact\k8s-up.bat, and both REFUSE to run
        # without this: esq-kcMaster is the one published client holding realm-admin, so no deploy
        # path may fall back to the published value or silently keep an installed one.
        #
        # Passed EXPLICITLY rather than left to the runner's environment. A Windows service inherits
        # its environment when it starts, so a variable added on the machine afterwards is invisible
        # until the service restarts -- a dependency on machine state that survives no reinstall and
        # explains nothing when it breaks.
        env:
          KCMASTER_ADMIN_SECRET: ${{ secrets.KCMASTER_ADMIN_SECRET }}
        run: services\.github\scripts\deploy-local.cmd

      - name: Build + bring up the docker-compose stack
        shell: cmd
        run: services\.github\scripts\deploy-compose.cmd

      # --- e2e on BOTH local targets -------------------------------------------------------------
      # Both bring-ups run first and always complete: a failing test gates the commit, it never leaves
      # one of the two stacks undeployed.

      # BOTH e2e steps carry the admin secret because 21-credential-state-sync asserts through the
      # KeyCloak admin API and no longer defaults to the published value -- it throws without it.
      #
      # ONE VALUE SERVES BOTH TARGETS ONLY WHILE THE REALMS AGREE. Local k8s and docker import the
      # committed realm; the GitHub secret happens to hold that same value today. Rotate esq-kcMaster
      # anywhere and these two need the LOCAL realm's secret, not the rotated one.
      - name: e2e -- Playwright vs Docker Desktop k8s
        shell: cmd
        working-directory: explorer\e2e-test
        env:
          KC_ADMIN_SECRET: ${{ secrets.KCMASTER_ADMIN_SECRET }}
        run: e2e-k8s.bat

      - name: e2e -- Playwright vs docker-compose
        shell: cmd
        working-directory: explorer\e2e-test
        env:
          KC_ADMIN_SECRET: ${{ secrets.KCMASTER_ADMIN_SECRET }}
        run: e2e-test.bat
