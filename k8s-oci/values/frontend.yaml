# Prod overrides for k8s/charts/esquire-frontend
image:
  repository: ghcr.io/mir0n-pro/esquire.frontend
  tag: "v1.2.2"
  pullPolicy: Always

service:
  type: ClusterIP            # behind ingress-nginx; no public LB
  port: 80
  lbPort: 80                 # unused when type=ClusterIP

# Same-origin in prod -- ingress fronts both /api and /auth
config:
  apiBasePath: https://esquire.mir0n.pro/api
  keycloakUrl: https://esquire.mir0n.pro/auth
  keycloakRealm: esquire
  keycloakClientId: esq-angular

nodeSelector:
  tier: app
