# Esquire frameworks (tm) -- messaging-bus TOPOLOGY (OKE / cloud environment)
#
# Fed into the esquire-topology chart via `helm --set-file topologyContent=...` by deploy-oke.sh, delivered as
# the ConfigMap "esquire-topology" and mounted at /etc/esquire/topology.yml in every service pod (REQUIRED
# spring.config.import). In-cluster Service DNS names (ActiveMQ only).
#
# OKE audits via DB TRIGGERS (option a): the app producers run with audit OFF and there is NO auKeep pod, so there
# is no live audit bus. Each producer points its audit-bus ref (AUDIT_BUS_ID) at the explicit "audit-off" DISABLED
# bus below -- XRodDisabled is a true no-op. The disabled bus MUST be defined here: the v1.2.9 facade fail-fasts on
# a role-declaring ref whose bus-id is blank/undefined (it never silently no-ops). The live cross-service buses are
# entity broadcast and the KeyCloak request/response.
esquire:
  messaging-bus:
    # --- entity broadcast (topic) ---
    - bus-id: esquire.entity
      slots:
        - slot-id: entity
          x-rod:
            receiver-pool:
              size: 4
              mode: platform
            concurrency: 1
            publisher-pool:
              size: 0
              mode: platform
            transport:
              provider: activemq
              # failover: so a broker restart/bounce SELF-HEALS -- the transport reconnects under the cached
              # connection and send-retry bridges the gap. Same as compose / local-k8s; OKE had drifted to plain
              # tcp:// (no reconnect), which turned a broker blip into a depooling outage (audit F0 B1). 07-20.
              endpoint: failover:(tcp://esquire-infra-amq-activemq:61616)?timeout=3000
              destination: esquire.entity.broadcast
              params:
                pubSubDomain: true
                # enyMan runs both legs (publish + listen) on ONE shared connection, so the broker drops its OWN
                # publications -- the moving instance reconciles only a PEER instance's create-during-move. Inert
                # for pure consumers (bizTree / kcMaster publish nothing) and publish-only producers (no consumer).
                noLocal: true
                # MUST agree with the broker (activemq.xml: persistent="false") -- a persistent send is synchronous
                # and buys nothing against the in-memory broker. Matches compose / local-k8s.
                persistent: false
    # --- KeyCloak request/response (R&R, two nodes) ---
    - bus-id: esquire.kc
      slots:
        - slot-id: kc
          x-rod:
            rod-class: XRodRR
            receiver-pool:
              size: 4
              mode: platform
            concurrency: 1
            publisher-pool:
              size: 0
              mode: platform
            transport:
              provider: activemq
              # failover: -- self-heal on a broker bounce (see the entity bus above). Matches compose / local-k8s.
              endpoint: failover:(tcp://esquire-infra-amq-activemq:61616)?timeout=3000
              request-node: request
              response-node: response
              params:
                # MUST agree with the broker (activemq.xml: persistent="false"). Matches compose / local-k8s.
                persistent: false
              nodes:
                - node-id: request
                  destination: esquire.kc.request
                - node-id: response
                  destination: esquire.kc.response
    # --- audit (off): the explicit DISABLED bus. Producers point AUDIT_BUS_ID at audit-off to run with NO bus
    #     audit (OKE audits via DB triggers instead). XRodDisabled is a true no-op. Must be explicitly defined --
    #     a blank/undefined audit bus-id fails fast in v1.2.9.
    - bus-id: audit-off
      slots:
        - slot-id: audit
          x-rod:
            rod-class: XRodDisabled
