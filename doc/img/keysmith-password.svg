<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 344" width="624" height="275" font-family="Calibri, Segoe UI, sans-serif">
  <defs>
    <marker id="arw" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" refX="10" refY="4.5" orient="auto">
      <path d="M0,0 L10,4.5 L0,9 Z" fill="#6ca43d"/>
    </marker>
  </defs>
  <style>
    .state{fill:#5b9bd5;stroke:#41719c;stroke-width:1.5}
    .stt{fill:#ffffff;font-weight:bold;font-size:22px}
    .sts{fill:#eaf2fb;font-size:11px}
    .edge{stroke:#6ca43d;stroke-width:1.9;fill:none;marker-end:url(#arw)}
    .et{fill:#2b2b2b;font-size:13px}
    .es{fill:#57606a;font-size:11.5px}
    .title{fill:#1f3864;font-size:18px;font-weight:bold}
    .note{fill:#fff3cd;stroke:#e0c068;stroke-width:1}
    .nt{fill:#5b4a00;font-size:11.5px}
  </style>

  <text class="title" x="20" y="28">Reset password  au_force_change_flg  (N | Y)</text>

  <rect class="state" x="90"  y="118" width="170" height="72" rx="12"/>
  <text class="stt" x="175" y="150" text-anchor="middle">N</text>
  <text class="sts" x="175" y="172" text-anchor="middle">no forced change</text>

  <rect class="state" x="520" y="118" width="170" height="72" rx="12"/>
  <text class="stt" x="605" y="150" text-anchor="middle">Y</text>
  <text class="sts" x="605" y="172" text-anchor="middle">KC UPDATE_PASSWORD set</text>

  <path class="edge" d="M260,138 C 360,92 420,92 516,136"/>
  <text class="et" x="388" y="84" text-anchor="middle">admin forces a reset</text>
  <text class="es" x="388" y="100" text-anchor="middle">POST /esq-key-save { pwdChangeForced: "Y" }</text>

  <path class="edge" d="M520,176 C 420,222 360,222 264,178"/>
  <text class="et" x="392" y="234" text-anchor="middle">user changes password in KeyCloak, then the flag clears</text>
  <text class="es" x="392" y="250" text-anchor="middle">on the next self-read  (GET /esq-key, id = null)</text>

  <rect class="note" x="90" y="284" width="600" height="44" rx="5"/>
  <text class="nt" x="102" y="302">Two steps: KeyCloak clears its UPDATE_PASSWORD required action when the user sets a new</text>
  <text class="nt" x="102" y="318">password; keySmith clears the DB flag (Y -&gt; N) on the user's next self-read.</text>
</svg>
