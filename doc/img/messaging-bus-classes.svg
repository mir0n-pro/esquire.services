  <rect x="305" y="44" width="250" height="312" rx="9" fill="#fbfcfd" stroke="#c3cedb" stroke-width="1.4"/>
  <rect x="305" y="44" width="250" height="26" rx="9" fill="#4D6A8D"/>
  <text x="430" y="62" text-anchor="middle" font-weight="600" fill="#ffffff">messaging &#8212; bus model &amp; catalog</text>

