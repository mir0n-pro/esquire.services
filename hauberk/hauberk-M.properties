# Phantom Token Relay overlay (deltas only; base URLs inherit from hauberk.properties = docker).
#
# The harness presents a Bearer token for esq-hauberk-M at the edge; the gateway runs an RFC 8693
# token-exchange authenticated as the dedicated esq-gw-exchange confidential client, caches per jti, and
# forwards the exchanged JWT downstream. Requires the gateway's phantom allowlist (ESQ_GW_PHANTOM_CLIENTS)
# to include esq-hauberk-M -- which the compose / chart config already does. Lights
# esq.biz.gw.tokenrelay.* (result=hit|miss, outcome=ok).
#
#   Run:  hauberk.cmd run super-load --config hauberk-M.properties
#
# (For a k8s run, combine with the k8s base by also overriding kc.base / gw.base / bff.base here, or run
#  the relay via the e2e gate which covers both targets.)

tokenRelay.type=phantom
kc.client.id=esq-hauberk-M
kc.client.secret=esq-hauberk-m-dev-secret-rotate-in-prod
