spring:
  profiles:
    active: ${DB_DATAKEEP_VENDOR:dev-postgres}
  application:
    name: aukeep
  # v1.2.10 VT: run each REST request on a virtual thread (Tomcat); opt-in, default OFF (pre-HA). See HA doc 5.5.
  threads:
    virtual:
      enabled: ${ESQ_VIRTUAL_THREADS:false}
  mvc:
    problemdetails:
      enabled: true
  config:
    import: "${TOPOLOGY_IMPORT:optional:file:/etc/esquire/topology.yml}"
# Bus TOPOLOGY (which buses exist + their transport) is the shared esquire-topology.yml imported above.
# auKeep is the audit bus CONSUMER -- it drains the chosen bus audit sink (audit-c = AMQ / audit-ck = Kafka)
# and applies it to the keep datasource (esquire.keep.datasource = the *_log tables) below. The in-process
# (audit-b) and producer-only stream sinks (audit-d / audit-dk) have no auKeep consumer.
esquire:
  audit-bus:
    messaging-bus:
      bus-id: ${AUDIT_BUS_ID:audit-c}
      slot-id: ${AUDIT_SLOT_ID:audit}
      role: CLIENT   # auKeep is the audit CLIENT: it drains the audit bus and applies the *_log
      x-rod:
        # the audit consumer apply-pool size comes from the shared topology; mode selects the worker kind.
        receiver-pool:
          mode: ${AUDIT_POOL_MODE:platform}   # platform | virtual | virtual-per-task

logging:
  level:
    root: ${LOG_LEVEL_ROOT:ERROR}
    org:
      springframework: ${LOG_LEVEL_SF:ERROR}
      springframework.jms: ${LOG_LEVEL_JMS:INFO}
      apache:
        activemq: ${LOG_LEVEL_AMQ:INFO}
    pro:
      mir0n: ${LOG_LEVEL_MIR0N:ERROR}
    develop: ${LOG_LEVEL_DEVELOP:DEBUG}
    msg: ${LOG_LEVEL_MSG:INFO}
  develop:
    log-path: ${DEVELOP_LOG_PATH:logs/datakeep-develop.log}
  msg:
    log-path: ${MSG_LOG_PATH:logs/datakeep-msg.log}

management:
  endpoint:
    health:
      probes:
        enabled: true               # expose the liveness + readiness health groups
      show-details: always
      # messagingBus + keepDatasource are registered DYNAMICALLY at ApplicationReadyEvent (after the
      # membership-validating context refresh), so the startup check must be off.
      validate-group-membership: false
      group:
        # bus (broker) + keep-DB health depool the pod (READINESS), never liveness.
        readiness:
          include: readinessState, messagingBus, keepDatasource

---
spring:
  config:
    activate:
      on-profile: dev-postgres
# the keep's *_log datasource + pool (its own group, the same shape a producer's in-process leg uses).
esquire:
  keep:
    datasource:
      url: jdbc:postgresql://${DB_DATAKEEP_HOST:localhost}:${DB_DATAKEEP_PORT:5432}/${DB_DATAKEEP_NAME:esq2025}
      username: ${DB_DATAKEEP_USERNAME:esq2025}
      password: ${DB_DATAKEEP_PASSWORD:q}
      # per-apply statement cap (seconds): 0 = uncapped (pre-HA default). The keep surface of the request-path cap.
      query-timeout-seconds: ${ESQ_KEEP_QUERY_TIMEOUT_S:0}
      hikari:
        maximum-pool-size: 20
        minimum-idle: 10
        # connection-timeout caps how long getConnection (the health probe) cycles dead connections -- low so the
        # keepDatasource health flips DOWN fast when the DB is gone (socketTimeout below bounds each attempt; this
        # bounds the whole probe). Safe for the keep's sub-second applies (the pool is not contended).
        connection-timeout: 5000
        max-lifetime: 1800000
        idle-timeout: 600000
        # driver connection properties (Hikari forwards these to the JDBC driver, same as
        # spring.datasource.hikari.data-source-properties): socketTimeout / connectTimeout (seconds) +
        # tcpKeepAlive bound a socket read/connect so a vanished DB (a half-open socket on k8s) FAILS the
        # keepDatasource health probe fast instead of hanging. Small values for an easy kill-the-DB diagnostic;
        # safely above the sub-second *_log applies.
        data-source-properties:
          socketTimeout: 5
          connectTimeout: 5
          tcpKeepAlive: true
server:
  port: ${DATAKEEP_PORT:3007}

---
spring:
  config:
    activate:
      on-profile: dev-oracle
esquire:
  keep:
    datasource:
      url: jdbc:oracle:thin:@//${DB_DATAKEEP_HOST:localhost}:${DB_DATAKEEP_PORT:1521}/${DB_DATAKEEP_NAME:MIR0N}
      username: ${DB_DATAKEEP_USERNAME:esq2025}
      password: ${DB_DATAKEEP_PASSWORD:q}
      # per-apply statement cap (seconds): 0 = uncapped (pre-HA default). The keep surface of the request-path cap.
      query-timeout-seconds: ${ESQ_KEEP_QUERY_TIMEOUT_S:0}
      hikari:
        maximum-pool-size: 20
        minimum-idle: 10
        connection-timeout: 30000
        max-lifetime: 1800000
        idle-timeout: 600000
server:
  port: ${DATAKEEP_PORT:3007}
