<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 554" font-family="Calibri, Segoe UI, sans-serif">
  <defs>
    <marker id="arw" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" refX="10" refY="4.5" orient="auto">
      <path d="M0,0 L10,4.5 L0,9 Z" fill="#6ca43d"/>
    </marker>
    <marker id="arwo" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" refX="10" refY="4.5" orient="auto">
      <path d="M0,0 L10,4.5 L0,9 Z" fill="#ffffff" stroke="#6ca43d" stroke-width="1.2"/>
    </marker>
  </defs>
  <style>
    .hdr{fill:#5b9bd5;stroke:#41719c;stroke-width:1.5}
    .hdrtxt{fill:#ffffff;font-weight:bold;font-size:15px}
    .life{stroke:#5592c9;stroke-width:1.2;stroke-dasharray:4,3}
    .msg{stroke:#6ca43d;stroke-width:1.7;fill:none;marker-end:url(#arw)}
    .ret{stroke:#6ca43d;stroke-width:1.3;fill:none;stroke-dasharray:6,3;marker-end:url(#arwo)}
    .mt{fill:#2b2b2b;font-size:12.5px}
    .note{fill:#fff3cd;stroke:#e0c068;stroke-width:1}
    .nt{fill:#5b4a00;font-size:12px}
    .title{fill:#1f3864;font-size:18px;font-weight:bold}
    .stk1{fill:#9ec3e6;stroke:#5a8bc0;stroke-width:1}
    .stk2{fill:#c5daf0;stroke:#7ba7d4;stroke-width:1}
    .xn{fill:#dbe9f7;font-size:10px}
    .leg{fill:#eef2f7;stroke:#c9d6e5;stroke-width:1}
    .legt{fill:#404040;font-size:11.5px}
    .legb{fill:#1f3864;font-size:11.5px;font-weight:bold}
  </style>

  <text class="title" x="20" y="28">Allow-connect DOWN -- deactivate a user (keySmith)</text>

  <g>
    <rect class="hdr" x="20"  y="44" width="140" height="34" rx="5"/><text class="hdrtxt" x="90"  y="66" text-anchor="middle">UI</text><line class="life" x1="90"  y1="78" x2="90"  y2="452"/>
    <rect class="stk2" x="203" y="34" width="140" height="34" rx="5"/><rect class="stk1" x="199" y="39" width="140" height="34" rx="5"/><rect class="hdr" x="195" y="44" width="140" height="34" rx="5"/><text class="hdrtxt" x="265" y="66" text-anchor="middle">keySmith</text><text class="xn" x="329" y="55" text-anchor="end">xN</text><line class="life" x1="265" y1="78" x2="265" y2="452"/>
    <rect class="hdr" x="370" y="44" width="140" height="34" rx="5"/><text class="hdrtxt" x="440" y="66" text-anchor="middle">esq2025</text><line class="life" x1="440" y1="78" x2="440" y2="452"/>
    <rect class="stk2" x="553" y="34" width="140" height="34" rx="5"/><rect class="stk1" x="549" y="39" width="140" height="34" rx="5"/><rect class="hdr" x="545" y="44" width="140" height="34" rx="5"/><text class="hdrtxt" x="615" y="66" text-anchor="middle">kcMaster</text><text class="xn" x="679" y="55" text-anchor="end">xN</text><line class="life" x1="615" y1="78" x2="615" y2="452"/>
    <rect class="hdr" x="720" y="44" width="140" height="34" rx="5"/><text class="hdrtxt" x="790" y="66" text-anchor="middle">KeyCloak</text><line class="life" x1="790" y1="78" x2="790" y2="452"/>
  </g>

  <line class="msg" x1="90" y1="128" x2="261" y2="128"/>
  <text class="mt" x="176" y="115" text-anchor="middle">POST /esq-key-save</text>
  <text class="mt" x="176" y="124" text-anchor="middle" font-size="11">{ connectFlg: "N" }</text>

  <line class="msg" x1="265" y1="176" x2="436" y2="176"/>
  <text class="mt" x="352" y="169" text-anchor="middle">au_connect_flg  Y -&gt; N</text>

  <line class="msg" x1="265" y1="228" x2="611" y2="228"/>
  <text class="mt" x="438" y="215" text-anchor="middle">URQ - EVENT_DELETE</text>
  <text class="mt" x="438" y="224" text-anchor="middle" font-size="11">over the IAM request bus</text>

  <line class="msg" x1="615" y1="276" x2="786" y2="276"/>
  <text class="mt" x="702" y="269" text-anchor="middle">deleteUser(loginId)</text>

  <rect class="note" x="672" y="296" width="196" height="26" rx="4"/>
  <text class="nt" x="682" y="313">KC identity fully removed</text>

  <line class="ret" x1="790" y1="356" x2="619" y2="356"/>
  <text class="mt" x="702" y="349" text-anchor="middle" font-size="11">deleted</text>

  <line class="ret" x1="615" y1="396" x2="269" y2="396"/>
  <text class="mt" x="438" y="389" text-anchor="middle" font-size="11">URR - ok  (rod-id -&gt; originating keySmith)</text>

  <rect class="note" x="20" y="420" width="430" height="30" rx="4"/>
  <text class="nt" x="30" y="439">The esq_usr entity stays in the tree -- only the login is revoked.</text>

  <rect class="leg" x="20" y="460" width="840" height="42" rx="5"/>
  <text class="legt" x="30" y="479"><tspan class="legb">Redundancy:</tspan> keySmith and kcMaster run at N replicas (stacked). The URQ is consumed by any one kcMaster</text>
  <text class="legt" x="30" y="495">(competing consumer); its URR reply is routed back to the originating keySmith instance by rod-id.</text>
</svg>
