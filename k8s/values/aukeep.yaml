# Local k8s overlay for charts/esquire-aukeep.
# Chart defaults already match local dev (postgres + activemq + transport=activemq).
# Only image.tag is restamped per rebuild here -- k8s-rebuild.bat patches it.
image:
  tag: "v1.2.11-2607.1214"

# v1.2.10 redundancy: run 2 replicas (StatefulSet ordinal identity)
replicaCount: 2

# R4 local-k8s resource budget. auKeep is a queue-draining consumer with its own
# dedicated keep pool (DB_DATAKEEP_POOL_SIZE), not an inbound HTTP service, so only
# the R4 resources floor/ceiling applies -- no R1-R5 timeout/pool knobs.
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 768Mi
