{{- $replicas := int (.Values.replicaCount | default 1) -}}
{{- if gt $replicas 10 -}}
{{- fail (printf "esquire-gateway: replicaCount=%d exceeds the cap of 10. The per-instance number is a single decimal digit (0-9) -- the fleet naming rule (pod ordinal -> rod-id <app>.<instanceNo>) caps replicas at 10." $replicas) -}}
{{- end -}}
{{- if lt $replicas 1 -}}
{{- fail (printf "esquire-gateway: replicaCount=%d must be >= 1" $replicas) -}}
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-gateway
  labels:
    app: {{ .Release.Name }}-gateway
spec:
  serviceName: {{ .Release.Name }}-gateway-hl
  replicas: {{ $replicas }}
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: {{ .Release.Name }}-gateway
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-gateway
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.topologySpread.enabled }}
      # HA: best-effort spread of the replicas across distinct nodes (soft -- a node
      # loss still schedules). Off by default (pre-HA / single-node local); the OKE
      # overlay turns it on so the x2 replicas land on different app-tier nodes.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: {{ .Release.Name }}-gateway
      {{- end }}
      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args: ["java", "-jar", "app.jar"]
          ports:
            - containerPort: {{ .Values.service.port }}
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-gateway-config
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          {{- if .Values.tokenRelay.phantom.exchangeClientSecret }}
            - name: ESQ_GW_EXCHANGE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-gateway-secret
                  key: exchange-client-secret
          {{- end }}
          startupProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.service.port }}
            periodSeconds: 10
            failureThreshold: 30      # up to 300s cold-start budget under node contention before liveness applies
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.service.port }}
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.service.port }}
            initialDelaySeconds: 40
            periodSeconds: 15
            timeoutSeconds: 5
