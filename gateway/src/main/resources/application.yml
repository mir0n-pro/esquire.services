server:
  port: ${GATEWAY_PORT:8080} 
spring:
  application:
    name: "gateway"
  cloud:
    gateway:
       #default-filters:
       #  - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST #RETAIN_UNIQUE
       globalcors:
         # globalcors somehow do not work: used custom config 
         add-to-simple-url-handler-mapping: true 
         cors-configurations:
           '[/**]':
             allowedOrigins: "http://localhost:4200"
             allowedHeaders: "*"
             allowedMethods: "*"
       routes:
        - id: biztree-route
          uri: http://${BIZTREE_HOST:biztree}:${BIZTREE_PORT:3001}
          # uri: http://biztree:3001
          predicates:
            - Path=/**
          metadata:
              allowedMethods:
                - GET
                - POST
          filters:
             #RETAIN_UNIQUE
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
            - RewritePath=/(?<segment>.*), /$\{segment}
            - TokenRelay=

#  autoconfigure:
#   exclude: org.springframework.boot.autoconfigure.security.reactive.ReactiveSecurityAutoConfiguration
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
      allowed-methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
      allowed-headers: ["Authorization", "Content-Type"]
      allow-credentials: true
      max-age: 3600    
    oauth2:
      client:
        registration:
          keycloak:
            client-id: ${KEYCLOAK_CLIENT_ID:esq-angular}
            authorization-grant-type: authorization_code
            scope: openid
        provider:
          keycloak:
            enable-cors: true
            issuer-uri: http://${KEYCLOAK_HOST:keycloak}:${KEYCLOAK_PORT:8080}/realms/${KEYCLOAK_REALM:esquire}
            authorization-uri: http://${KEYCLOAK_HOST:keycloak}:${KEYCLOAK_PORT:8080}/realms/${KEYCLOAK_REALM:esquire}/protocol/openid-connect/auth
            token-uri: http://${KEYCLOAK_HOST:keycloak}:${KEYCLOAK_PORT:8080}/realms/${KEYCLOAK_REALM:esquire}/protocol/openid-connect/token
            jwk-set-uri: http://${KEYCLOAK_HOST:keycloak}:${KEYCLOAK_PORT:8080}/realms/${KEYCLOAK_REALM:esquire}/protocol/openid-connect/certs
            user-info-uri: http://${KEYCLOAK_HOST:keycloak}:${KEYCLOAK_PORT:8080}/realms/${KEYCLOAK_REALM:esquire}/protocol/openid-connect/userinfo
      resourceserver:
        jwt:
          jwk-set-uri: http://${KEYCLOAK_HOST:keycloak}:${KEYCLOAK_PORT:8080}/realms/${KEYCLOAK_REALM:esquire}/protocol/openid-connect/certs
info:
  app:
    name: "gateway"
    description: "Facade Esquire Server"
    version: "1.0.0"

logging:
  structured:
    format:
      console: ecs  # Use ecs,'logstash' or 'gelf' for other common formats
  level:
    root: ${LOG_LEVEL_ROOT:ERROR}
    org:
      springframework: ${LOG_LEVEL_SF:ERROR}
    pro:
      mir0n: ${LOG_LEVEL_MIR0N:ERROR}

