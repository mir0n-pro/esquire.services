# Two services for the StatefulSet:
#   * ClusterIP `{{ .Release.Name }}` -- the HTTP entrypoint
#     consumers (gateway, kcMaster, etc.) hit; kube-proxy load-balances
#     across pods.
#   * Headless `{{ .Release.Name }}-hl` -- governs StatefulSet pod
#     DNS (per-pod `<release>-mesnie-N.<release>-mesnie-hl`) so the
#     downward API ordinal stays stable. Not used for traffic.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  type: ClusterIP
  selector:
    app: {{ .Release.Name }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-hl
  labels:
    app: {{ .Release.Name }}
spec:
  clusterIP: None
  selector:
    app: {{ .Release.Name }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
