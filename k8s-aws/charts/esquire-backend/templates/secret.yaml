apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-backend-secret
  labels:
    app: {{ .Release.Name }}-backend
type: Opaque
stringData:
  KC_CLIENT_SECRET: {{ required "keycloak.clientSecret must be set (helm --set keycloak.clientSecret=...)" .Values.keycloak.clientSecret | quote }}
  SESSION_SECRET:   {{ required "session.secret must be set (helm --set session.secret=...)" .Values.session.secret | quote }}
