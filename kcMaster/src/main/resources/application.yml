spring:
  application:
    name: kcmaster
  # v1.2.10 VT: run each REST request on a virtual thread (Tomcat); opt-in, default OFF (pre-HA). See HA doc 5.5.
  threads:
    virtual:
      enabled: ${ESQ_VIRTUAL_THREADS:false}
  mvc:
    problemdetails:
      enabled: true
  config:
    import: "${TOPOLOGY_IMPORT:optional:file:/etc/esquire/topology.yml}"
keycloak:
  admin:
    base-url: ${KC_BASE_URL:http://localhost:8080}
    realm: ${KC_REALM:esquire}
    client-id: ${KC_ADMIN_CLIENT_ID:admin-cli}
    client-secret: ${KC_ADMIN_CLIENT_SECRET:}
    connect-timeout-ms: 5000
    read-timeout-ms: 10000
kcmaster:
  path-buffer:
    ttl-ms:            ${KCMASTER_PATH_BUFFER_TTL_MS:10000}
    prune-interval-ms: ${KCMASTER_PATH_BUFFER_PRUNE_MS:30000}
# Bus TOPOLOGY (which buses exist + their transport) is the shared esquire-topology.yml imported above.
# Here: this service's bus REFS + per-service knob OVERRIDES (kc SERVER + entity consumer).
esquire:
  kc-bus:
    messaging-bus:
      bus-id: ${KC_BUS_ID:esquire.kc}
      slot-id: ${KC_SLOT_ID:kc}
      role: SERVER
      x-rod:
        receiver-pool:
          size: ${KC_REQUEST_POOL_SIZE:4}
          mode: ${KC_POOL_MODE:platform}   # platform | virtual | virtual-per-task
        concurrency: ${KC_REQUEST_CONCURRENCY:1}
        publisher-pool:
          size: ${KC_RESPONSE_PUBLISHER_POOL_SIZE:0}
          mode: ${KC_RESPONSE_PUBLISHER_POOL_MODE:platform}
        # producer send-retry on the KC R&R bus (the SERVER response leg); opt-in, default OFF here, ON in docker +
        # the local-k8s overlay -- OKE stays on this pre-HA default. Block mode (max-attempts 0): hold + retry over
        # the backoff ladder until the broker recovers so the KC sync reply still goes back to the caller. If the
        # caller has already timed out the held reply is orphaned (no correlation) -- the KC sync itself already
        # ran, so the request leg's own retry reconciles the caller.
        send-retry: ${KC_SEND_RETRY:false}
        send-retry-backoff: ${KC_SEND_RETRY_BACKOFF:1,2,5,5}
        send-retry-max-attempts: ${KC_SEND_RETRY_MAX_ATTEMPTS:0}
  entity-bus:
    messaging-bus:
      bus-id: ${ENTITY_BUS_ID:esquire.entity}
      slot-id: ${ENTITY_SLOT_ID:entity}
      role: CLIENT
      x-rod:
        receiver-pool:
          size: ${ENTITY_BROADCAST_POOL_SIZE:4}
          mode: ${ENTITY_BROADCAST_POOL_MODE:platform}   # platform | virtual | virtual-per-task
        concurrency: ${ENTITY_BROADCAST_CONCURRENCY:1}
logging:
  level:
    root: ${LOG_LEVEL_ROOT:ERROR}
    org:
      springframework: ${LOG_LEVEL_SF:ERROR}
      springframework.jms: ${LOG_LEVEL_JMS:INFO}
      apache:
        activemq: ${LOG_LEVEL_AMQ:INFO}
    pro:
      mir0n: ${LOG_LEVEL_MIR0N:ERROR}
    develop: ${LOG_LEVEL_DEVELOP:DEBUG}
    msg: ${LOG_LEVEL_MSG:INFO}
  develop:
    log-path: ${DEVELOP_LOG_PATH:logs/kcMaster-develop.log}
  msg:
    log-path: ${MSG_LOG_PATH:logs/kcMaster-msg.log}
management:
  endpoint:
    health:
      probes:
        enabled: true               # expose the liveness + readiness health groups
      show-details: always
      # messagingBus is registered DYNAMICALLY at ApplicationReadyEvent (after the membership-validating context
      # refresh), so the startup check must be off; the readiness group resolves it at request time.
      validate-group-membership: false
      group:
        # bus health depools the pod (READINESS), never liveness -- a broker outage must not let liveness kill it.
        readiness:
          include: readinessState, messagingBus

server:
  port: ${KCMASTER_PORT:3006}
