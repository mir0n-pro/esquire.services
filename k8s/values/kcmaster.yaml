# Local k8s overlay for charts/esquire-kcmaster
# Chart defaults already match local dev needs. Only image.tag is
# restamped per rebuild here -- k8s-rebuild.bat patches it.
image:
  tag: "v1.2.13-2608.131733"

# v1.2.10 redundancy: run 2 replicas (StatefulSet ordinal identity)
replicaCount: 2

# R4 local-k8s resource budget. kcMaster has no DB datasource and no inbound HTTP
# surface under load (it drains the KC bus), so only the R4 resources floor/ceiling
# applies -- no R1-R5 timeout/pool knobs.

# producer send-retry on the KC R&R bus (SERVER response leg): ON for local k8s (block mode). Overrides the chart
# pre-HA default (OFF).
kc:
  sendRetry: "true"

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 768Mi
