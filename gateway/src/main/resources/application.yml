#  autoconfigure:
#   exclude: org.springframework.boot.autoconfigure.security.reactive.ReactiveSecurityAutoConfiguration
  security:
    cors:
      allowed-origins:
        - "${CORS_ALLOWED_ORIGINS:http://localhost:4200}"
      allowed-methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
      allowed-headers: ["Authorization", "Content-Type", "X-Request-ID", "X-Correlation-ID", "X-Capture-Metrics"]
      allow-credentials: true
      max-age: 3600
      exposed-headers: ["X-Request-ID", "X-Correlation-ID", "X-Response-Time", "Esq-Gw-Inner-Time", "Esq-Srv-Outer-Time", "Esq-Srv-Inner-Time"]
    oauth2:
      client:
        registration:
          keycloak:
            client-id: ${KEYCLOAK_CLIENT_ID:esq-angular}
            authorization-grant-type: authorization_code
            scope: openid
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          keycloak:
            enable-cors: true
            authorization-uri: http://${KEYCLOAK_HOST:keycloak}:${KEYCLOAK_PORT:8080}${KEYCLOAK_PATH:}/realms/${KEYCLOAK_REALM:esquire}/protocol/openid-connect/auth
            token-uri: http://${KEYCLOAK_HOST:keycloak}:${KEYCLOAK_PORT:8080}${KEYCLOAK_PATH:}/realms/${KEYCLOAK_REALM:esquire}/protocol/openid-connect/token
            jwk-set-uri: http://${KEYCLOAK_HOST:keycloak}:${KEYCLOAK_PORT:8080}${KEYCLOAK_PATH:}/realms/${KEYCLOAK_REALM:esquire}/protocol/openid-connect/certs
            user-info-uri: http://${KEYCLOAK_HOST:keycloak}:${KEYCLOAK_PORT:8080}${KEYCLOAK_PATH:}/realms/${KEYCLOAK_REALM:esquire}/protocol/openid-connect/userinfo
      resourceserver:
        jwt:
          jwk-set-uri: http://${KEYCLOAK_HOST:keycloak}:${KEYCLOAK_PORT:8080}${KEYCLOAK_PATH:}/realms/${KEYCLOAK_REALM:esquire}/protocol/openid-connect/certs
info:
  app:
    name: "gateway"
    description: "Facade Esquire Server"
    version: "1.0.0"

logging:
  level:
    root: ${LOG_LEVEL_ROOT:ERROR}
    org:
      springframework: ${LOG_LEVEL_SF:ERROR}
    pro:
      mir0n: ${LOG_LEVEL_MIR0N:ERROR}
    develop: ${LOG_LEVEL_DEVELOP:DEBUG}
  develop:
    log-path: ${DEVELOP_LOG_PATH:logs/gateway-develop.log}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    redis:
      enabled: false
endpoint:
    health:
      db:
        enabled: false
      probes:
        enabled: true
      show-details: always        