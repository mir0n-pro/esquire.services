# Esquire frameworks (tm) -- shared messaging-bus TOPOLOGY (docker environment)
#
# The cross-service bus catalog, defined ONCE and loaded by every service via
#   spring.config.import: file:${ESQUIRE_TOPOLOGY_FILE:/etc/esquire/topology.yml}
# (bind-mounted from compose/topology/ into each container at /etc/esquire/topology.yml).
#
# This file is PER ENVIRONMENT and is written with CONCRETE values (no ${} placeholders) -- the docker-network
# hostnames (activemq / kafka / redis). Per-service knobs (pool sizes, rod-class deltas, the role) and the audit
# in-process (b) datasource live at the SERVICE level (each service application.yml), NOT here. A bus defined here but
# not referenced by a service is inert (a pod is built only when a service producer()/consumer()s a bus key).
esquire:
  messaging-bus:
    # --- entity broadcast (topic): publishers post UE, consumers (bizTree / kcMaster) apply ---
    - bus-id: esquire.entity
      slots:
        - slot-id: entity
          x-rod:
            receiver-pool:
              size: 4
              mode: platform
            concurrency: 1
            publisher-pool:
              size: 0
              mode: platform
            transport:
              provider: activemq
              endpoint: failover:(tcp://activemq:61616)?timeout=3000
              destination: esquire.entity.broadcast
              params:
                pubSubDomain: true
                # MUST agree with the broker (activemq.xml: persistent="false"). See the KeyCloak bus below.
                persistent: false
                # enyMan runs both legs (publish + listen) on ONE shared connection, so the broker drops its OWN
                # publications -- the moving instance reconciles only a PEER instance's create-during-move. Inert
                # for pure consumers (bizTree / kcMaster publish nothing) and publish-only producers (no consumer).
                noLocal: true
    # --- KeyCloak request/response (R&R, two nodes): enyMan/keySmith CLIENT, kcMaster SERVER ---
    - bus-id: esquire.kc
      slots:
        - slot-id: kc
          x-rod:
            rod-class: XRodRR
            # RR liveness protocol ON (docker): CLIENT (enyMan/keySmith) probes with a TestRequest, SERVER
            # (kcMaster) echoes a HeartBeat -- the round-trip is observable when msg-bus-alive-trace is on.
            # Enabled here on docker; OFF on k8s (the k8s topology omits this); OFF by default. Default cadence.
            alive: true
            receiver-pool:
              size: 4
              mode: platform
            concurrency: 1
            publisher-pool:
              size: 0
              mode: platform
            transport:
              provider: activemq
              endpoint: failover:(tcp://activemq:61616)?timeout=3000
              request-node: request
              response-node: response
              params:
                # MUST agree with the broker's own persistent setting (activemq.xml: persistent="false").
                # JMS makes a PERSISTENT send SYNCHRONOUS -- the producer blocks for a broker ack on every
                # message -- even when the broker persists nothing, so against our in-memory broker the flag
                # costs a round-trip per send and buys nothing.
                persistent: false
              nodes:
                - node-id: request
                  destination: esquire.kc.request
                - node-id: response
                  destination: esquire.kc.response
    # --- audit (c): ActiveMQ -> auKeep consumer writes the *_log ---
    - bus-id: audit-c
      slots:
        - slot-id: audit
          x-rod:
            rod-class: XRod
            receiver-pool:
              size: 4
              mode: platform
            feed-capacity: 4096
            publisher-pool:
              size: 0
              mode: platform
            concurrency: 1
            transport:
              provider: activemq
              endpoint: failover:(tcp://activemq:61616)?timeout=3000
              destination: esquire.rod.audit
              params:
                jms.useAsyncSend: true
                # MUST agree with the broker (activemq.xml: persistent="false"). NOTE what this accepts: a broker
                # restart drops any audit backlog auKeep has not yet drained. That is the one destination where
                # the loss is semantically real, and it is accepted -- dev/demo, and the MessagingBus design lists
                # at-least-once durability as a FUTURE option, not a guarantee.
                persistent: false
    # --- audit (ck): Kafka -> auKeep consumer writes the *_log ---
    - bus-id: audit-ck
      slots:
        - slot-id: audit
          x-rod:
            rod-class: XRod
            receiver-pool:
              size: 4
              mode: platform
            feed-capacity: 4096
            publisher-pool:
              size: 0
              mode: platform
            concurrency: 1
            transport:
              provider: kafka
              endpoint: kafka:9092
              destination: esquire.rod.audit
              params:
                group-id: esquire-xxrod-audit
    # --- audit (d): Redis stream IS the append-only log (producer-only, no auKeep consumer) ---
    - bus-id: audit-d
      slots:
        - slot-id: audit
          x-rod:
            rod-class: XRod
            receiver-pool:
              size: 4
              mode: platform
            feed-capacity: 4096
            publisher-pool:
              size: 0
              mode: platform
            transport:
              provider: redis
              endpoint: redis://redis:6379
              destination: esquire.rod.audit
              params:
                max-len: 0
    # --- audit (dk): Kafka topic IS the append-only log (producer-only, no auKeep consumer) ---
    - bus-id: audit-dk
      slots:
        - slot-id: audit
          x-rod:
            rod-class: XRod
            receiver-pool:
              size: 4
              mode: platform
            feed-capacity: 4096
            publisher-pool:
              size: 0
              mode: platform
            transport:
              provider: kafka
              endpoint: kafka:9092
              destination: esquire.rod.audit
              params:
                group-id: esquire-xxrod-audit-dk
    # --- audit (off): the explicit DISABLED bus. A service points its audit ref at audit-off to run with NO
    #     bus audit (e.g. when DB triggers carry the audit instead). XRodDisabled is a true no-op; this is the
    #     #17 "disable only when explicitly defined" -- a blank/undefined bus-id (correctly) fails fast instead. ---
    - bus-id: audit-off
      slots:
        - slot-id: audit
          x-rod:
            rod-class: XRodDisabled
