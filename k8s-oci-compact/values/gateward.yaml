# Prod (OKE super-compact) overrides for k8s-compact/charts/esquire-gateward
# gateWard is the gate -- the READ side. It is the security boundary AND the bizTree cache, so this
# ONE overlay carries what the classic OKE deploy spread over values/gateway.yaml and values/biztree.yaml.
image:
  repository: ghcr.io/mir0n-pro/esquire.gateward
  # tag injected by oke-up.bat (--set image.tag=%image_tag%) -- single release tag for the whole stack.
  pullPolicy: Always

# The gate's console profile PLUS the two the cache needs: dev-postgres is the JDBC datasource it
# loads from, cache-h2 the in-memory store it loads into.
springProfilesActive: console,dev-postgres,cache-h2

service:
  type: ClusterIP            # behind ingress-nginx; no public LB
  port: 8080
  managementPort: 8090       # actuator/management probe port (F0 A6); in sync with the chart default (RF3)
  lbPort: 8080               # unused when type=ClusterIP, kept for chart compatibility

db:
  vendor: dev-postgres
  host: esquire-infra-postgres
  port: 5432
  name: esq2025
  username: esq2025

keycloak:
  host: esquire-infra-kc-keycloak
  port: 8080
  path: /kc-auth                    # matches KC_HTTP_RELATIVE_PATH set on KC pod (v1.2.3)
  realm: esquire
  clientId: esq-angular

# Where the OTHER services are. There is no biztreeHost: the five tree routes are answered in this
# process, so the route that pointed at bizTree is not in the table at all. Mesnie answers for both
# enyMan and keySmith, on one host and one port.
backends:
  enymanHost: esquire-mesnie
  enymanPort: 3003
  pacmanHost: esquire-pacman
  pacmanPort: 3003
  keysmithHost: esquire-mesnie
  keysmithPort: 3003

cors:
  # BFF lives at esquire.mir0n.pro; hauberk + any external JWT client hit
  # api.esquire.mir0n.pro directly through this gate.
  allowedOrigins: https://esquire.mir0n.pro,https://api.esquire.mir0n.pro

# Token Relay -- DISABLED on OKE (2026-07-20). Vanilla / Phantom Token Relay are the
# not-recommended JWE-workaround LAB patterns; the recommended production paths are BFF + plain JWT.
# They are NOT armed on the internet-facing public API: an empty allowlist means the gate never
# brokers or exchanges a relay token, so the per-client_id / per-jti cache is never populated and
# cannot be presented. (esq-hauberk-S resolves to the mainadmin identity, so leaving the lab relay
# live on the public API put a full-admin token one warm cache away -- audit F0 finding A1.)
# Re-arm only for a deliberate load-test window, never as a standing config.
# exchangeClientSecret is passed via --set at install (oke-up.bat).
keycloakExchange:
  baseUrl: https://esquire.mir0n.pro/kc-auth

tokenRelay:
  vanilla:
    clients: ""
  phantom:
    clients: ""
    exchangeClientId: esq-gw-exchange

logging:
  levelRoot: ERROR
  levelSf: WARN
  levelMir0n: ERROR
  levelDevelop: "OFF"
  levelMsg: "OFF"

nodeSelector:
  tier: app

# v1.2.10 HA (OKE Always-Free): x2 replicas, best-effort spread across the 3 app-tier nodes.
# TWO replicas means TWO caches, each loading the whole tree from the database at start and each
# kept in step by its own entity-bus consumer. A request is served by whichever pod it lands on,
# so the readiness gate is the whole defence against answering from a cold one.
replicaCount: 2
topologySpread:
  enabled: true

# One process instead of two, so it gets the two workloads' room rather than half of it. Sized for
# the 1 OCPU / 6 GB app nodes; the cache holds two copies of the tree in H2.
resources:
  requests:
    # 150m, not 250m. A request is a SCHEDULING FLOOR, not a ceiling -- and measured idle on OKE this
    # process uses 3-5m. At 250m the app tier reserved 1150m of its 2520m while using ~20m, and a second
    # BFF (100m) could not be placed. The limit below is untouched, so nothing about its ceiling changes.
    cpu: 150m
    memory: 768Mi
  limits:
    cpu: "1"
    memory: 1280Mi

# This one workload carries BOTH sides, so it takes the gate's outbound pool and the ward's (small)
# database pool together. There is no tomcat block: this process is WebFlux, and the ESQ_TOMCAT_*
# knobs the standalone bizTree overlay carries would reach nothing here.
resilience:
  gwPoolMaxConnections: "64"      # R1 the edge fans out to the x2 backend fleet
  dbPoolMax: "5"                  # R3 smaller -- most reads are served from the in-JVM H2 cache
  dbPoolMinIdle: "2"              # R3
  dbConnectTimeoutMs: "5000"      # R3 fail-fast on pool acquire
  dbSocketTimeoutSeconds: "35"    # R5
  dbTcpKeepAlive: "true"          # R5
