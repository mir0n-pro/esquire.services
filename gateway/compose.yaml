services:
  gateway:
    build:
      context: .
    image: esquire.gateway
    ports:
      - "3000:8080"
    environment:
      - GATEWAY_PORT=8080
      - BIZTREE_PORT=3001
      - BIZTREE_HOST=172.18.0.2
      - LOG_LEVEL_ROOT=ERROR
      - LOG_LEVEL_SF=ERROR
      - LOG_LEVEL_MIR0N=DEBUG
    command: ["java", "-jar", "app.jar"]
    networks:
      - esquirenet
networks:
  esquirenet:
    driver: "bridge"
   