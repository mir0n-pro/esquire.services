<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250" width="595" height="213" font-family="Calibri, Segoe UI, sans-serif">
  <style>
    .tok{fill:#5b9bd5;stroke:#41719c;stroke-width:1.5}.tokt{fill:#fff;font-weight:bold;font-size:15px}
    .prop{fill:#c6e0b4;stroke:#6ca43d;stroke-width:1.5}.propt{fill:#375623;font-weight:bold;font-size:14px}.props{fill:#3f5e26;font-size:11.5px}
    .link{stroke:#6ca43d;stroke-width:1.8}
    .title{fill:#1f3864;font-size:18px;font-weight:bold}
    .cap{fill:#404040;font-size:12.5px}.capbox{fill:#f2f6fb;stroke:#c9d6e5;stroke-width:1}
  </style>

  <text class="title" x="20" y="30">The ideal access token -- both properties at once</text>

  <line class="link" x1="230" y1="112" x2="272" y2="112"/>
  <line class="link" x1="428" y1="112" x2="470" y2="112"/>

  <rect class="prop" x="30" y="82" width="200" height="62" rx="8"/>
  <text class="propt" x="130" y="108" text-anchor="middle">ENCRYPTED</text>
  <text class="props" x="130" y="128" text-anchor="middle">client cannot read the claims</text>

  <rect class="tok" x="272" y="84" width="156" height="58" rx="8"/>
  <text class="tokt" x="350" y="118" text-anchor="middle">access token</text>

  <rect class="prop" x="470" y="82" width="200" height="62" rx="8"/>
  <text class="propt" x="570" y="104" text-anchor="middle">SELF-CONTAINED</text>
  <text class="props" x="570" y="122" text-anchor="middle">gateway + services validate</text>
  <text class="props" x="570" y="136" text-anchor="middle">locally, no IAS call per request</text>

  <rect class="capbox" x="30" y="176" width="640" height="52" rx="6"/>
  <text class="cap" x="44" y="198">Only <tspan font-weight="bold">JWE</tspan> carries both properties in a single token -- and stock Keycloak 26 does not emit JWE on /token.</text>
  <text class="cap" x="44" y="216">So the platform partitions the two across tiers instead (BFF / Token Relay), never in one token.</text>
</svg>
