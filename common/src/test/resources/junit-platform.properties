# v1.2.11 T11/I32 -- enable JUnit 5 extension AUTO-DETECTION so EsqO11yRegistryReset (declared in
# META-INF/services/org.junit.jupiter.api.extension.Extension) is applied to EVERY test in this module with
# nothing to remember. That is what makes a leaked static o11y registry unreachable rather than merely discouraged.
junit.jupiter.extensions.autodetection.enabled=true
