# Prod overrides for k8s/charts/esquire-keysmith
image:
  repository: ghcr.io/mir0n-pro/esquire.keysmith
  tag: "v1.2.6-2606.0218"
  pullPolicy: Always

springProfilesActive: console,dev-postgres

db:
  vendor: dev-postgres
  host: esquire-infra-postgres
  port: 5432
  name: esq2025
  username: esq2025

logging:
  levelRoot: WARN
  levelSf: WARN
  levelMir0n: INFO
  levelDevelop: "OFF"
  levelMsg: "OFF"

nodeSelector:
  tier: app

# OKE deploy = option (a) DB triggers: the app producer stays OFF (no auKeep pod, no extra broker
# audit load on the Always-Free tier -- it is a demo, not a load-test sandbox). The DB-side trigger
# DDL (db.seed/<vendor>/triggers/all.sql) must be applied to the OKE postgres for (a) to write.
# Point the audit ref at the explicit audit-off DISABLED bus (XRodDisabled no-op) in k8s-oci/esquire-topology.yml;
# v1.2.9 fail-fasts on a blank/undefined audit bus-id.
audit:
  busId: audit-off
