# EKS overlay for k8s-compact/charts/infra/keycloak  --  T7, super-compact, x1.
#
# KeyCloak runs start-dev with an embedded database, so it needs no database of its
# own -- the PVC below is its whole state.
image:
  repository: ghcr.io/mir0n-pro/esquire-keycloak
  # v1.2.13 on purpose: this image is KeyCloak plus the esquire theme and realm. It
  # carries no Esquire Java, so the v1.2.14 messaging change does not touch it.
  tag: "v1.2.13-2608.2806"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP            # ingress-nginx fronts KC

storage:
  # NOT `standard` (Docker Desktop's name) and NOT `gp2` (EKS ships that class with
  # the IN-TREE kubernetes.io/aws-ebs provisioner, which 1.34 removed -- it is
  # selectable and never binds). gp3 comes from storageclass-gp3.yaml.
  storageClass: gp3
  size: 5Gi

keycloak:
  realm: esquire
  adminUsername: admin
  # adminPassword passed via --set at install
  clientId: esq-angular
  # The PUBLIC origin, and it must agree with the BFF's issuer and publicBaseUrl.
  # A mismatch fails sign-in with an error that blames the token rather than the URL.
  hostname: https://aws-esquire.mir0n.pro/kc-auth
  httpRelativePath: /kc-auth
  proxy: edge                # KC trusts X-Forwarded-* from ingress

nodeSelector:
  tier: app

# KeyCloak sets NO resource requests on any other target -- the chart has no default
# and OKE does not add one -- because those clusters have several nodes and room to
# absorb it. Here everything shares ONE node, and a pod with no requests is BestEffort:
# the scheduler counts it as free, and the kubelet evicts it FIRST under memory
# pressure. start-dev really uses 500-700Mi, so it is declared rather than discovered.
resources:
  requests:
    cpu: 200m
    memory: 768Mi
  limits:
    memory: 1Gi
