# Prod overrides for k8s/charts/esquire-enyman
image:
  repository: ghcr.io/mir0n-pro/esquire.enyman
  tag: "v1.2.6-2606.0218"
  pullPolicy: Always

springProfilesActive: console,dev-postgres

db:
  vendor: dev-postgres
  host: esquire-infra-postgres
  port: 5432
  name: esq2025
  username: esq2025

logging:
  levelRoot: WARN
  levelSf: WARN
  levelMir0n: INFO
  levelDevelop: "OFF"
  levelMsg: "OFF"

nodeSelector:
  tier: app

# OKE deploy = option (a) DB triggers: the app producer stays OFF (no auKeep pod, no extra broker
# audit load on the Always-Free tier -- it is a demo, not a load-test sandbox). The DB-side trigger
# DDL (db.seed/<vendor>/triggers/all.sql) must be applied to the OKE postgres for (a) to write.
# OKE audits via DB triggers -- no audit bus in the OKE topology. busId MUST be blank: a blank id skips the
# strict catalog and lands on the OFF x-rod (XRodDisabled). A non-blank id with no leg (e.g. audit-a) crashes
# the pod at boot -- verified on OKE: "no leg bus-id=audit-a". Overrides the chart's audit-c default.
audit:
  busId: ""
