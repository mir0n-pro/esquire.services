# Prod overrides for k8s/charts/esquire-gateway
image:
  repository: ghcr.io/mir0n-pro/esquire.gateway
  # tag injected by oke-up.bat (--set image.tag=%image_tag%) -- single release tag for the whole stack.
  pullPolicy: Always

springProfilesActive: console

service:
  type: ClusterIP            # behind ingress-nginx; no public LB
  port: 8080
  lbPort: 8080               # unused when type=ClusterIP, kept for chart compatibility

keycloak:
  host: esquire-infra-kc-keycloak
  port: 8080
  path: /kc-auth                    # matches KC_HTTP_RELATIVE_PATH set on KC pod (v1.2.3)
  realm: esquire
  clientId: esq-angular

backends:
  biztreeHost: esquire-biztree-biztree
  biztreePort: 3002
  enymanHost: esquire-enyman-enyman
  enymanPort: 3003
  pacmanHost: esquire-pacman-pacman
  pacmanPort: 3003
  keysmithHost: esquire-keysmith-keysmith
  keysmithPort: 3002

cors:
  # v1.2.4: BFF still lives at esquire.mir0n.pro; hauberk + any external JWT
  # client hit api.esquire.mir0n.pro directly through this gateway.
  allowedOrigins: https://esquire.mir0n.pro,https://api.esquire.mir0n.pro

# Token Relay -- shared KC /token endpoint + per-variant allowlists.
# Public URL so KC's iss validation on token-exchange matches the
# subject_token's issuer (in-cluster URL would mismatch). +20ms one-time
# DNS + TLS per cache MISS; cache HIT path doesn't touch KC.
# - esq-hauberk-S is the Vanilla Token Relay client today
# - esq-hauberk-M is the Phantom Token Relay client today
# exchangeClientSecret is passed via --set at install (oke-up.bat).
tokenRelay:
  tokenUri: https://esquire.mir0n.pro/kc-auth/realms/esquire/protocol/openid-connect/token
  vanilla:
    clients: esq-hauberk-S
  phantom:
    clients: esq-hauberk-M
    exchangeClientId: esq-gw-exchange

logging:
  levelRoot: ERROR
  levelSf: WARN
  levelMir0n: ERROR
  levelDevelop: "OFF"

nodeSelector:
  tier: app

# v1.2.10 HA (OKE Always-Free): x2 replicas, best-effort spread across the 3 app-tier nodes.
replicaCount: 2
topologySpread:
  enabled: true

# Memory-bounded for the 1 OCPU / 6 GB app nodes. CPU request trimmed from the local
# 250m so the x2 fleet fits the ~2.5 vCPU app tier.
resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: 750m
    memory: 768Mi

# R1 edge budget: a larger outbound pool than the chart pre-HA default (16) so the edge
# can fan out to the x2 backend fleet. Promoted from the local-k8s overlay.
resilience:
  gwPoolMaxConnections: "64"      # R1
