# Pure OAuth overlay (deltas only; base URLs inherit from hauberk.properties = docker).
#
# esq-hauberk-P is esq-hauberk's pure twin: its token carries no Esquire claims, only
# preferred_username = esq-hauberk@mir0n.pro (the same access profile, user 15). The gateway takes the
# claims from keySmith. Requires esq-hauberk-P on the gateway's pure list (ESQ_GW_PURE_OAUTH_CLIENTS),
# which the compose config already has. perf-matrix's docker-OFF-PURE cell runs on this file.
#
#   Run:  hauberk.cmd run super-load --config hauberk-P.properties

kc.client.id=esq-hauberk-P
kc.client.secret=esq-hauberk-p-dev-secret-rotate-in-prod
