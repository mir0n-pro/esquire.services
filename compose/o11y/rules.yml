# Esquire frameworks (tm) -- Prometheus alerting rules (framework health)
#
# I55: the FRAMEWORK ships alert RULES for its OWN intrinsic health signals -- conditions that are unambiguous
# ("this happened at all"), never tunable thresholds. They EVALUATE and show as firing in Prometheus / Grafana
# with nothing operator-specific, on metrics the fleet already emits when observability is on.
#
# THE OPERATOR SLOT (deployment-specific -- NOT shipped here, and NOT deferred to T12; it is wired at deploy):
#   1. ROUTING -- WHERE a firing alert goes. Add an `alerting: { alertmanagers: [...] }` block to prometheus.yml
#      and an Alertmanager contact point (Slack / PagerDuty / email). The framework cannot know your webhook.
#   2. SLO / ERROR-BUDGET (I57). The SLIs all ship -- latency histograms for p95/p99 (esq_gw_outer_seconds,
#      http_server_requests_seconds, esq_bff_inbound_duration_seconds; enable ESQ_METRICS_HISTOGRAMS for the
#      _bucket series), error rate (messaging_error_total, HTTP 5xx), availability (up). What is NOT shipped is
#      the SLO DEFINITION: a target (99.9%? p99 < X ms?) + error budget + burn-rate rules. That target encodes
#      YOUR tolerance -- the framework cannot set it without guessing, and a placeholder SLO would alert you
#      against a budget you never chose. Define your SLOs on top of these SLIs (Sloth / Pyrra / hand-written
#      burn-rate) when you know your budget. The SLI foundation is done; the target is yours.
#
# TWIN: the k8s copy is inline in k8s/charts/infra/prometheus/templates/configmap.yaml (the `rules.yml` key).
# Keep the two IN SYNC -- the same way prometheus.yml itself is duplicated docker-vs-k8s.
groups:
  - name: esquire-framework-health
    rules:
      # A scrape target vanished -- a service (or its metrics endpoint) is gone. Not a threshold: up is 0 or 1.
      - alert: EsqServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Esquire target {{ $labels.job }} / {{ $labels.instance }} is DOWN"
          description: "No successful scrape for 1m."
      # A send-retry hit max-attempts and DROPPED the message -- data loss. Any drop at all is the alert.
      - alert: EsqBusRetryDropped
        expr: increase(messaging_retry_dropped_total[5m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Bus DROPPED a message (data loss) on {{ $labels.bus_id }}"
          description: "send-retry reached max-attempts and dropped -- a message was lost."
      # A circuit breaker tripped -- a downstream route is failing fast. The metric is 1 for the current state.
      - alert: EsqCircuitBreakerOpen
        expr: resilience4j_circuitbreaker_state{state="open"} == 1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Circuit breaker {{ $labels.name }} is OPEN"
          description: "The breaker has tripped; the route is fast-failing until it half-opens."
      # Threads are blocked waiting for a DB connection -- the pool is saturated. Sustained (2m), not a spike.
      - alert: EsqDbPoolStarved
        expr: hikaricp_connections_pending > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "DB pool {{ $labels.pool }} has threads WAITING for a connection"
          description: "Sustained pending connections -- the pool is at capacity."
