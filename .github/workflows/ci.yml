# Esquire services -- CI (phase 1)
# Runs on every push and PR (public repo -> free hosted minutes). Builds the reactor and runs the
# full test suite (unit + the Testcontainers integration test). One secret, GHCR_TOKEN, for Maven to read
# the Armoury and Herald jars from GitHub Packages. No deploy, no runner.
# Design: doc/Esquire.GitHubActions.md (sections 4.1, 8a). Logic lives in .github/scripts/ci.sh.
name: CI

on:
  push:
  pull_request:

# One in-flight run per ref; a newer push cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 24 (Temurin) + Maven cache
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "24"
          cache: maven

      # Armoury and Herald come from their GitHub Packages registries. Reading another repository's
      # package uses the repository secret GHCR_TOKEN, the same personal access token (classic) the
      # image pushes use; its packages scope covers the Maven registry too. The server ids match the
      # <repositories> in the poms.
      - name: Maven settings for GitHub Packages
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'EOF'
          <settings>
            <servers>
              <server>
                <id>armoury</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GHCR_TOKEN}</password>
              </server>
              <server>
                <id>herald</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GHCR_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Build + verify the reactor
        run: bash .github/scripts/ci.sh
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
