{{- $replicas := int (.Values.replicaCount | default 1) -}}
{{- if gt $replicas 10 -}}
{{- fail (printf "esquire-kcmaster: replicaCount=%d exceeds the cap of 10. The per-instance number is a single decimal digit (0-9) -- the fleet naming rule (pod ordinal -> rod-id <app>.<instanceNo>) caps replicas at 10." $replicas) -}}
{{- end -}}
{{- if lt $replicas 1 -}}
{{- fail (printf "esquire-kcmaster: replicaCount=%d must be >= 1" $replicas) -}}
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-kcmaster
  labels:
    app: {{ .Release.Name }}-kcmaster
spec:
  serviceName: {{ .Release.Name }}-kcmaster-hl
  replicas: {{ $replicas }}
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: {{ .Release.Name }}-kcmaster
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-kcmaster
    spec:
      containers:
        - name: kcmaster
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args: ["java", "-jar", "app.jar"]
          ports:
            - containerPort: {{ .Values.service.port }}
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-kcmaster-config
          env:
            - name: KC_ADMIN_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-kcmaster-secret
                  key: kc-admin-client-secret
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: {{ .Values.service.port }}
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: {{ .Values.service.port }}
            initialDelaySeconds: 40
            periodSeconds: 15
            timeoutSeconds: 5
          volumeMounts:
            - name: esquire-topology
              mountPath: /etc/esquire
              readOnly: true
      volumes:
        - name: esquire-topology
          configMap:
            name: esquire-topology
