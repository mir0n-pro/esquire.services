{{- /* GENERATED by compose/o11y/grafana/gen-datasources.py -- DO NOT EDIT BY HAND. */}}
{{- /* Edit the generator and re-run it; it emits docker AND k8s so the two cannot drift. */}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-datasources
  labels:
    app: {{ .Release.Name }}
data:
  loki.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        access: proxy
        uid: "esq-loki"
        url: {{ .Values.loki.url }}
        isDefault: true
        jsonData:
          maxLines: 1000
          derivedFields:
            - name: TraceID
              matcherType: label
              matcherRegex: correlationId
              datasourceUid: "esq-tempo"
              url: "$${__value.raw}"
              urlDisplayLabel: View trace
  tempo.yaml: |
    apiVersion: 1
    datasources:
      - name: Tempo
        type: tempo
        access: proxy
        uid: "esq-tempo"
        url: {{ .Values.tempo.url }}
        jsonData:
          httpMethod: GET
          tracesToLogsV2:
            datasourceUid: "esq-loki"
            spanStartTimeShift: "-5m"
            spanEndTimeShift: 5m
            filterByTraceID: false
            filterBySpanID: false
            customQuery: true
            query: "{job=~\"esq-.*\"} | correlationId = `$${__span.traceId}`"
          tracesToMetricsV2:
            datasourceUid: "esq-prometheus"
            spanStartTimeShift: "-5m"
            spanEndTimeShift: 5m
            queries:
              - name: Request rate (req/s)
                query: "sum(rate(http_server_requests_seconds_count{application=\"$${__span.tags['esq.app']}\"}[5m]))"
              - name: Error rate (5xx/s)
                query: "sum(rate(http_server_requests_seconds_count{application=\"$${__span.tags['esq.app']}\",status=~\"5..\"}[5m]))"
          nodeGraph:
            enabled: true
          serviceMap:
            datasourceUid: "esq-prometheus"
  prometheus.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: "esq-prometheus"
        access: proxy
        url: {{ .Values.prometheus.url }}
        isDefault: false
        jsonData:
          httpMethod: POST
          exemplarTraceIdDestinations:
            - name: trace_id
              datasourceUid: "esq-tempo"
