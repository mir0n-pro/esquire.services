image:
  repository: esquire.gateward
  tag: latest
  pullPolicy: IfNotPresent

# HA scheduling (pre-HA defaults: no node pinning, no spread). The OKE overlay sets
# nodeSelector.tier=app and turns topologySpread on to place the x2 replicas on
# distinct app-tier nodes; local (single node) leaves both off.
nodeSelector: {}
topologySpread:
  enabled: false

# The gate's console profile PLUS the two the cache needs: dev-postgres is the JDBC datasource it loads
# from, cache-h2 the in-memory store it loads into. Standing apart these belonged to bizTree; in one
# process they belong to the one process.
springProfilesActive: "console,dev-postgres,cache-h2"

# shared bus topology is delivered by the esquire-topology ConfigMap, mounted at /etc/esquire.
topologyImport: optional:file:/etc/esquire/topology.yml

# ClusterIP, fronted by ingress-nginx exactly as the standalone gateway is.
service:
  type: ClusterIP
  port: 8080
  managementPort: 8090   # actuator/management port (F0 A6); probes + MANAGEMENT_SERVER_PORT read this
  lbPort: 8080         # service port, aligned to container port (no LB tier)

keycloak:
  host: esquire-infra-kc-keycloak
  port: 8080
  path: /kc-auth   # matches KC_HTTP_RELATIVE_PATH on the KC pod
  realm: esquire
  clientId: esq-angular

# Where the OTHER services are. There is no biztreeHost: the five tree routes are answered in this
# process, so the route that pointed at bizTree is not in the table at all.
backends:
  # Mesnie answers for enyMan and keySmith in ONE workload, so both routes point at it on one port.
  enymanHost: esquire-mesnie-mesnie
  enymanPort: 3003
  pacmanHost: esquire-pacman-pacman
  pacmanPort: 3003
  keysmithHost: esquire-mesnie-mesnie
  keysmithPort: 3003

cors:
  # Ingress hosts (local). OKE overlay overrides to https://esquire.mir0n.pro,
  # https://api.esquire.mir0n.pro.
  allowedOrigins: http://esquire.localhost,http://api.esquire.localhost

# Token Relay -- the umbrella covering Vanilla Token Relay (HTTP Basic at
# edge -> client_credentials grant) and Phantom Token Relay (stripped Bearer
# at edge -> RFC 8693 token-exchange). Both variants share one KC /token
# endpoint and one cache. A variant is dormant when its `clients` allowlist
# is empty. exchangeClientSecret is passed at install via --set so it never
# lands in chart defaults.
tokenRelay:
  tokenUri: ""                  # http://<kc-host>:<port>/<kc-path>/realms/<realm>/protocol/openid-connect/token
  vanilla:
    clients: ""                 # comma-separated KC clientId list (e.g. "esq-hauberk-S")
  phantom:
    clients: ""                 # comma-separated KC clientId list (e.g. "esq-hauberk-M")
    exchangeClientId: esq-gw-exchange
    exchangeClientSecret: ""    # passed via --set at install

# R1 outbound HTTP client connection pool (gate -> backend services).
# Defaults here = the Reactor Netty pool behavior we ran before HA work.
resilience:
  gwPoolMaxConnections: "16"       # spring.cloud.gateway.httpclient.pool.max-connections
  gwPoolAcquireTimeoutMs: "45000"  # spring.cloud.gateway.httpclient.pool.acquire-timeout
  # The cache's POSTGRES pool (the load side). Pre-HA defaults, as bizTree ran them.
  # NOTE there is no Tomcat block here and there must not be: this process is WebFlux, and the
  # ESQ_TOMCAT_* knobs the standalone bizTree carries reach nothing in it.
  txTimeoutSeconds: "-1"          # R1 spring.transaction.default-timeout (-1 = inherit, no cap)
  dbPoolMax: "20"                 # R3 Hikari maximum-pool-size
  dbPoolMinIdle: "20"             # R3 Hikari minimum-idle
  dbConnectTimeoutMs: "30000"     # R3 Hikari connection-timeout (Hikari default)
  dbSocketTimeoutSeconds: "0"     # R5 pgjdbc socketTimeout (0 = none)
  dbTcpKeepAlive: "false"         # R5 pgjdbc tcpKeepAlive

# The database the cache loads ITSELF from at start-up. This is what makes the gate stateful: it cannot
# serve a tree read until this read has completed, which is what the readiness gate below is for.
db:
  vendor: dev-postgres
  host: esquire-infra-postgres
  port: 5432
  name: esq2025
  username: esq2025
  password: q

# H2 local cache: the Taijitu two-monad store (in-mem, kept alive for the JVM lifetime).
h2:
  vendor: cache-h2
  url: "jdbc:h2:mem:biztree;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE"
  poolMax: "10"
  poolMinIdle: "10"
  poolConnTimeout: "5000"
  poolIdleTimeout: "600000"
  poolMaxLifetime: "1800000"

# The scheduler the cache reads run on, so a blocking JDBC call never lands on a Netty event-loop thread.
# Empty = follow the H2 pool above, which is the sizing that makes sense: more threads than connections
# only queues the wait somewhere less visible, fewer wastes the pool.
cacheRead:
  poolSize: ""
  queueCapacity: "1000"

# entity-bus ref: the ward is the CONSUMER (drains the entity broadcast into its cache).
entity:
  busId: esquire.entity
  slotId: entity
  broadcastPoolSize: "4"
  broadcastConcurrency: "1"
  poolMode: "platform"            # ENTITY_BROADCAST_POOL_MODE (platform | virtual | virtual-per-task, default platform)

# v1.2.5 Taijitu two-monad cache + night-watch sweep
#   director:   legacy (single-pass) | taijitu (two-monad + anti-entropy night-watch)
#   onMismatch: LOG (detect + keep serving -- conservative) | SWAP (promote the fresh shadow --
#               self-heal) | TERMINATE (exit; k8s relaunches from a clean load)
# TERMINATE is the one that must not be used here: this process is also the gate, so terminating on a
# cache mismatch would take the whole edge down with the cache.
taijitu:
  director: taijitu
  onMismatch: SWAP
  sweepIntervalMs: "600000"
  sweepTimeoutMs: "10000"
  queueCapacity: "4096"
  bulkThreshold: "10"

logging:
  levelRoot: ERROR
  levelSf: ERROR
  levelMir0n: DEBUG
  levelDevelop: DEBUG
  levelMsg: DEBUG
  levelAmq: INFO
  levelJms: INFO
  developLogPath: /tmp/gateWard-develop.log
  msgLogPath: /tmp/gateWard-msg.log

# v1.2.11 O2 distributed tracing (opt-in; the o11y stack + o11y-on.bat enable it). OFF by default.
observability:
  # ONE master switch: tracing + metrics together (v1.2.11 O1/O2). Off by default.
  enabled: "false"
  # Per-pillar enable (I41). Empty = follow the master `enabled`. Set "false" to run that pillar off:
  #   tracingEnabled "false" = metrics-only (service-mesh coexistence -- a mesh already traces the wire).
  tracingEnabled: ""
  metricsEnabled: ""
  # Percentile buckets on every latency timer (O1/T5-B). OFF by default -- they cost ~2.3x the
  # scrape, paid on every scrape whether or not anyone looks.
  metricsHistograms: "false"
  # HTTP byte counters (O1/T5-C). Cheap, so ON by default.
  metricsBandwidth: "true"
  # Business meters (O1/T8): the esq.biz.* domain tier. ON by default; off = every call site a null check.
  metricsBusiness: "true"
tracing:
  otlpEndpoint: http://esquire-infra-otel-collector:4318/v1/traces
  samplingRatio: "1.0"
  marksEnabled: "true"
  # RR liveness heartbeat (TestRequest/HeartBeat) spans -- OFF by default on EVERY target (unified I14).
  msgBusAliveTrace: "false"
  excludedPaths: "/actuator"
