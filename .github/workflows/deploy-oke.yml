# Esquire services -- deploy to OKE (phase 3).
#
# On a PR merge from a `pending-*` branch into `develop`, a GitHub-HOSTED runner builds +
# pushes the release images to GHCR, then -- behind a manual-approval Environment -- deploys
# them to the Oracle OKE cluster and validates the release (e2e + load) against the public
# domain https://esquire.mir0n.pro.
#
# This mirrors the proven manual flow (k8s-oci-compact/oke-login -> ghcr-push -> oke-up) but on a
# hosted Linux runner, reusing two thin scripts as the single source of logic:
#   .github/scripts/oke-build-push.sh   (mvn + multi-arch buildx push to GHCR)
#   .github/scripts/deploy-oke.sh       (helm upgrade --install per chart, OKE values)
# Design: doc/Esquire.GitHubActions.md sec 4.3.
#
# ---------------------------------------------------------------------------
# REQUIRED Environment ("oke-production") secrets / variables:
#   secret  OCI_CLI_USER          OCI user OCID         (api-key auth)
#   secret  OCI_CLI_TENANCY       OCI tenancy OCID
#   secret  OCI_CLI_FINGERPRINT   api key fingerprint
#   secret  OCI_CLI_KEY_CONTENT   the api private key (PEM, full content)
#   var     OKE_REGION            e.g. ca-toronto-1     (default below)
#   var     OKE_CLUSTER_OCID      the OKE cluster OCID
#   secret  MIR0N_PWD             postgres + Keycloak admin password
#   secret  BFF_KC_SECRET         (optional) esq-angular BFF client secret
#   secret  GW_EXCHANGE_SECRET    (optional) gateWard phantom-relay exchange secret
#   secret  BFF_SESSION_SECRET    (optional) BFF session-cookie HMAC secret
#   secret  KCMASTER_ADMIN_SECRET REQUIRED. esq-kcMaster KC admin service-account client secret.
#                                 It is the one published client holding realm-admin, so the deploy
#                                 script has NO fallback for it and stops when it is missing or empty.
#                                 A REPOSITORY secret, not an environment one: validate declares no
#                                 environment and would receive an environment secret as empty. --
#                                 also handed to the e2e job as KC_ADMIN_SECRET, which 21-credential-
#                                 state-sync needs to read required actions off the KC admin api
# GHCR push authenticates with the GHCR_TOKEN PAT secret (a GitHub PAT with write:packages) --
# the same identity (mir0n-pro) that created the existing packages via the manual push flow, so it
# already has write access to them. Add GHCR_TOKEN as a repository Actions secret.
# ---------------------------------------------------------------------------
name: Deploy OKE

on:
  # Run ONLY when a `pending-*` PR is MERGED into develop -- not on a direct push
  # to develop, and not on a PR that is closed WITHOUT merging. The if: guard on
  # build-push enforces `merged == true` AND head branch = pending-*. Because this
  # is a pull_request event, GitHub evaluates the workflow file from the BASE branch
  # (develop), so the very PR that first INTRODUCES this file does not self-trigger.
  pull_request:
    types: [closed]
    branches: [develop]
  workflow_dispatch:
    inputs:
      deploy_infra:
        description: "Re-roll infra (postgres / activemq / keycloak) too. Leave FALSE for app-only deploys: rolling the broker drops every app pod's messaging bus and stalls the rollout."
        type: boolean
        default: false

# Never interrupt a prod rollout already in flight.
concurrency:
  group: deploy-oke
  cancel-in-progress: false

permissions:
  contents: read
  packages: write   # GHCR push via GITHUB_TOKEN

env:
  OWNER: mir0n-pro

jobs:
  # -------------------------------------------------------------------------
  build-push:
    # Gate the whole chain: a manual workflow_dispatch, OR a MERGED pull_request
    # whose head branch is pending-*. deploy + validate hang off `needs:`, so
    # skipping build-push skips them too. Close-without-merge or a non-pending
    # head branch -> no run.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       startsWith(github.event.pull_request.head.ref, 'pending-'))
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.stamp.outputs.tag }}
      explorer_ref: ${{ steps.refs.outputs.explorer }}
      dbseed_ref: ${{ steps.refs.outputs.dbseed }}
    steps:
      - name: Checkout services
        uses: actions/checkout@v5
        with:
          # PR merge -> the real merge commit on develop; dispatch -> the chosen branch.
          ref: ${{ github.event.pull_request.merge_commit_sha || github.ref }}
          path: services

      # The sibling repos carry a same-named sprint branch when the sprint touches them, and none when it
      # does not. Resolve each ref BEFORE checking it out -- ls-remote asks which branch is actually there --
      # so a workflow_dispatch against pending-* picks the sprint work up, while a merged PR (whose ref_name
      # is the PR merge ref, not a branch name) matches nothing and lands on develop, which is correct: by
      # then both repos have merged in lockstep.
      - name: Resolve the explorer / db.seed refs
        id: refs
        run: |
          ref="${{ github.ref_name }}"
          case "$ref" in
            pending-v*) alt="pending-${ref#pending-v}" ;;
            pending-*)  alt="pending-v${ref#pending-}" ;;
            *)          alt="$ref" ;;
          esac

          pick() {
            got=""
            for cand in "$ref" "$alt"; do
              if [ -z "$got" ] && git ls-remote --heads --exit-code "https://github.com/$1" "refs/heads/$cand" >/dev/null 2>&1; then
                got="$cand"
              fi
            done
            if [ -z "$got" ]; then
              got="develop"
            fi
            echo "$got"
          }

          explorer="$(pick mir0n-pro/esquire.explorer)"
          dbseed="$(pick mir0n-pro/esquire.db.seed)"
          echo "explorer=$explorer" >> "$GITHUB_OUTPUT"
          echo "dbseed=$dbseed"     >> "$GITHUB_OUTPUT"
          echo "explorer -> $explorer"
          echo "db.seed  -> $dbseed"

      - name: Checkout explorer (backend / BFF image + e2e + load)
        uses: actions/checkout@v5
        with:
          repository: mir0n-pro/esquire.explorer
          ref: ${{ steps.refs.outputs.explorer }}
          path: explorer

      - name: Checkout db.seed (postgres image build input)
        uses: actions/checkout@v5
        with:
          repository: mir0n-pro/esquire.db.seed
          ref: ${{ steps.refs.outputs.dbseed }}
          path: db.seed

      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "24"
          cache: maven

      - name: Compute image stamp (Micro from release_notes + datetime)
        id: stamp
        shell: bash
        run: |
          micro=$(grep -m1 -oE '^v[0-9]+\.[0-9]+\.[0-9]+' services/doc/release_notes.txt)
          ts=$(date -u +%y%m.%d%H)
          echo "tag=${micro}-${ts}" >> "$GITHUB_OUTPUT"
          echo "image tag = ${micro}-${ts}"

      - name: Set up QEMU (arm64 emulation for the A1.Flex nodes)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: mir0n-pro
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build + push the 7 super-compact images (multi-arch)
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.stamp.outputs.tag }}
          OWNER: ${{ env.OWNER }}
          RUN_VERIFY: "false"   # CI already ran full verify on the PR
        run: bash services/.github/scripts/oke-build-push.sh

  # -------------------------------------------------------------------------
  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    # Manual-approval gate: configure required reviewers on this Environment.
    environment:
      name: oke-production
      url: https://esquire.mir0n.pro
    env:
      # OCI CLI reads these natively (api-key auth) -- used for create-kubeconfig
      # AND by the kubeconfig exec plugin (oci ce cluster generate-token).
      OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
      OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
      OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
      OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
      OCI_CLI_REGION: ${{ vars.OKE_REGION || 'ca-toronto-1' }}
      OCI_CLI_AUTH: api_key
    steps:
      - name: Checkout services (charts + OKE values + deploy script)
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.ref }}
          path: services

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Install OCI CLI
        run: pip install --upgrade oci-cli

      - name: Fetch OKE kubeconfig
        run: |
          oci ce cluster create-kubeconfig \
            --cluster-id "${{ vars.OKE_CLUSTER_OCID }}" \
            --file "$HOME/.kube/config" \
            --region "${OCI_CLI_REGION}" \
            --token-version 2.0.0 \
            --kube-endpoint PUBLIC_ENDPOINT
          kubectl config current-context

      - name: Deploy to OKE (helm upgrade --install)
        shell: bash
        env:
          IMAGE_TAG: ${{ needs.build-push.outputs.image_tag }}
          # Routine app deploys leave infra running (default false); rolling the broker drops the
          # app buses (which do not self-heal) and stalls the rollout. Set true only when the
          # postgres / activemq / keycloak image itself changed.
          DEPLOY_INFRA: ${{ github.event.inputs.deploy_infra || 'false' }}
          MIR0N_PWD: ${{ secrets.MIR0N_PWD }}
          BFF_KC_SECRET: ${{ secrets.BFF_KC_SECRET }}
          GW_EXCHANGE_SECRET: ${{ secrets.GW_EXCHANGE_SECRET }}
          BFF_SESSION_SECRET: ${{ secrets.BFF_SESSION_SECRET }}
          KCMASTER_ADMIN_SECRET: ${{ secrets.KCMASTER_ADMIN_SECRET }}
        run: bash services/.github/scripts/deploy-oke.sh

  # -------------------------------------------------------------------------
  validate:
    needs: [deploy, build-push]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout explorer (e2e + hauberk)
        uses: actions/checkout@v5
        with:
          repository: mir0n-pro/esquire.explorer
          ref: ${{ needs.build-push.outputs.explorer_ref }}

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: e2e -- Playwright vs the public OKE domain
        working-directory: e2e-test
        env:
          BASE_URL: https://esquire.mir0n.pro
          # 20-token-relay talks to the gate + KeyCloak DIRECTLY (not through the BFF), so it needs the
          # public OKE gate host and KC path; without them it falls back to localhost and ECONNREFUSEs.
          GATEWAY_URL: https://api.esquire.mir0n.pro
          KC_URL: https://esquire.mir0n.pro/kc-auth
          # Token Relay is DISABLED on the internet-facing OKE gate (empty allowlists -- see
          # k8s-oci-compact/values/gateward.yaml, 2026-07-20). This flag makes 20-token-relay's two specs
          # skip on OKE only; docker / local k8s leave it unset and keep running them.
          RELAY_DISABLED: "true"
          # 21-credential-state-sync reads the user's required actions through KeyCloak's ADMIN api -- that is
          # where a forced password change and a TOTP request actually land. It authenticates as esq-kcMaster,
          # the same service account kcMaster itself uses. A secret that is not configured arrives here as an
          # EMPTY string, and the spec falls back to the committed demo secret -- the same fallback
          # deploy-oke.sh applies, so the deploy and the gate use one value. Set this secret once the
          # esq-kcMaster client is rotated in KeyCloak, and the deploy job takes it from the same place.
          KC_ADMIN_SECRET: ${{ secrets.KCMASTER_ADMIN_SECRET }}
        run: |
          npm ci || npm install
          npx playwright install --with-deps chromium
          npm test

      # Load gate -- hauberk against OKE (hauberk-oke.properties).
      # TODO: confirm the sim name + that hauberk-oke.properties is committed,
      # then drop continue-on-error to make load a hard gate.
      - name: Set up JDK 24 (hauberk)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "24"
          cache: maven
      - name: load -- hauberk smoke vs OKE
        continue-on-error: true
        working-directory: hauberk
        run: |
          mvn -B -ntp -DskipTests package
          java --add-opens java.base/java.lang=ALL-UNNAMED \
               --add-opens java.base/java.util=ALL-UNNAMED \
               --add-opens java.base/java.util.concurrent=ALL-UNNAMED \
               -jar target/hauberk.jar run smoke --config hauberk-oke.properties
