spring:
  profiles:
    active: ${DB_KEYSMITH_VENDOR:dev-postgres}
  application:
    name: keysmith
  config:
    import: "${ESQUIRE_TOPOLOGY_IMPORT:file:/etc/esquire/topology.yml}"
keysmith:
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  mvc:
    problemdetails:
      enabled: true
# Bus TOPOLOGY (which buses exist + their transport) is the shared esquire-topology.yml imported above.
# Here: this service's bus REFS + per-service knob OVERRIDES, and the service-LOCAL audit (b) in-process leg.
esquire:
  keysmith-messaging-bus:
    - bus-id: audit-b
      slot:
        - slot-id: audit
          x-rod:
            rod-class: pro.mir0n.esquire.common.audit.XRodLogDb
            pool-size: ${ESQUIRE_AUDIT_POOL_SIZE:4}
            feed-capacity: ${ESQUIRE_AUDIT_FEED_CAPACITY:4096}
            virtual-threads: ${ESQUIRE_AUDIT_VIRTUAL_THREADS:false}
            log-db:
              vendor: ${ESQUIRE_AUDIT_LOG_DB_VENDOR:dev-postgres}
              url: ${ESQUIRE_AUDIT_LOG_DB_URL:jdbc:postgresql://${DB_KEYSMITH_HOST:localhost}:${DB_KEYSMITH_PORT:5432}/${DB_KEYSMITH_NAME:esq2025}}
              username: ${ESQUIRE_AUDIT_LOG_DB_USERNAME:${DB_KEYSMITH_USERNAME:esq2025}}
              password: ${ESQUIRE_AUDIT_LOG_DB_PASSWORD:${DB_KEYSMITH_PASSWORD:q}}
              pool-size: ${ESQUIRE_AUDIT_LOG_DB_POOL_SIZE:2}
  audit-bus:
    messaging-bus:
      bus-id: ${ESQUIRE_AUDIT_BUS_ID:audit-b}
      slot-id: ${ESQUIRE_AUDIT_SERVICE_ID:audit}
  kc-bus:
    messaging-bus:
      bus-id: ${KC_BUS_ID:esquire.kc}
      slot-id: ${KC_SERVICE_ID:kc}
      x-rod:
        pool-size: ${KEYSMITH_KC_RESPONSE_POOL_SIZE:2}
        concurrency: ${KEYSMITH_KC_RESPONSE_CONCURRENCY:1}
        publisher-pool-size: ${KEYSMITH_KC_PUBLISHER_POOL_SIZE:0}
logging:
  level:
    root: ${LOG_LEVEL_ROOT:ERROR}
    org:
      springframework: ${LOG_LEVEL_SF:ERROR}
      springframework.jms: ${LOG_LEVEL_JMS:ERROR}
      apache:
        activemq: ${LOG_LEVEL_AMQ:ERROR}
    pro:
      mir0n: ${LOG_LEVEL_MIR0N:ERROR}
    develop: ${LOG_LEVEL_DEVELOP:DEBUG}
    msg: ${LOG_LEVEL_MSG:INFO}
  develop:
    log-path: ${DEVELOP_LOG_PATH:logs/keySmith-develop.log}
  msg:
    log-path: ${MSG_LOG_PATH:logs/keySmith-msg.log}

---
# Development Oracle
spring:
  config:
    activate:
      on-profile: dev-oracle
  datasource:
    url: jdbc:oracle:thin:@//${DB_KEYSMITH_HOST:localhost}:${DB_KEYSMITH_PORT:1521}/${DB_KEYSMITH_NAME:MIR0N}
    driverClassName: oracle.jdbc.OracleDriver
    username: ${DB_KEYSMITH_USERNAME:esq2025}
    password: ${DB_KEYSMITH_PASSWORD:q}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 20
      connection-timeout: 30000
      max-lifetime: 1800000
      idle-timeout: 600000
  jpa:
    mapping-resources:
      - META-INF/oracle-access-profile.xml
      - META-INF/oracle-roles.xml
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
server:
  port: ${KEYSMITH_PORT:3000}

---
# Development Postgres
spring:
  config:
    activate:
      on-profile: dev-postgres
  datasource:
    url: jdbc:postgresql://${DB_KEYSMITH_HOST:localhost}:${DB_KEYSMITH_PORT:5432}/${DB_KEYSMITH_NAME:esq2025}
    username: ${DB_KEYSMITH_USERNAME:esq2025}
    password: ${DB_KEYSMITH_PASSWORD:q}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 20
      connection-timeout: 30000
      max-lifetime: 1800000
      idle-timeout: 600000
  jpa:
    mapping-resources:
      - META-INF/postgres-access-profile.xml
      - META-INF/postgres-roles.xml
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
server:
  port: ${KEYSMITH_PORT:3000}
