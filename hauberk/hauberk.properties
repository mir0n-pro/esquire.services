# Esquire Haubergeon -- connectivity config.
#
# WHERE the hauberk connects:
#   kc.base   -- Keycloak root, including any path prefix
#   kc.realm  -- KC realm name
#   gw.base   -- gateway root
#
# HOW the hauberk authenticates:
#   kc.client.id      -- KC client (the hauberk's dedicated client)
#   kc.client.secret  -- KC client secret (dev value matches realm import)
#
# Edit this file to point at a different stack (local k8s, OKE, etc.).
# No env vars, no profiles, no fallbacks -- this single file is the config.

# Compose defaults (KC at localhost:8081/kc-auth, gateway at localhost:7070).
kc.base=http://localhost:8081/kc-auth
kc.realm=esquire
kc.client.id=esq-hauberk
kc.client.secret=esq-hauberk-dev-secret-rotate-in-prod
gw.base=http://localhost:7070
bff.base=http://localhost:3000
# enyMan, reached DIRECTLY (not via the gateway) for the R6 HA timeout smoke -- it hits the flag-gated
# /test slow-query hook on enyMan's own port (compose exposes 3003; local k8s = port-forward enyman:3003).
enyman.base=http://localhost:3003

# KC master-realm bootstrap admin (compose KC_BOOTSTRAP_ADMIN_*). Used by sims
# that touch the KC admin REST API: race-8c verify (RaceMoveCreateKc) and the
# CleanupKcOrphans chain. Compose default = admin/q.
kc.admin.user=admin
kc.admin.password=q

# esq2025 direct connection for the `kc-reconcile` utility (PG/JDBC; out-of-band recovery -- it reads the
# authoritative connected-user state straight from the DB, not through the services).
pg.url=jdbc:postgresql://localhost:5433/esq2025
pg.user=esq2025
pg.password=q

# Token Relay pattern this run targets at the gateway. The utility uses
# this as its single semantic switch -- it never special-cases a client
# id by name.
#   plain    (default) -- Plain JWT: client sends Bearer (KC JWT);
#                         gateway validates JWS locally; no token relay.
#   vanilla            -- Vanilla Token Relay: client sends HTTP Basic
#                         with client_id:client_secret; gateway runs
#                         client_credentials on the client's behalf and
#                         caches per client_id. Requires the gateway's
#                         vanilla allowlist to include kc.client.id.
#   phantom            -- Phantom Token Relay: client sends Bearer
#                         (KC JWT); gateway runs RFC 8693
#                         token-exchange via its dedicated exchange
#                         client and caches per source-token jti.
#                         Requires the gateway's phantom allowlist to
#                         include kc.client.id.
# To run against a different pattern: change tokenRelay.type AND set
# kc.client.id + kc.client.secret to a KC client the gateway is
# configured to accept under that pattern.
tokenRelay.type=plain

# Playground scope -- the hauberk acts on behalf of the Test Driver / Test
# Driver S admins (uid=15 / 16), whose esq_rootpath="1.14." caps their
# visibility to the Test House subtree. Every office / user / account the
# hauberk creates must root itself here, NOT under the global root pk=1.
# Override in hauberk-S.properties (or other overlay) if a variant client
# needs a different scope.
playground.parent.id=14

# Prepare shape (PrepareForAnythingSimulation).
#   prepare.offices.depth       -- D nested offices, chain L1->L2->...->Ld.
#                                  L1 is the SHARED top office (named per
#                                  EntitySmoke convention "hauberk-office-smoke");
#                                  L2..Ld are per-worker, named "w{vu}-l{n}"
#                                  so concurrent VUs don't collide. Default 1
#                                  = no nesting (single shared office).
#   prepare.clients.per.office  -- N client users created in EACH office.
#   prepare.accounts.per.client -- M accounts per client (kind=50). Zero is OK.
# Total accounts created per VU = D * N * M. Example 5:20:2 = 200 per VU.
# No transactions, no cleanup; CleanupOfficeByName walks the whole subtree
# from L1, so one teardown call cleans every level + all worker chains.
prepare.offices.depth=1
prepare.clients.per.office=1
prepare.accounts.per.client=0

# Move shape (MoveSmokeSimulation).
#   move.offices.depth        -- D nested offices L1->L2->...->Ld; MIN 3.
#                                Move-USR source = L2 (the "middle"); USR
#                                moves to L_d (bottom). Move-ORG source = L3;
#                                ORG moves to L1 (top). Depth < 3 would
#                                degenerate the test (L2 already under L1).
#   move.clients.per.office   -- N users per office (each level). The FIRST
#                                user at L2 is the one moved.
#   move.accounts.per.client  -- M accounts per user. When > 0, the moved
#                                user carries accounts along through both
#                                move ops (cascade test).
# Defaults 4 : 1 : 0 = the minimum meaningful shape: 4 offices, 1 user at
# each, no accounts. Bump to e.g. 4 : 2 : 1 to exercise account cascade.
move.offices.depth=4
move.clients.per.office=1
move.accounts.per.client=0

# SuperLoad shape (SuperLoadSimulation).
#   super.duration.seconds  -- global cap; every scenario halts after N seconds.
#                              Long value = "near infinite": 86400 = 1 day,
#                              2592000 = 30 days.
#   super.{name}.workers    -- per-scenario parallel VU count. 0 disables.
#                              All workers share the SAME pre-built playground
#                              (assume PrepareForAnything ran first, depth>=4).
# Scenarios (a..e):
#   read    -- random user picked from pool; GET /esq-cmd?kind=34&id=...
#   update  -- random user; POST /esq-cmd-save addr update (per-iteration slug)
#   create  -- create+delete user under deepest office (Ld); unique random emails
#   move    -- SAME shared office (w1-l3): oscillate to L1 and back to w1-l2
#   tx      -- random account; Deposit then Withdrawal (net-zero per iter)
super.duration.seconds=60
super.read.workers=4
super.update.workers=2
super.create.workers=2
super.move.workers=2
super.tx.workers=4
super.tree.workers=0
super.readacct.workers=0
super.treesmall.workers=0
super.cache.workers=0
super.cachesmall.workers=0

# Infra-orchestration commands, run AS SIM STEPS via Cmd.run("<key>") (ProcessBuilder through the
# OS shell). This is what lets a Simulation drive the stack itself -- stop/start the broker to lose
# JMS messages (MessageLoss), or restart bizTree mid-creation to reproduce the cache-load race (8a)
# -- with no operator. Override per target (a k8s overlay would use `kubectl` here instead of docker).
cmd.stop-amq=docker stop esq-activemq
cmd.start-amq=docker start esq-activemq
cmd.restart-biztree=docker restart esq-biztree
# recreate biztree picking up the BIZTREE_ON_MISMATCH env the sim sets (LOG|SWAP|TERMINATE)
cmd.recreate-biztree=docker compose -f C:/MyProjects/esquire/services2/compose/compose.yaml up -d --no-build --force-recreate biztree

# ---------------------------------------------------------------------------
# What the HARNESS itself needs told. Armoury's armoury-hauberk knows no target:
# which package holds the Simulations, what to probe before a run, and which
# timing headers the stack reports are all settings now, not code. A value may
# refer to another setting as ${other.key}.
# ---------------------------------------------------------------------------

# Where this project's concrete Simulation classes live -- SimulationCatalog scans it.
simulations.package=pro.mir0n.esquire.hauberk.simulations

# The pre-flight probes (hauberk run, unless --no-health-check). A health.probe.<name>
# passes on any status below 500; health.auth.probe must return 200 and is the one that
# presents the edge credential this run is configured for, so it smoke-tests KC + the
# gateway + the Token Relay variant at once. These three are what the harness used to
# have hard-coded.
health.probe.kc=${kc.base}/realms/${kc.realm}/.well-known/openid-configuration
health.probe.gw=${gw.base}/actuator/health
health.auth.probe=${gw.base}/esq-kinds

# The Performance Matrix headers (hauberk run --metrics). The capture trigger the harness
# sends, and the four timing headers the Esquire stack returns, outermost first: the
# gateway as the client sees it, the gateway's own inner time, the service behind it, and
# that service's inner time. They mirror EsqConstants; a blank name would mean the column
# is not reported.
perf.header.capture=X-Capture-Metrics
perf.header.gw.outer=X-Response-Time
perf.header.gw.inner=Esq-Gw-Inner-Time
perf.header.srv.outer=Esq-Srv-Outer-Time
perf.header.srv.inner=Esq-Srv-Inner-Time
# Written into every perf-matrix CSV and the summary line, so an esq-hauberk run and an
# esq-hauberk-S run of the same Simulation can be told apart.
perf.run.label=${kc.client.id}

# The kcMaster admin client. It used to be a default inside the harness; the harness no
# longer knows any Esquire name, so the value is stated here.
kc.admin.client.id=esq-kcMaster
