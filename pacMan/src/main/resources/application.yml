spring:
  profiles:
    active: ${DB_PACMAN_VENDOR:dev-postgres}
  application:
    name: pacman
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  mvc:
    problemdetails:
      enabled: true
  config:
    import: "${TOPOLOGY_IMPORT:optional:file:/etc/esquire/topology.yml}"
# this service's OWN overlay of the global esquire.messaging-bus catalog: its in-process audit-b leg
# (datasource is service-specific), under the service namespace.
pacman:
  messaging-bus:
    - bus-id: audit-b
      slots:
        - slot-id: audit
          x-rod:
            rod-class: pro.mir0n.esquire.dataKeep.keep.XRodInProcess
            pool-size: ${AUDIT_POOL_SIZE:4}
            feed-capacity: ${AUDIT_FEED_CAPACITY:4096}
            virtual-threads: ${AUDIT_VIRTUAL_THREADS:false}
            datasource:
              # shared=true -> the keep reuses the SERVICE's own datasource pool (url/hikari ignored,
              # dialect from the service's spring.datasource.url); false -> a dedicated keep pool from the url/hikari below.
              shared: ${DB_DATAKEEP_SHARED:false}
              url: ${DB_DATAKEEP_URL:jdbc:postgresql://${DB_PACMAN_HOST:localhost}:${DB_PACMAN_PORT:5432}/${DB_PACMAN_NAME:esq2025}}
              username: ${DB_DATAKEEP_USERNAME:${DB_PACMAN_USERNAME:esq2025}}
              password: ${DB_DATAKEEP_PASSWORD:${DB_PACMAN_PASSWORD:q}}
              hikari:
                maximum-pool-size: ${DB_DATAKEEP_POOL_SIZE:2}
esquire:
  audit-bus:
    messaging-bus:
      bus-id: ${AUDIT_BUS_ID:audit-b}
      slot-id: ${AUDIT_SLOT_ID:audit}
  entity-bus:
    messaging-bus:
      bus-id: ${ENTITY_BUS_ID:esquire.entity}
      slot-id: ${ENTITY_SLOT_ID:entity}
      x-rod:
        publisher-pool-size: ${ENTITY_BROADCAST_PUBLISHER_POOL_SIZE:0}
logging:
  level:
    root: ${LOG_LEVEL_ROOT:ERROR}
    org:
      springframework: ${LOG_LEVEL_SF:ERROR}
      springframework.jms: ${LOG_LEVEL_JMS:INFO}
      apache:
        activemq: ${LOG_LEVEL_AMQ:INFO}
    pro:
      mir0n: ${LOG_LEVEL_MIR0N:ERROR}
    develop: ${LOG_LEVEL_DEVELOP:DEBUG}
    msg: ${LOG_LEVEL_MSG:INFO}
  develop:
    log-path: ${DEVELOP_LOG_PATH:logs/pacMan-develop.log}
  msg:
    log-path: ${MSG_LOG_PATH:logs/pacMan-msg.log}

---
spring:
  config:
    activate:
      on-profile: dev-oracle
  datasource:
    url: jdbc:oracle:thin:@//${DB_PACMAN_HOST:localhost}:${DB_PACMAN_PORT:1521}/${DB_PACMAN_NAME:MIR0N}
    driverClassName: oracle.jdbc.OracleDriver
    username: ${DB_PACMAN_USERNAME:esq2025}
    password: ${DB_PACMAN_PASSWORD:q}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 20
      connection-timeout: 30000
      max-lifetime: 1800000
      idle-timeout: 600000
  jpa:
    mapping-resources:
      - META-INF/oracle-acct.xml
      - META-INF/oracle-acct-transaction.xml
      - META-INF/oracle-roles.xml
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
server:
  port: ${PACMAN_PORT:3000}

---
spring:
  config:
    activate:
      on-profile: dev-postgres
  datasource:
    url: jdbc:postgresql://${DB_PACMAN_HOST:localhost}:${DB_PACMAN_PORT:5432}/${DB_PACMAN_NAME:esq2025}
    username: ${DB_PACMAN_USERNAME:esq2025}
    password: ${DB_PACMAN_PASSWORD:q}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 20
      connection-timeout: 30000
      max-lifetime: 1800000
      idle-timeout: 600000
  jpa:
    mapping-resources:
      - META-INF/postgres-acct.xml
      - META-INF/postgres-acct-transaction.xml
      - META-INF/postgres-roles.xml
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
server:
  port: ${PACMAN_PORT:3000}
