esq:
  jwe:
    # When set, JweAwareJwtDecoder is wired and JwksController serves the public
    # key at GET /jwe-jwks so KC can fetch it to encrypt access tokens. Blank or
    # missing -> plain JWS decoder (v1.2.3 baseline). Compose mounts the keypair
    # via volume; ESQ_JWE_PRIVATE_KEY_PATH points at the in-container path.
    private-key-path: ${ESQ_JWE_PRIVATE_KEY_PATH:}
  gateway:
    token-relay:
      # Token Relay umbrella -- the gateway brokers/exchanges JWTs on behalf
      # of inbound clients and forwards a full JWT downstream. Two variants
      # share the same KC /token endpoint:
      #   - Vanilla Token Relay: client sends HTTP Basic; gateway runs
      #     client_credentials grant using the client's own credentials,
      #     caches per client_id.
      #   - Phantom Token Relay: client sends a stripped Bearer JWT; gateway
      #     runs RFC 8693 token-exchange authenticated as the dedicated
      #     esq-gw-exchange confidential client, caches per jti.
      # Both variants are dormant when their `clients` allowlist is empty.
      token-uri: ${ESQ_GW_TOKEN_URI:}
      vanilla:
        clients: ${ESQ_GW_VANILLA_CLIENTS:}
      phantom:
        clients:                ${ESQ_GW_PHANTOM_CLIENTS:}
        exchange-client-id:     ${ESQ_GW_EXCHANGE_CLIENT_ID:}
        exchange-client-secret: ${ESQ_GW_EXCHANGE_CLIENT_SECRET:}
    # Resilience knobs (gateway -> backend). All env-overridable; ResilienceConfig
    # reads the circuit-breaker block to build the Resilience4j CircuitBreaker +
    # TimeLimiter, and the Retry filters below reference the retry block. The
    # per-route timeout is the CircuitBreaker's TimeLimiter (NOT the Netty
    # response-timeout, which is a generous backstop above it) -- a backend call
    # exceeding the limit, or a tripped/open breaker, surfaces as an error that
    # GatewayErrorWebExceptionHandler renders as a 503/504 ProblemDetail.
    resilience:
      circuit-breaker:
        timeout-seconds:        ${GW_CB_TIMEOUT_S:10}      # default per-route call deadline
        slow-timeout-seconds:   ${GW_CB_SLOW_TIMEOUT_S:30} # move / acct / create routes
        sliding-window:         ${GW_CB_WINDOW:20}
        minimum-calls:          ${GW_CB_MIN_CALLS:10}
        failure-rate:           ${GW_CB_FAILURE_RATE:50}
        slow-call-rate:         ${GW_CB_SLOW_RATE:100}
        slow-call-seconds:      ${GW_CB_SLOW_DURATION_S:8}
        open-wait-seconds:      ${GW_CB_OPEN_WAIT_S:10}
        half-open-calls:        ${GW_CB_HALFOPEN_CALLS:5}
      retry:
        # Retry is configured PER ROUTE (per command), not by a shared method gate
        # -- the read/write split in Esquire is per command, and HTTP method is the
        # wrong axis (e.g. /esq-sweep is an idempotent POST). Each route below
        # carries its own Retry filter; only the attempt COUNT is shared here:
        #   - READ routes  retry on connect-failure + timeout (idempotent), GET.
        #   - WRITE routes retry on connect-failure ONLY -- exceptions:[ConnectException]
        #     with an empty series, so a response-timeout / 5xx / reset never resends
        #     a non-idempotent POST (the request provably never landed on a connect
        #     failure; anything later may have already committed).
        # To turn a route's retry off entirely, OMIT its Retry filter (SCG rejects
        # retries=0, so an absent filter is the true per-route off-switch).
        read:
          attempts:  ${GW_RETRY_READ:3}
        write:
          attempts: ${GW_RETRY_WRITE:1}
esquire:
  # Observability umbrella (v1.2.11 O1/O2) via common.ObservabilityConfig: ONE master switch gates BOTH
  # tracing and metrics -- a service never has one without the other. Off by default = zero cost; the
  # collector endpoint + sampling ratio are set per environment (compose / k8s).
  observability:
    enabled: ${ESQ_OBSERVABILITY_ENABLED:false}
  tracing:
    otlp-endpoint: ${ESQ_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
    sampling-ratio: ${ESQ_TRACING_SAMPLING_RATIO:1.0}
    marks-enabled: ${ESQ_TRACING_MARKS_ENABLED:true}
    excluded-paths: ${ESQ_TRACING_EXCLUDED_PATHS:/actuator}
    # opt-in RR liveness round-trip trace (TestRequest -> HeartBeat); off by default (heartbeats are frequent)
    msg-bus-alive-trace: ${ESQ_MSG_BUS_ALIVE_TRACE:false}
  gateway:
    service-metrics:
      enabled: ${GW_SERVICE_METRICS_ENABLED:false} # Control whether to collect metrics for the gateway on backend services
server:
  port: ${GATEWAY_PORT:8080} 
spring:
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC
  webflux:
    problemdetails:
      enabled: true
  application:
    name: "gateway"
  cloud:
    gateway:
       # Netty client timeouts -- connect fails fast if a pod is unreachable;
       # response-timeout is a generous BACKSTOP above the per-route CircuitBreaker
       # TimeLimiter (which is the real per-route deadline). Keep it > slow-timeout.
       httpclient:
         connect-timeout: ${GW_CONNECT_TIMEOUT_MS:2000}
         response-timeout: ${GW_RESPONSE_TIMEOUT:35s}
         # Backend connection pool. Pre-HA defaults ~ ReactorNetty (max-connections floor 16,
         # acquire-timeout 45s); HA raises max-connections in the local-k8s chart (R1).
         pool:
           max-connections: ${GW_POOL_MAX_CONNECTIONS:16}
           acquire-timeout: ${GW_POOL_ACQUIRE_TIMEOUT_MS:45000}
       #default-filters:
       #  - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST #RETAIN_UNIQUE
       # globalcors DISABLED — conflicts with custom SecurityWebFilterChain CORS
       # Spring Security handles CORS via spring.security.cors (see SecurityConfig.java)
       #globalcors:
       #  add-to-simple-url-handler-mapping: true
       #  cors-configurations:
       #    '[/**]':
       #      allowedOrigins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
       #      allowedHeaders: "*"
       #      allowedMethods: "*"
       routes:
        - id: keysmith-route
          uri: http://${KEYSMITH_HOST:biztree}:${KEYSMITH_PORT:3002}
          predicates:
            - Path=/esq-key
          metadata:
              allowedMethods:
                - GET
                - POST
          filters:
            # CircuitBreaker OUTER, Retry INNER: Retry re-runs the downstream call
            # (lands on a healthy pod via kube-proxy); when the breaker trips or opens
            # the error propagates to GatewayErrorWebExceptionHandler, which renders the
            # 503/504 ProblemDetail (no fallbackUri -- reuses the gateway error path).
            - name: CircuitBreaker
              args:
                name: keysmith-cb
            - name: Retry
              args:
                # READ: idempotent -- retry on connect-failure + timeout, NOT on 5xx
                # (a 5xx is usually a real error; the breaker handles overload).
                retries: ${esq.gateway.resilience.retry.read.attempts}
                methods: GET
                series: []
                exceptions:
                  - java.net.ConnectException
                  - java.util.concurrent.TimeoutException
                backoff:
                  firstBackoff: 50ms
                  maxBackoff: 500ms
                  factor: 2
                  basedOnPreviousValue: false
             #RETAIN_UNIQUE
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
            - RewritePath=/(?<segment>.*), /$\{segment}
            - TokenRelay=
        - id: biztree-route
          uri: http://${BIZTREE_HOST:biztree}:${BIZTREE_PORT:3002}
          predicates:
            - Path=/esq,/esq-path,/esq-enode,/esq-tree,/esq-sweep
          metadata:
              allowedMethods:
                - GET
                - POST
          filters:
            - name: CircuitBreaker
              args:
                name: biztree-cb
            - name: Retry
              args:
                # READ: idempotent -- retry on connect-failure + timeout, NOT on 5xx
                # (a 5xx is usually a real error; the breaker handles overload).
                retries: ${esq.gateway.resilience.retry.read.attempts}
                methods: GET
                series: []
                exceptions:
                  - java.net.ConnectException
                  - java.util.concurrent.TimeoutException
                backoff:
                  firstBackoff: 50ms
                  maxBackoff: 500ms
                  factor: 2
                  basedOnPreviousValue: false
             #RETAIN_UNIQUE
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
            - RewritePath=/(?<segment>.*), /$\{segment}
            - TokenRelay=
        - id: pacman-route
          uri: http://${PACMAN_HOST:enyman}:${PACMAN_PORT:3003}
          predicates:
            - Path=/esq-cmd
            - EntityKind=isAcct
          metadata:
            allowedMethods:
              - GET
              - POST
          filters:
            - name: CircuitBreaker
              args:
                name: pacman-cb
            - name: Retry
              args:
                # READ: idempotent -- retry on connect-failure + timeout, NOT on 5xx
                # (a 5xx is usually a real error; the breaker handles overload).
                retries: ${esq.gateway.resilience.retry.read.attempts}
                methods: GET
                series: []
                exceptions:
                  - java.net.ConnectException
                  - java.util.concurrent.TimeoutException
                backoff:
                  firstBackoff: 50ms
                  maxBackoff: 500ms
                  factor: 2
                  basedOnPreviousValue: false
            #RETAIN_UNIQUE
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
            - RewritePath=/(?<segment>.*), /$\{segment}
            - TokenRelay=
        - id: enyman-route
          uri: http://${ENYMAN_HOST:enyman}:${ENYMAN_PORT:3003}
          predicates:
            - Path=/esq-cmd,/esq-dict,/esq-kinds
          metadata:
            allowedMethods:
