# Prod overrides for k8s/charts/infra/keycloak
image:
  repository: ghcr.io/mir0n-pro/esquire-keycloak
  tag: "v1.2.3"
  pullPolicy: Always

service:
  type: ClusterIP            # ingress-nginx fronts KC; saves OCI LB quota

keycloak:
  mode: start                # production mode (was start-dev locally)
  hostname: esquire.mir0n.pro
  realm: esquire
  adminUsername: admin
  # adminPassword passed via --set
  clientId: esq-angular
  # v1.2.3: KC's own paths move to /kc-auth/* so the BFF can reserve /auth/*
  # for its own login/callback/logout/me endpoints on the same host.
  # Browser hits /kc-auth/realms/esquire/... only during the KC login redirect;
  # the BFF reaches KC server-to-server through the same public hostname
  # (see keycloak.issuer in values/backend.yaml) so the iss claim matches the
  # browser-visible URL.
  httpRelativePath: /kc-auth
  proxy: edge                # KC trusts X-Forwarded-* from ingress

storage:
  storageClass: oci-bv
  size: 10Gi

nodeSelector:
  tier: infra
