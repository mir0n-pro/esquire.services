apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-pacman-config
  labels:
    app: {{ .Release.Name }}-pacman
data:
  SPRING_PROFILES_ACTIVE:         {{ .Values.springProfilesActive | default "" | quote }}
  PACMAN_PORT:                    {{ .Values.service.port | quote }}
  ESQUIRE_TOPOLOGY_IMPORT:        {{ .Values.topologyImport | quote }}
  # --- datasource (password -> Secret, injected as env in the deployment) ---
  DB_PACMAN_VENDOR:               {{ .Values.db.vendor | quote }}
  DB_PACMAN_HOST:                 {{ .Values.db.host | quote }}
  DB_PACMAN_PORT:                 {{ .Values.db.port | quote }}
  DB_PACMAN_NAME:                 {{ .Values.db.name | quote }}
  DB_PACMAN_USERNAME:             {{ .Values.db.username | quote }}
  # --- entity-bus ref (PUBLISHER: broadcast entity changes) ---
  ENTITY_BUS_ID:                  {{ .Values.entity.busId | quote }}
  ENTITY_SERVICE_ID:              {{ .Values.entity.serviceId | quote }}
  ENTITY_BROADCAST_PUBLISHER_POOL_SIZE: {{ .Values.entity.broadcastPublisherPoolSize | quote }}
  # --- audit-bus ref + in-process (b) knobs ---
  ESQUIRE_AUDIT_BUS_ID:           {{ .Values.audit.busId | quote }}
  ESQUIRE_AUDIT_SERVICE_ID:       {{ .Values.audit.serviceId | quote }}
  ESQUIRE_AUDIT_POOL_SIZE:        {{ .Values.audit.poolSize | quote }}
  ESQUIRE_AUDIT_FEED_CAPACITY:    {{ .Values.audit.feedCapacity | quote }}
  ESQUIRE_AUDIT_VIRTUAL_THREADS:  {{ .Values.audit.virtualThreads | quote }}
  ESQUIRE_AUDIT_LOG_DB_VENDOR:    {{ .Values.audit.logDb.vendor | quote }}
  ESQUIRE_AUDIT_LOG_DB_URL:       {{ .Values.audit.logDb.url | quote }}
  ESQUIRE_AUDIT_LOG_DB_USERNAME:  {{ .Values.audit.logDb.username | quote }}
  ESQUIRE_AUDIT_LOG_DB_POOL_SIZE: {{ .Values.audit.logDb.poolSize | quote }}
  # ESQUIRE_AUDIT_LOG_DB_PASSWORD: chains from DB_PACMAN_PASSWORD (Secret) via application.yml
  # --- logging ---
  LOG_LEVEL_ROOT:                 {{ .Values.logging.levelRoot | quote }}
  LOG_LEVEL_SF:                   {{ .Values.logging.levelSf | quote }}
  LOG_LEVEL_MIR0N:                {{ .Values.logging.levelMir0n | quote }}
  LOG_LEVEL_DEVELOP:              {{ .Values.logging.levelDevelop | quote }}
  LOG_LEVEL_MSG:                  {{ .Values.logging.levelMsg | quote }}
  LOG_LEVEL_AMQ:                  {{ .Values.logging.levelAmq | quote }}
  LOG_LEVEL_JMS:                  {{ .Values.logging.levelJms | quote }}
  DEVELOP_LOG_PATH:               {{ .Values.logging.developLogPath | quote }}
  MSG_LOG_PATH:                   {{ .Values.logging.msgLogPath | quote }}
