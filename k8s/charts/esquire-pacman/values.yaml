image:
  repository: esquire.pacman
  tag: latest
  pullPolicy: IfNotPresent

springProfilesActive: "console,dev-postgres"

service:
  port: 3003

db:
  vendor: dev-postgres
  host: esquire-infra-postgres
  port: 5432
  name: esq2025
  username: esq2025
  password: q

messaging:
  brokerUrl: tcp://esquire-infra-amq-activemq:61616
  clientId: pacman

logging:
  levelRoot: ERROR
  levelSf: ERROR
  levelMir0n: DEBUG
  levelDevelop: DEBUG
  levelMsg: DEBUG
  developLogPath: /tmp/pacMan-develop.log
  msgLogPath: /tmp/pacMan-msg.log

# Default deploy topology = option (c): publish to the bus (ActiveMQ), esquire-xxrod drains to *_log.
# (b) in-process: mode=in-process | (d) redis: mode=redis, redisHost=esq-redis | (c)/kafka: busTransport=kafka.
audit:
  enabled: true
  mode: bus
  busTransport: activemq
  publisherPoolSize: 4
  redisHost: ""
  kafkaBootstrap: esquire-infra-kafka:9092
