spring:
  profiles:
    active: ${DB_ENYMAN_VENDOR:dev-postgres}
  application:
    name: enyman
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  mvc:
    problemdetails:
      enabled: true
  config:
    import: "${ESQUIRE_TOPOLOGY_IMPORT:file:/etc/esquire/topology.yml}"
enyman:
  move-queue:
    capacity: ${ENYMAN_MOVE_QUEUE_CAPACITY:16384}
    validate-create-during-move: ${ENYMAN_VALIDATE_CREATE_DURING_MOVE:true}
# Bus TOPOLOGY (which buses exist + their transport) is the shared esquire-topology.yml imported above.
# Here: this service's bus REFS (which slot it joins) + per-service knob OVERRIDES (env-driven), and the
# service-LOCAL audit (b) in-process leg whose log-db is service-specific (extends the shared catalog).
esquire:
  enyman-messaging-bus:
    - bus-id: audit-b
      slot:
        - slot-id: audit
          x-rod:
            rod-class: pro.mir0n.esquire.common.audit.XRodLogDb
            pool-size: ${ESQUIRE_AUDIT_POOL_SIZE:4}
            feed-capacity: ${ESQUIRE_AUDIT_FEED_CAPACITY:4096}
            virtual-threads: ${ESQUIRE_AUDIT_VIRTUAL_THREADS:false}
            log-db:
              vendor: ${ESQUIRE_AUDIT_LOG_DB_VENDOR:dev-postgres}
              url: ${ESQUIRE_AUDIT_LOG_DB_URL:jdbc:postgresql://${DB_ENYMAN_HOST:localhost}:${DB_ENYMAN_PORT:5432}/${DB_ENYMAN_NAME:esq2025}}
              username: ${ESQUIRE_AUDIT_LOG_DB_USERNAME:${DB_ENYMAN_USERNAME:esq2025}}
              password: ${ESQUIRE_AUDIT_LOG_DB_PASSWORD:${DB_ENYMAN_PASSWORD:q}}
              pool-size: ${ESQUIRE_AUDIT_LOG_DB_POOL_SIZE:2}
  audit-bus:
    messaging-bus:
      bus-id: ${ESQUIRE_AUDIT_BUS_ID:audit-b}
      slot-id: ${ESQUIRE_AUDIT_SERVICE_ID:audit}
  kc-bus:
    messaging-bus:
      bus-id: ${KC_BUS_ID:esquire.kc}
      slot-id: ${KC_SERVICE_ID:kc}
      x-rod:
        pool-size: ${ENYMAN_KC_RESPONSE_POOL_SIZE:2}
        concurrency: ${ENYMAN_KC_RESPONSE_CONCURRENCY:1}
        publisher-pool-size: ${ENYMAN_KC_PUBLISHER_POOL_SIZE:0}
  entity-bus:
    messaging-bus:
      bus-id: ${ENTITY_BUS_ID:esquire.entity}
      slot-id: ${ENTITY_SERVICE_ID:entity}
      x-rod:
        publisher-pool-size: ${ENTITY_BROADCAST_PUBLISHER_POOL_SIZE:0}
logging:
  level:
    root: ${LOG_LEVEL_ROOT:ERROR}
    org:
      springframework: ${LOG_LEVEL_SF:ERROR}
      springframework.jms: ${LOG_LEVEL_JMS:INFO}
      apache:
        activemq: ${LOG_LEVEL_AMQ:INFO}
    pro:
      mir0n: ${LOG_LEVEL_MIR0N:INFO}
    develop: ${LOG_LEVEL_DEVELOP:DEBUG}
    msg: ${LOG_LEVEL_MSG:INFO}
  develop:
    log-path: ${DEVELOP_LOG_PATH:logs/enyMan-develop.log}
  msg:
    log-path: ${MSG_LOG_PATH:logs/enyMan-msg.log}

---
spring:
  config:
    activate:
      on-profile: dev-oracle
  datasource:
    url: jdbc:oracle:thin:@//${DB_ENYMAN_HOST:localhost}:${DB_ENYMAN_PORT:1521}/${DB_ENYMAN_NAME:MIR0N}
    driverClassName: oracle.jdbc.OracleDriver
    username: ${DB_ENYMAN_USERNAME:esq2025}
    password: ${DB_ENYMAN_PASSWORD:q}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 20
      connection-timeout: 30000
      max-lifetime: 1800000
      idle-timeout: 600000
  jpa:
    mapping-resources:
      - META-INF/oracle-dictionary.xml
      - META-INF/oracle-entity.xml
      - META-INF/oracle-custom-field.xml
      - META-INF/oracle-acct.xml
      - META-INF/oracle-roles.xml
      - META-INF/audit/oracle-par.xml
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
server:
  port: ${ENYMAN_PORT:3000}

---
spring:
  config:
    activate:
      on-profile: dev-postgres
  datasource:
    url: jdbc:postgresql://${DB_ENYMAN_HOST:localhost}:${DB_ENYMAN_PORT:5432}/${DB_ENYMAN_NAME:esq2025}
    username: ${DB_ENYMAN_USERNAME:esq2025}
    password: ${DB_ENYMAN_PASSWORD:q}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 20
      connection-timeout: 30000
      max-lifetime: 1800000
      idle-timeout: 600000
  jpa:
    mapping-resources:
      - META-INF/postgres-dictionary.xml
      - META-INF/postgres-entity.xml
      - META-INF/postgres-custom-field.xml
      - META-INF/postgres-acct.xml
      - META-INF/postgres-roles.xml
      - META-INF/audit/postgres-par.xml
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
server:
  port: ${ENYMAN_PORT:3000}
