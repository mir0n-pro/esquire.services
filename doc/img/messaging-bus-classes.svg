  <rect x="20" y="44" width="270" height="26" rx="9" fill="#4D6A8D"/>
  <text x="155" y="62" text-anchor="middle" font-weight="600" fill="#ffffff">messaging.xrod &#8212; frontend &amp; pods</text>

  <rect x="32" y="80"  width="246" height="28" rx="6" fill="#eef2f7" stroke="#4D6A8D" stroke-width="1.3"/><text x="155" y="98"  text-anchor="middle" font-weight="600" fill="#1f2a36">XRodManager</text>
  <rect x="32" y="116" width="246" height="28" rx="6" fill="#eef2f7" stroke="#4D6A8D" stroke-width="1.3"/><text x="155" y="134" text-anchor="middle" fill="#1f2a36">IXRod  (pod SPI)</text>
  <rect x="32" y="152" width="246" height="28" rx="6" fill="#e7edf4" stroke="#4D6A8D" stroke-width="1.3"/><text x="155" y="165" text-anchor="middle" font-size="10.5" fill="#1f2a36">XRod &#183; XRodRR &#183; XRodInfo &#183; XRodDisabled</text><text x="155" y="177" text-anchor="middle" font-size="10.5" fill="#1f2a36">&#183; XRodInProcess</text>
  <rect x="32" y="188" width="246" height="28" rx="6" fill="#eef2f7" stroke="#4D6A8D" stroke-width="1.3"/><text x="155" y="206" text-anchor="middle" fill="#1f2a36">XRods  (rod-class resolver)</text>
  <rect x="32" y="224" width="246" height="28" rx="6" fill="#eef2f7" stroke="#4D6A8D" stroke-width="1.3"/><text x="155" y="242" text-anchor="middle" fill="#1f2a36">RodEvent &#183; RodEventCodec</text>
  <rect x="32" y="260" width="246" height="28" rx="6" fill="#eef2f7" stroke="#4D6A8D" stroke-width="1.3"/><text x="155" y="278" text-anchor="middle" fill="#1f2a36">RodTransportAdapter</text>
  <rect x="32" y="296" width="246" height="28" rx="6" fill="#eef2f7" stroke="#4D6A8D" stroke-width="1.3"/><text x="155" y="314" text-anchor="middle" font-size="11" fill="#1f2a36">RodEventRepoRegistry  (optional)</text>

