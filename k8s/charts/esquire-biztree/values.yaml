image:
  repository: esquire.biztree
  tag: latest
  pullPolicy: IfNotPresent

# HA scheduling (pre-HA defaults: no node pinning, no spread). The OKE overlay sets
# nodeSelector.tier=app and turns topologySpread on to place the x2 replicas on
# distinct app-tier nodes; local (single node) leaves both off.
nodeSelector: {}
topologySpread:
  enabled: false

# console profile = logback config; dev-postgres = JDBC datasource + named queries;
# cache-h2 = biztree-specific local cache. OKE values override this.
springProfilesActive: "console,dev-postgres,cache-h2"

# shared bus topology is delivered by the esquire-topology ConfigMap, mounted at /etc/esquire.
topologyImport: optional:file:/etc/esquire/topology.yml

# v1.2.10 VT (UNVALIDATED test lever, default OFF -- see HA doc 5.5)
esqVirtualThreads: "false"        # ESQ_VIRTUAL_THREADS (spring.threads.virtual.enabled, request path)

service:
  port: 3002

db:
  vendor: dev-postgres
  host: esquire-infra-postgres
  port: 5432
  name: esq2025
  username: esq2025
  password: q

# R1-R5 resilience knobs (timeout ladder / pool sizing / fail-fast DB). Defaults
# here are the pre-HA "no HA" behavior we ran before HA work (large / disabled), so a
# plain `helm install` of this chart behaves exactly as before. The tuned local-k8s
# budget lives in k8s/values/biztree.yaml; OKE keeps these pre-HA defaults.
# NOTE: these size the POSTGRES pool. The H2 cache pool is the separate h2.* block below.
resilience:
  txTimeoutSeconds: "-1"          # R1 spring.transaction.default-timeout (-1 = inherit, no cap)
  tomcatMaxThreads: "200"         # R2 server.tomcat.threads.max (Boot default)
  tomcatAcceptCount: "100"        # R2 server.tomcat.accept-count (Boot default)
  dbPoolMax: "20"                 # R3 Hikari maximum-pool-size
  dbPoolMinIdle: "20"             # R3 Hikari minimum-idle
  dbConnectTimeoutMs: "30000"     # R3 Hikari connection-timeout (Hikari default)
  dbSocketTimeoutSeconds: "0"     # R5 pgjdbc socketTimeout (0 = none)
  dbTcpKeepAlive: "false"         # R5 pgjdbc tcpKeepAlive

# H2 local cache: the Taijitu two-monad store (in-mem, kept alive for the JVM lifetime).
h2:
  vendor: cache-h2
  url: "jdbc:h2:mem:biztree;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE"
  poolMax: "10"
  poolMinIdle: "10"
  poolConnTimeout: "5000"
  poolIdleTimeout: "600000"
  poolMaxLifetime: "1800000"

# entity-bus ref: biztree is the CONSUMER (drains the entity broadcast into its cache).
entity:
  busId: esquire.entity
  slotId: entity
  broadcastPoolSize: "4"
  broadcastConcurrency: "1"
  poolMode: "platform"            # ENTITY_BROADCAST_POOL_MODE (platform | virtual | virtual-per-task, default platform)

# v1.2.5 Taijitu two-monad cache + night-watch sweep (mirrors the compose biztree env)
#   director:   legacy (single-pass) | taijitu (two-monad + anti-entropy night-watch)
#   onMismatch: LOG (detect + keep serving -- conservative) | SWAP (promote the fresh shadow --
#               self-heal) | TERMINATE (exit; k8s relaunches from a clean load)
#   sweepIntervalMs: delay between sweeps; sweepTimeoutMs: per-leg CHECKSUM deadline
#   queueCapacity: monad apply-queue depth; bulkThreshold: queued-event count that flips to bulk apply
taijitu:
  director: taijitu
  onMismatch: SWAP
  sweepIntervalMs: "600000"
  sweepTimeoutMs: "10000"
  queueCapacity: "4096"
  bulkThreshold: "10"

logging:
  levelRoot: ERROR
  levelSf: ERROR
  levelMir0n: DEBUG
  levelDevelop: DEBUG
  levelMsg: DEBUG
  levelAmq: INFO
  levelJms: INFO
  developLogPath: /tmp/bizTree-develop.log
  msgLogPath: /tmp/bizTree-msg.log

# v1.2.11 O2 distributed tracing (opt-in; the o11y stack + o11y-on.bat enable it). OFF by default.
observability:
  # ONE master switch: tracing + metrics together (v1.2.11 O1/O2). Off by default.
  enabled: "false"
  # Percentile buckets for the extra latency timers (O1/T5-B). Off = count/sum/max only.
  metricsHistograms: "false"
  # HTTP byte counters (O1/T5-C). Cheap, so ON by default. One knob for BOTH embedded servers.
  metricsBandwidth: "true"
tracing:
  otlpEndpoint: http://esquire-infra-otel-collector:4318/v1/traces
  samplingRatio: "1.0"
  marksEnabled: "true"
  excludedPaths: "/actuator"
