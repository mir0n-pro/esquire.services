apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-aukeep
  labels:
    app: {{ .Release.Name }}-aukeep
spec:
  # auKeep is a competing-consumer on a queue; replicaCount>1 = horizontal redundancy (separate sprint).
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-aukeep
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-aukeep
    spec:
      containers:
        - name: aukeep
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # dataKeep's Dockerfile has no ENTRYPOINT (compose supplies the command); the temurin base
          # entrypoint execs these args.
          args: ["java", "-jar", "app.jar"]
          ports:
            - containerPort: {{ .Values.service.port }}
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-aukeep-config
          env:
            - name: DB_DATAKEEP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-aukeep-secret
                  key: db-password
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.service.port }}
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.service.port }}
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          volumeMounts:
            - name: esquire-topology
              mountPath: /etc/esquire
              readOnly: true
      volumes:
        - name: esquire-topology
          configMap:
            name: esquire-topology
