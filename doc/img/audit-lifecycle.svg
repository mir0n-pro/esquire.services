<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 300" width="580" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 z" fill="#5b5b5b"/>
    </marker>
  </defs>

  <!-- post (buffer) -->
  <rect x="80" y="14" width="420" height="64" rx="8" fill="#eef2f7" stroke="#7b8aa0"/>
  <text x="290" y="36" text-anchor="middle" font-weight="bold">post(e) &#8230; post(e)</text>
  <text x="290" y="54" text-anchor="middle" fill="#555">buffered in the tx (any thread), keyed by (entity_id, kind, sub_id)</text>
  <text x="290" y="70" text-anchor="middle" fill="#555">&#8212; LAST-SNAPSHOT-WINS</text>

  <!-- commit -->
  <rect x="80" y="124" width="420" height="52" rx="8" fill="#dde9f6" stroke="#3f6ea5" stroke-width="1.5"/>
  <text x="290" y="146" text-anchor="middle" font-weight="bold" fill="#274b73">entity tx commits</text>
  <text x="290" y="164" text-anchor="middle" fill="#4a5568">stamp ONE commit-time actionTime for the batch</text>

  <!-- flush -->
  <rect x="80" y="222" width="420" height="64" rx="8" fill="#edf7ee" stroke="#5a9a5a"/>
  <text x="290" y="246" text-anchor="middle" font-weight="bold">afterCommit &#8594; flush(batch)</text>
  <text x="290" y="264" text-anchor="middle" fill="#555">OUT of the entity tx</text>
  <text x="290" y="280" text-anchor="middle" fill="#555">(b): own JDBC tx &#8594; log DB</text>

  <line x1="290" y1="78"  x2="290" y2="122" stroke="#5b5b5b" marker-end="url(#ar)"/>
  <line x1="290" y1="176" x2="290" y2="220" stroke="#5b5b5b" marker-end="url(#ar)"/>
</svg>
