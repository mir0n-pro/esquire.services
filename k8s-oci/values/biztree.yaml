# Prod overrides for k8s/charts/esquire-biztree
image:
  repository: ghcr.io/mir0n-pro/esquire.biztree
  # tag injected by oke-up.bat (--set image.tag=%image_tag%) -- single release tag for the whole stack.
  pullPolicy: Always

# Activates 'console' profile in logback-spring.xml; develop/msg loggers go to stdout
springProfilesActive: console,dev-postgres,cache-h2

# db.password passed via --set
db:
  vendor: dev-postgres
  host: esquire-infra-postgres
  port: 5432
  name: esq2025
  username: esq2025

# Console-only logging in prod (LOG_OUTPUT=console requires logback support)
logging:
  levelRoot: ERROR
  levelSf: WARN
  levelMir0n: ERROR
  levelDevelop: "OFF"
  levelMsg: "OFF"

nodeSelector:
  tier: app

# v1.2.10 HA (OKE Always-Free): x2 replicas, best-effort spread across the 3 app-tier nodes.
replicaCount: 2
topologySpread:
  enabled: true

# Memory-bounded for the 1 OCPU / 6 GB app nodes (~4.75 GiB alloc; ~4-5 pods/node). CPU
# request trimmed from the local 250m so the x2 fleet fits the ~2.5 vCPU app tier.
resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: 750m
    memory: 768Mi

# R1-R5 resilience budget promoted from the local-k8s overlay. bizTree serves reads from
# its in-JVM H2 cache, so its POSTGRES pool is the smallest of the fleet (5). Consumer of
# the entity broadcast -- no producer send-retry.
resilience:
  tomcatMaxThreads: "25"          # R2
  tomcatAcceptCount: "50"         # R2
  dbPoolMax: "5"                  # R3 (smaller -- cache-served reads)
  dbPoolMinIdle: "2"              # R3
  dbConnectTimeoutMs: "5000"      # R3 fail-fast on pool acquire
  dbSocketTimeoutSeconds: "35"    # R5
  dbTcpKeepAlive: "true"          # R5
