name: esq-omnibus
services:
  postgres:
    container_name: esq-postgres
    build:
      context: ../..
      dockerfile: services/postgres/Dockerfile
    image: esquire-postgres:17
    restart: on-failure
    environment:
      POSTGRES_USER: esq2025
      POSTGRES_PASSWORD: q
      POSTGRES_DB: esq2025
    ports:
      - "5433:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./logs:/var/log/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U esq2025 -d esq2025"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - esquirenet

  activemq:
    container_name: esq-activemq
    build:
      context: ../activemq
      dockerfile: Dockerfile
    image: esquire-activemq:6.1.4
    ports:
      - "61616:61616"   # JMS/OpenWire broker port
      - "8161:8161"     # ActiveMQ web console (admin/admin)
    volumes:
      - ./data/activemq:/var/opt/activemq/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/61616' 2>/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - esquirenet

  # x-Rod audit option (d): the Redis Stream sink. Producers in audit mode=redis XADD here; the stream is
  # the append-only audit log (read with XRANGE). maxmemory bounded + noeviction (never drop audit data).
  redis:
    container_name: esq-redis
    image: redis:8
    command: ["redis-server", "--maxmemory", "384mb", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - esquirenet

  # RedisInsight -- web GUI for the (d) audit Redis Stream. Dev-only tool, gated behind the "tools" profile
  # so it does NOT start with the default stack. Start it explicitly:
  #   docker compose up -d redisinsight        (or: docker compose --profile tools up -d)
  # Then open http://localhost:5540 ; the audit db is pre-added (host=redis, port=6379) via RI_REDIS_*.
  redisinsight:
    container_name: esq-redisinsight
    image: redis/redisinsight:latest
    profiles: ["tools"]
    ports:
      - "5540:5540"
    environment:
      - RI_REDIS_HOST=redis
      - RI_REDIS_PORT=6379
      - RI_REDIS_ALIAS=esq-audit
    depends_on:
      - redis
    networks:
      - esquirenet

  keycloak:
    container_name: esq-keycloak
    build:
      context: ../keycloak
      dockerfile: Dockerfile.keycloak
    image: esquire-keycloak:26.4.7
    # Run as root inside the container -- compose-only workaround for
    # Windows + Docker Desktop bind-mount permissions: KC's default uid 1000
    # can't write to ./data/keycloak when it comes back as root-owned after
    # rmdir/recreate. The OKE chart sets securityContext.fsGroup: 1000
    # properly; this user override does NOT propagate to k8s/OKE.
    user: "0:0"
    command: start-dev --import-realm
    ports:
      - "8081:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: q
      # localhost works from the host browser AND from inside compose containers
      # because the BFF (and any other container that needs to reach KC) maps
      # "localhost" -> host-gateway via extra_hosts. KC publishes its discovery
      # URLs and "iss" claim with this hostname:port pair; both sides resolve
      # to the same KC instance.
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8081
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_BACKCHANNEL: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /kc-auth
      # Phantom Token Relay: RFC 8693 token-exchange (KC 26.4 preview).
      # admin-fine-grained-authz is enabled by default in KC 26 -- no flag needed.
      KC_FEATURES: token-exchange
    volumes:
      - ./data/keycloak:/opt/keycloak/data
      - ../keycloak/import/esquire.json:/opt/keycloak/data/import/realm.json
    healthcheck:
      # KC 26.4.7 management interface on :9000 returns 404 for /health/ready; TCP probe on :8080 sidesteps it.
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8080' 2>/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - esquirenet

  biztree:
    container_name: esq-biztree
    build:
      context: .
    image: esquire.biztree
    ports:
      - "3002:3002"
    environment:
      - BIZTREE_PORT=3002
      - LOG_LEVEL_ROOT=ERROR
      - LOG_LEVEL_SF=ERROR
      - LOG_LEVEL_MIR0N=DEBUG
      - LOG_LEVEL_DEVELOP=DEBUG
      - LOG_LEVEL_MSG=DEBUG
      - DEVELOP_LOG_PATH=logs/bizTree-develop.log
      - MSG_LOG_PATH=logs/bizTree-msg.log
      - DB_BIZTREE_VENDOR=dev-postgres
      - DB_BIZTREE_PORT=5432
      - DB_BIZTREE_NAME=esq2025
      #- DB_BIZTREE_VENDOR=dev-oracle
      #- DB_BIZTREE_PORT=1521
      #- DB_BIZTREE_NAME=MIR0N
      - DB_BIZTREE_HOST=postgres
      - DB_BIZTREE_USERNAME=esq2025
      - DB_BIZTREE_PASSWORD=q
      # Messaging
      - AMQ_BROKER_URL=tcp://activemq:61616
      #- AMQ_USER=
      #- AMQ_PASSWORD=
      - BIZTREE_MESSAGING_CONSUMER_ENABLED=true
      # v1.2.5 Taijitu refactor: select the cache director impl
      #   legacy (default) | taijitu (two-monad + night-watch)
      - BIZTREE_DIRECTOR=taijitu
      # night-watch checksum-mismatch reaction: LOG | SWAP | TERMINATE
      # (fed by host BIZTREE_ON_MISMATCH so a hauberk cmd can recreate biztree per test)
      - BIZTREE_TAIJITU_ON_MISMATCH=${BIZTREE_ON_MISMATCH:-SWAP}
      # night-watch sweep interval ms (host BIZTREE_SWEEP_INTERVAL_MS; a test sets it high so the
      # periodic sweep doesn't auto-heal before the sim observes the miss + forces a sweep)
      - BIZTREE_TAIJITU_SWEEP_INTERVAL_MS=${BIZTREE_SWEEP_INTERVAL_MS:-600000}
      # night-watch per-leg CHECKSUM deadline ms (host BIZTREE_SWEEP_TIMEOUT_MS)
      - BIZTREE_TAIJITU_SWEEP_TIMEOUT_MS=${BIZTREE_SWEEP_TIMEOUT_MS:-10000}
      # per-monad event queue depth (back-pressure boundary)
      - BIZTREE_MONAD_QUEUE_CAPACITY=${BIZTREE_QUEUE_CAPACITY:-4096}
      # backlog size above which the monad worker batches events into one cache tx (default 10).
      # Set very high (e.g. 999999999) to force one-by-one processing for an A/B perf comparison.
      - BIZTREE_QUEUE_BULK_THRESHOLD=${BIZTREE_QUEUE_BULK_THRESHOLD:-10}
    command: ["java", "-jar", "app.jar"]
    depends_on:
      postgres:
        condition: service_healthy
      activemq:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    networks:
      - esquirenet

  enyman:
    container_name: esq-enyman
    build:
      context: .
    image: esquire.enyman
    ports:
      - "3003:3003"
    environment:
      - ENYMAN_PORT=3003
      - LOG_LEVEL_ROOT=ERROR
      - LOG_LEVEL_SF=ERROR
      - LOG_LEVEL_MIR0N=DEBUG
      - LOG_LEVEL_DEVELOP=DEBUG
      - LOG_LEVEL_MSG=INFO
      - DEVELOP_LOG_PATH=logs/enyMan-develop.log
      - MSG_LOG_PATH=logs/enyMan-msg.log
      - DB_ENYMAN_VENDOR=dev-postgres
      - DB_ENYMAN_PORT=5432
      - DB_ENYMAN_NAME=esq2025
      #- DB_ENYMAN_VENDOR=dev-oracle
      #- DB_ENYMAN_PORT=1521
      #- DB_ENYMAN_NAME=MIR0N
      - DB_ENYMAN_HOST=postgres
      - DB_ENYMAN_USERNAME=esq2025
      - DB_ENYMAN_PASSWORD=q
      # Messaging
      - AMQ_BROKER_URL=tcp://activemq:61616
      #- AMQ_USER=
      #- AMQ_PASSWORD=
      - ENYMAN_SERVICE_ID=entity-update-broadcast
      - ENYMAN_CTRL_ID=enyman.default
      - ENYMAN_MESSAGING_CLIENT_ID=enyman
      #- ENYMAN_MESSAGING_CONSUMER_ENABLED=false
      # v1.2.6 Goal 3: move queue capacity. Default 16384 (also the application.yml fallback)
      # is sized for normal load. Stress tests can override via ENYMAN_MOVE_QUEUE_CAPACITY.
      - ENYMAN_MOVE_QUEUE_CAPACITY=${ENYMAN_MOVE_QUEUE_CAPACITY:-16384}
      # v1.2.6 Goal 3 toggle. true = race-8b fixed (CREATE-during-move reconciliation runs);
      # false = race reproduces (used by the race-move-create sim's negative pass).
      - ENYMAN_VALIDATE_CREATE_DURING_MOVE=${ENYMAN_VALIDATE_CREATE_DURING_MOVE:-true}
      # v1.2.7 audit logging (x-rod). Framework default is OFF (option-0); the demo turns it ON here.
      - ENYMAN_AUDIT_ENABLED=${ENYMAN_AUDIT_ENABLED:-true}
      # option (c): bus = publish to the audit queue (the xxRod service writes the *_log); in-process = (b).
      - ENYMAN_AUDIT_MODE=${ENYMAN_AUDIT_MODE:-bus}
      - ENYMAN_AUDIT_POOL_SIZE=${ENYMAN_AUDIT_POOL_SIZE:-4}
      - ENYMAN_AUDIT_VIRTUAL_THREADS=${ENYMAN_AUDIT_VIRTUAL_THREADS:-false}
      - ENYMAN_AUDIT_FEED_CAPACITY=${ENYMAN_AUDIT_FEED_CAPACITY:-4096}
      # (c) bus publisher pool: 0 = single feed-worker synchronous publish; N>0 = N async publisher threads.
      - ENYMAN_AUDIT_PUBLISHER_POOL_SIZE=${ENYMAN_AUDIT_PUBLISHER_POOL_SIZE:-0}
      # (d) redis (set ENYMAN_AUDIT_MODE=redis): XADD each event to a Redis Stream (the stream IS the audit
      # log; no consumer service). Lettuce connects lazily, so redis is ignored unless mode=redis.
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - ENYMAN_AUDIT_REDIS_STREAM=${ENYMAN_AUDIT_REDIS_STREAM:-}
      - ENYMAN_AUDIT_REDIS_MAX_LEN=${ENYMAN_AUDIT_REDIS_MAX_LEN:-0}
      # (b) log datastore: shared (reuse service DB) | dedicated (separate pool/vendor via ENYMAN_AUDIT_DB_*).
      - ENYMAN_AUDIT_LOG_DATASTORE=${ENYMAN_AUDIT_LOG_DATASTORE:-shared}
      # dedicated-only: the log DB may be a DIFFERENT vendor than the business DB.
      # e.g. business on local postgres, audit log on the dockerized postgres :5433 (same vendor):
      #   ENYMAN_AUDIT_LOG_DATASTORE=dedicated  ENYMAN_AUDIT_DB_VENDOR=dev-postgres
      #   ENYMAN_AUDIT_DB_URL=jdbc:postgresql://host.docker.internal:5433/esq2025
      - ENYMAN_AUDIT_DB_VENDOR=${ENYMAN_AUDIT_DB_VENDOR:-dev-postgres}
      - ENYMAN_AUDIT_DB_URL=${ENYMAN_AUDIT_DB_URL:-}
      - ENYMAN_AUDIT_DB_USERNAME=${ENYMAN_AUDIT_DB_USERNAME:-esq2025}
      - ENYMAN_AUDIT_DB_PASSWORD=${ENYMAN_AUDIT_DB_PASSWORD:-q}
      - ENYMAN_AUDIT_DB_POOL_SIZE=${ENYMAN_AUDIT_DB_POOL_SIZE:-8}
    command: ["java", "-jar", "app.jar"]
    depends_on:
      postgres:
        condition: service_healthy
      activemq:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    networks:
      - esquirenet

  pacman:
    container_name: esq-pacman
    build:
      context: .
    image: esquire.pacman
    ports:
      - "3004:3004"
    environment:
      - PACMAN_PORT=3004
      - LOG_LEVEL_ROOT=ERROR
      - LOG_LEVEL_SF=ERROR
      - LOG_LEVEL_MIR0N=DEBUG
      - LOG_LEVEL_DEVELOP=DEBUG
      - LOG_LEVEL_MSG=INFO
      - DEVELOP_LOG_PATH=logs/pacMan-develop.log
      - MSG_LOG_PATH=logs/pacMan-msg.log
      - DB_PACMAN_VENDOR=dev-postgres
      - DB_PACMAN_PORT=5432
      - DB_PACMAN_NAME=esq2025
      #- DB_PACMAN_VENDOR=dev-oracle
      #- DB_PACMAN_PORT=1521
      #- DB_PACMAN_NAME=MIR0N
      - DB_PACMAN_HOST=postgres
      - DB_PACMAN_USERNAME=esq2025
      - DB_PACMAN_PASSWORD=q
      # Messaging
      - AMQ_BROKER_URL=tcp://activemq:61616
      #- AMQ_USER=
      #- AMQ_PASSWORD=
      - PACMAN_SERVICE_ID=entity-update-broadcast
      - PACMAN_CTRL_ID=pacman.default
      - PACMAN_MESSAGING_CLIENT_ID=pacman
      # v1.2.7 audit logging (x-rod). pacMan owns account UPDATE / DELETE / balance -> esq_account_log.
      # Framework default is OFF (option-0); the demo turns it ON here.
      - PACMAN_AUDIT_ENABLED=${PACMAN_AUDIT_ENABLED:-true}
      # option (c): bus = publish to the audit queue (the xxRod service writes the *_log); in-process = (b).
      - PACMAN_AUDIT_MODE=${PACMAN_AUDIT_MODE:-bus}
      - PACMAN_AUDIT_POOL_SIZE=${PACMAN_AUDIT_POOL_SIZE:-4}
      - PACMAN_AUDIT_VIRTUAL_THREADS=${PACMAN_AUDIT_VIRTUAL_THREADS:-false}
      - PACMAN_AUDIT_FEED_CAPACITY=${PACMAN_AUDIT_FEED_CAPACITY:-4096}
      # (c) bus publisher pool: 0 = single feed-worker synchronous publish; N>0 = N async publisher threads.
      - PACMAN_AUDIT_PUBLISHER_POOL_SIZE=${PACMAN_AUDIT_PUBLISHER_POOL_SIZE:-0}
      # (d) redis (set PACMAN_AUDIT_MODE=redis): XADD each event to a Redis Stream. Lazy connect -> ignored unless mode=redis.
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - PACMAN_AUDIT_REDIS_STREAM=${PACMAN_AUDIT_REDIS_STREAM:-}
      - PACMAN_AUDIT_REDIS_MAX_LEN=${PACMAN_AUDIT_REDIS_MAX_LEN:-0}
      # (b) log datastore: shared (reuse service DB) | dedicated (separate pool/vendor via PACMAN_AUDIT_DB_*).
      - PACMAN_AUDIT_LOG_DATASTORE=${PACMAN_AUDIT_LOG_DATASTORE:-shared}
      # dedicated-only: the log DB may be a DIFFERENT vendor than the business DB.
      - PACMAN_AUDIT_DB_VENDOR=${PACMAN_AUDIT_DB_VENDOR:-dev-postgres}
      - PACMAN_AUDIT_DB_URL=${PACMAN_AUDIT_DB_URL:-}
      - PACMAN_AUDIT_DB_USERNAME=${PACMAN_AUDIT_DB_USERNAME:-esq2025}
      - PACMAN_AUDIT_DB_PASSWORD=${PACMAN_AUDIT_DB_PASSWORD:-q}
      - PACMAN_AUDIT_DB_POOL_SIZE=${PACMAN_AUDIT_DB_POOL_SIZE:-8}
    command: ["java", "-jar", "app.jar"]
    depends_on:
      postgres:
        condition: service_healthy
      activemq:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    networks:
      - esquirenet

  xxrod:
    container_name: esq-xxrod
    build:
      context: .
    image: esquire.xxrod
    ports:
      - "3007:3007"
    environment:
      - XXROD_PORT=3007
      - LOG_LEVEL_ROOT=ERROR
      - LOG_LEVEL_SF=ERROR
      - LOG_LEVEL_MIR0N=DEBUG
      - LOG_LEVEL_DEVELOP=DEBUG
      - LOG_LEVEL_MSG=INFO
      - DEVELOP_LOG_PATH=logs/xxRod-develop.log
      - MSG_LOG_PATH=logs/xxRod-msg.log
      - DB_XXROD_VENDOR=dev-postgres
      - DB_XXROD_PORT=5432
      - DB_XXROD_NAME=esq2025
      - DB_XXROD_HOST=postgres
      - DB_XXROD_USERNAME=esq2025
      - DB_XXROD_PASSWORD=q
      # Messaging
      - AMQ_BROKER_URL=tcp://activemq:61616
      - XXROD_AUDIT_POOL_SIZE=${XXROD_AUDIT_POOL_SIZE:-8}
    command: ["java", "-jar", "app.jar"]
    depends_on:
      postgres:
        condition: service_healthy
      activemq:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    networks:
      - esquirenet

  keysmith:
    container_name: esq-keysmith
    build:
      context: .
    image: esquire.keysmith
    ports:
      - "3005:3005"
    environment:
      - KEYSMITH_PORT=3005
      - LOG_LEVEL_ROOT=ERROR
      - LOG_LEVEL_SF=ERROR
      - LOG_LEVEL_MIR0N=DEBUG
      - LOG_LEVEL_DEVELOP=DEBUG
      - LOG_LEVEL_MSG=DEBUG
      - DEVELOP_LOG_PATH=logs/keySmith-develop.log
      - MSG_LOG_PATH=logs/keySmith-msg.log
      - DB_KEYSMITH_VENDOR=dev-postgres
      - DB_KEYSMITH_PORT=5432
      - DB_KEYSMITH_NAME=esq2025
      #- DB_KEYSMITH_VENDOR=dev-oracle
      #- DB_KEYSMITH_PORT=1521
      #- DB_KEYSMITH_NAME=MIR0N
      - DB_KEYSMITH_HOST=postgres
      - DB_KEYSMITH_USERNAME=esq2025
      - DB_KEYSMITH_PASSWORD=q
      # Messaging
      - AMQ_BROKER_URL=tcp://activemq:61616
      #- AMQ_USER=
      #- AMQ_PASSWORD=
      - KEYSMITH_MESSAGING_CLIENT_ID=keysmith
      - KEYSMITH_CTRL_ID=keysmith.default
      # TEST race-8c repro ONLY (revert after): hold between path read and URQ publish
      - KEYSMITH_TEST_CONNECT_HOLD_MS=${KEYSMITH_TEST_CONNECT_HOLD_MS:-0}
      # v1.2.7 audit logging (x-rod). keySmith owns the auth UPDATE -> esq_auth_log.
      # Framework default is OFF (option-0); the demo turns it ON here.
      - KEYSMITH_AUDIT_ENABLED=${KEYSMITH_AUDIT_ENABLED:-true}
      # option (c): bus = publish to the audit queue (the xxRod service writes the *_log); in-process = (b).
      - KEYSMITH_AUDIT_MODE=${KEYSMITH_AUDIT_MODE:-bus}
      - KEYSMITH_AUDIT_POOL_SIZE=${KEYSMITH_AUDIT_POOL_SIZE:-4}
      - KEYSMITH_AUDIT_VIRTUAL_THREADS=${KEYSMITH_AUDIT_VIRTUAL_THREADS:-false}
      - KEYSMITH_AUDIT_FEED_CAPACITY=${KEYSMITH_AUDIT_FEED_CAPACITY:-4096}
      # (c) bus publisher pool: 0 = single feed-worker synchronous publish; N>0 = N async publisher threads.
      - KEYSMITH_AUDIT_PUBLISHER_POOL_SIZE=${KEYSMITH_AUDIT_PUBLISHER_POOL_SIZE:-0}
      # (d) redis (set KEYSMITH_AUDIT_MODE=redis): XADD each event to a Redis Stream. Lazy connect -> ignored unless mode=redis.
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - KEYSMITH_AUDIT_REDIS_STREAM=${KEYSMITH_AUDIT_REDIS_STREAM:-}
      - KEYSMITH_AUDIT_REDIS_MAX_LEN=${KEYSMITH_AUDIT_REDIS_MAX_LEN:-0}
      # (b) log datastore: shared (reuse service DB) | dedicated (separate pool/vendor via KEYSMITH_AUDIT_DB_*).
      - KEYSMITH_AUDIT_LOG_DATASTORE=${KEYSMITH_AUDIT_LOG_DATASTORE:-shared}
      # dedicated-only: the log DB may be a DIFFERENT vendor than the business DB.
      - KEYSMITH_AUDIT_DB_VENDOR=${KEYSMITH_AUDIT_DB_VENDOR:-dev-postgres}
      - KEYSMITH_AUDIT_DB_URL=${KEYSMITH_AUDIT_DB_URL:-}
      - KEYSMITH_AUDIT_DB_USERNAME=${KEYSMITH_AUDIT_DB_USERNAME:-esq2025}
      - KEYSMITH_AUDIT_DB_PASSWORD=${KEYSMITH_AUDIT_DB_PASSWORD:-q}
      - KEYSMITH_AUDIT_DB_POOL_SIZE=${KEYSMITH_AUDIT_DB_POOL_SIZE:-8}
    command: ["java", "-jar", "app.jar"]
    depends_on:
      postgres:
        condition: service_healthy
      activemq:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    networks:
      - esquirenet

  kcmaster:
    container_name: esq-kcmaster
    build:
      context: .
    image: esquire.kcmaster
    ports:
      - "3006:3006"
    environment:
      - KCMASTER_PORT=3006
      - LOG_LEVEL_ROOT=ERROR
      - LOG_LEVEL_SF=ERROR
      - LOG_LEVEL_MIR0N=DEBUG
      - LOG_LEVEL_DEVELOP=DEBUG
      - LOG_LEVEL_MSG=INFO
      - DEVELOP_LOG_PATH=logs/kcMaster-develop.log
      - MSG_LOG_PATH=logs/kcMaster-msg.log
      # Messaging
      - AMQ_BROKER_URL=tcp://activemq:61616
      #- AMQ_USER=
      #- AMQ_PASSWORD=
      - KCMASTER_SERVICE_ID=kc-sync
      - KCMASTER_CTRL_ID=kcmaster.default
      - KCMASTER_MESSAGING_CLIENT_ID=kcmaster
      # TEST race-8c repro ONLY (revert after): default 10000 (fix). -1 disables the buffer.
      - KCMASTER_PATH_BUFFER_TTL_MS=${KCMASTER_PATH_BUFFER_TTL_MS:-10000}
      # Keycloak
      - KC_BASE_URL=http://keycloak:8080/kc-auth
      - KC_REALM=esquire
      - KC_ADMIN_CLIENT_ID=esq-kcMaster
      - KC_ADMIN_CLIENT_SECRET=MHgq0Nu69u2uJ2johaK1wxQLMdakELXN
    command: ["java", "-jar", "app.jar"]
    depends_on:
      keycloak:
        condition: service_healthy
      activemq:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    networks:
      - esquirenet

  gateway:
    container_name: esq-gateway
    build:
      context: .
    image: esquire.gateway
    ports:
      - "7070:7070"
    healthcheck:
      # Use localhost:7070 because this command runs INSIDE the container
      test: ["CMD", "curl", "-f", "http://localhost:7070/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    environment:
      - GATEWAY_PORT=7070
      - LOG_LEVEL_DEVELOP=DEBUG
      - DEVELOP_LOG_PATH=logs/gateway-develop.log
      - BIZTREE_PORT=3002
      - BIZTREE_HOST=biztree
      - ENYMAN_PORT=3003
      - ENYMAN_HOST=enyman
      - PACMAN_PORT=3004
      - PACMAN_HOST=pacman
      - KEYSMITH_PORT=3005
      - KEYSMITH_HOST=keysmith
      - BACKEND_HOST=localhost
      - KEYCLOAK_HOST=host.docker.internal
      - KEYCLOAK_PORT=8081
      - KEYCLOAK_PATH=/kc-auth
      - KEYCLOAK_REALM=esquire
      - KEYCLOAK_CLIENT_ID=esq-angular
      - CORS_ALLOWED_ORIGINS=http://localhost:4200,http://localhost:3000
      - LOG_LEVEL_ROOT=ERROR
      - LOG_LEVEL_SF=ERROR
      - LOG_LEVEL_MIR0N=DEBUG
      - GW_SERVICE_METRICS_ENABLED=true
      # v1.2.4 JWE re-evaluation -- mounts the gateway RSA private key at the
      # path below; SecurityConfig switches to JweAwareJwtDecoder when present.
      # Blank/unset -> plain JWS decoder (v1.2.3 baseline).
      - ESQ_JWE_PRIVATE_KEY_PATH=/etc/esquire/jwe-private.pem
      # Vanilla Token Relay -- client sends HTTP Basic with its own
      # client_id:client_secret; gateway brokers a JWT from KC via the
      # client_credentials grant and caches it per client_id. Per-client
      # opt-in via the allowlist below.
      # Certified clients:
      #   esq-hauberk   -- Plain JWT (client carries Bearer JWT)
      #   esq-hauberk-S -- Vanilla Token Relay (client carries Basic; no token)
      # Use host.docker.internal:8081 (same URL as clients see) so KC token-exchange
      # iss validation matches between subject_token and gateway's call. Gateway
      # gets extra_hosts mapping below to resolve host.docker.internal.
      - ESQ_GW_TOKEN_URI=http://host.docker.internal:8081/kc-auth/realms/esquire/protocol/openid-connect/token
      - ESQ_GW_VANILLA_CLIENTS=esq-hauberk-S
      # Phantom Token Relay -- esq-hauberk-M presents a stripped JWT;
      # gateway exchanges it for a full JWT via RFC 8693 using the
      # esq-gw-exchange confidential client.
      - ESQ_GW_PHANTOM_CLIENTS=esq-hauberk-M
      - ESQ_GW_EXCHANGE_CLIENT_ID=esq-gw-exchange
      - ESQ_GW_EXCHANGE_CLIENT_SECRET=esq-gw-exchange-dev-secret-rotate-in-prod
    command: ["java", "-jar", "app.jar"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      keycloak:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ../gateway/conf:/etc/esquire:ro
    networks:
      - esquirenet

  backend:
    container_name: esq-backend
    build:
      context: ../../explorer
      dockerfile: backend/Dockerfile
    image: esquire.backend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      # NODE_ENV=development keeps session.cookie.secure=false so the cookie
      # works over plain HTTP on localhost:3000. Switch to "production" when
      # the deployment fronts the BFF with HTTPS (k8s ingress + cert-manager).
      - NODE_ENV=development
      # KC publishes its discovery URLs and "iss" claim using KC_HOSTNAME +
      # KC_HOSTNAME_PORT (set to localhost:8081 on the keycloak service). The
      # BFF discovers from the same URL so the "iss" the SPA receives matches
      # the one this container validates. extra_hosts below maps "localhost"
      # inside this container -> host gateway -> host port 8081 -> KC.
      - KC_ISSUER=http://localhost:8081/kc-auth/realms/esquire
      - KC_CLIENT_ID=esq-angular
      - KC_CLIENT_SECRET=esq-angular-bff-dev-secret-rotate-in-prod
      - GATEWAY_URL=http://gateway:7070
      - PUBLIC_BASE_URL=http://localhost:3000
      # Login from :4200 (ng serve dev container) lands back on :4200; from
      # :3000 (production-style baked SPA) lands back on :3000. Origins not
      # in this list (or absent referer/origin headers) fall back to PUBLIC_BASE_URL.
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:4200
      - SESSION_SECRET=esq-bff-dev-session-secret-rotate-in-prod
    extra_hosts:
      - "localhost:host-gateway"
    depends_on:
      gateway:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - esquirenet

  # Live-reload Angular dev container. Optional: skip this service on prod-like
  # runs by using `docker compose up backend` (or any subset that excludes
  # frontend). The :3000 backend image already bakes the Angular SPA, so the
  # dev server here is only useful when iterating on frontend code.
  frontend:
    container_name: esq-frontend
    build:
      context: ../../explorer/frontend
    image: esquire.frontend
    ports:
      - "4200:4200"
    command: >
      npx ng serve
      --host 0.0.0.0
      --port 4200
      --proxy-config proxy.conf.docker.json
      --poll 2000
    depends_on:
      backend:
        condition: service_started
    networks:
      - esquirenet

networks:
  esquirenet:
    driver: "bridge"

