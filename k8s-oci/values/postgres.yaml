# Prod overrides for k8s/charts/infra/postgres
image:
  repository: ghcr.io/mir0n-pro/esquire-postgres
  tag: "v1.2.4-2605.1621"
  pullPolicy: Always

storage:
  storageClass: oci-bv     # OCI Block Volume CSI driver
  size: 50Gi               # block volumes are billed; 50Gi is well within free 200Gi

# OCI Block Volume is ext4-formatted with a lost+found directory at the root.
# Postgres initdb refuses to use a non-empty mount point. Point PGDATA at a
# subdirectory of the mount instead. Local k8s has no lost+found, so this is
# unset there (template gates on truthy value).
pgdata: /var/lib/postgresql/data/pgdata

# db.password is passed via --set at install time
db:
  name: esq2025
  username: esq2025

nodeSelector:
  tier: infra
