spring:
  profiles:
    active: ${DB_PACMAN_VENDOR:dev-postgres}
  application:
    name: pacman
  activemq:
    broker-url: ${AMQ_BROKER_URL:tcp://localhost:61616}
    user: ${AMQ_USER:}
    password: ${AMQ_PASSWORD:}
    # Phase 1: no broker authorization required
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  mvc:
    problemdetails:
      enabled: true
# Messaging: entity broadcast producer
pacman:
  messaging:
    service-id: ${PACMAN_SERVICE_ID:entity-update-broadcast}
    ctrl-id: ${PACMAN_CTRL_ID:pacman.default}
    client-id: ${PACMAN_MESSAGING_CLIENT_ID:pacman}
  audit-logging:
    enabled: ${PACMAN_AUDIT_ENABLED:false}
    x-rod:
      # in-process = write the *_log here (option b); bus = publish to the audit queue, the standalone
      # xxRod service writes the *_log (option c).
      mode: ${PACMAN_AUDIT_MODE:in-process}
      # xx-rod consumer worker pool that writes the *_log tables; keep <= the log datastore pool.
      pool-size: ${PACMAN_AUDIT_POOL_SIZE:4}
      virtual-threads: ${PACMAN_AUDIT_VIRTUAL_THREADS:false}
      # xy-rod producer feed: per-tx buffer, flush after commit; bounded backlog before backpressure.
      feed-capacity: ${PACMAN_AUDIT_FEED_CAPACITY:4096}
      # (c) bus publisher (mode=bus only): 0 = single feed-worker synchronous publish (one JMS send per
      #   committed tx); N>0 = N async publisher threads over a dedicated useAsyncSend connection.
      bus:
        publisher-pool-size: ${PACMAN_AUDIT_PUBLISHER_POOL_SIZE:0}
      # (b) where the in-process xx-rod writes the *_log tables:
      #   shared    = reuse the service datasource + its Hikari pool (phase 1).
      #   dedicated = a separate pool / vendor, configured under log-db below (phase 2/3).
      log-datastore: ${PACMAN_AUDIT_LOG_DATASTORE:shared}
      # Read ONLY when log-datastore=dedicated. vendor selects the *_log SQL dialect
      # (dev-postgres -> INSERT..ON CONFLICT, dev-oracle -> MERGE) independently of the service's
      # own datasource -- so the log DB may be a DIFFERENT vendor than the business DB.
      log-db:
        vendor: ${PACMAN_AUDIT_DB_VENDOR:dev-postgres}
        url: ${PACMAN_AUDIT_DB_URL:}
        username: ${PACMAN_AUDIT_DB_USERNAME:esq2025}
        password: ${PACMAN_AUDIT_DB_PASSWORD:q}
        pool-size: ${PACMAN_AUDIT_DB_POOL_SIZE:8}
logging:
  level:
    root: ${LOG_LEVEL_ROOT:ERROR}
    org:
      springframework: ${LOG_LEVEL_SF:ERROR}
      springframework.jms: ${LOG_LEVEL_JMS:INFO}
      apache:
        activemq: ${LOG_LEVEL_AMQ:INFO}
    pro:
      mir0n: ${LOG_LEVEL_MIR0N:ERROR}
    develop: ${LOG_LEVEL_DEVELOP:DEBUG}
    msg: ${LOG_LEVEL_MSG:INFO}
  develop:
    log-path: ${DEVELOP_LOG_PATH:logs/pacMan-develop.log}
  msg:
    log-path: ${MSG_LOG_PATH:logs/pacMan-msg.log}

---
# Development Oracle
spring:
  config:
    activate:
      on-profile: dev-oracle
  datasource:
    url: jdbc:oracle:thin:@//${DB_PACMAN_HOST:localhost}:${DB_PACMAN_PORT:1521}/${DB_PACMAN_NAME:MIR0N}
    driverClassName: oracle.jdbc.OracleDriver
    username: ${DB_PACMAN_USERNAME:esq2025}
    password: ${DB_PACMAN_PASSWORD:q}   
    hikari:
      maximum-pool-size: 20
      minimum-idle: 20
      connection-timeout: 30000 
      max-lifetime: 1800000 
      idle-timeout: 600000    
  jpa:
    mapping-resources:
      - META-INF/oracle-acct.xml
      - META-INF/oracle-acct-transaction.xml
      - META-INF/oracle-roles.xml
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
server:
  port: ${PACMAN_PORT:3000}

---
# Development Postgres
spring:
  config:
    activate:
      on-profile: dev-postgres
  datasource:
    url: jdbc:postgresql://${DB_PACMAN_HOST:localhost}:${DB_PACMAN_PORT:5432}/${DB_PACMAN_NAME:esq2025}
    username: ${DB_PACMAN_USERNAME:esq2025}
    password: ${DB_PACMAN_PASSWORD:q}   
    hikari:
      maximum-pool-size: 20
      minimum-idle: 20
      connection-timeout: 30000 
      max-lifetime: 1800000 
      idle-timeout: 600000    
  jpa:
    mapping-resources:
      - META-INF/postgres-acct.xml
      - META-INF/postgres-acct-transaction.xml
      - META-INF/postgres-roles.xml
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
server:
  port: ${PACMAN_PORT:3000}
