# Esquire keep engine -- Spring core property (read once by SpringProperties at class-load; must be a
# classpath spring.properties, NOT application.yml).
#
# Oracle's JDBC driver throws ArrayIndexOutOfBoundsException from getParameterMetaData() when a NULL
# parameter is bound to a MERGE statement (an ojdbc parameter-metadata-parser bug). Spring calls
# getParameterMetaData() from StatementCreatorUtils.setNull() to discover the column type. The keep engine
# writes the *_log tables via MERGE on Oracle (the dialect's idempotent upsert), and audit events legitimately
# carry null fields (deletes, absent optional columns), so this bug fires on the bus -> auKeep -> Oracle path.
#
# The Spring-blessed workaround: skip the driver metadata query for null params and bind Types.NULL instead.
# Harmless on Postgres (its driver handles getParameterMetaData fine; this just takes a faster null path).
spring.jdbc.getParameterType.ignore=true
