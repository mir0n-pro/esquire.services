<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="608" height="240" font-family="Calibri, Segoe UI, sans-serif">
  <defs>
    <marker id="arw" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" refX="10" refY="4.5" orient="auto">
      <path d="M0,0 L10,4.5 L0,9 Z" fill="#6ca43d"/>
    </marker>
  </defs>
  <style>
    .state{fill:#5b9bd5;stroke:#41719c;stroke-width:1.5}
    .stt{fill:#ffffff;font-weight:bold;font-size:22px}
    .sts{fill:#eaf2fb;font-size:11.5px}
    .edge{stroke:#6ca43d;stroke-width:1.9;fill:none;marker-end:url(#arw)}
    .et{fill:#2b2b2b;font-size:13px}
    .es{fill:#57606a;font-size:11.5px}
    .title{fill:#1f3864;font-size:18px;font-weight:bold}
  </style>

  <text class="title" x="20" y="28">Connection flag  au_connect_flg  (N | Y)</text>

  <rect class="state" x="90"  y="118" width="160" height="72" rx="12"/>
  <text class="stt" x="170" y="152" text-anchor="middle">N</text>
  <text class="sts" x="170" y="174" text-anchor="middle">no KC identity</text>

  <rect class="state" x="510" y="118" width="160" height="72" rx="12"/>
  <text class="stt" x="590" y="152" text-anchor="middle">Y</text>
  <text class="sts" x="590" y="174" text-anchor="middle">KC identity exists</text>

  <path class="edge" d="M250,138 C 350,92 410,92 506,136"/>
  <text class="et" x="380" y="84" text-anchor="middle">admin activates</text>
  <text class="es" x="380" y="100" text-anchor="middle">KC user created (temp pwd "changeit", TOTP off)</text>

  <path class="edge" d="M510,176 C 410,222 350,222 254,178"/>
  <text class="et" x="380" y="234" text-anchor="middle">admin deactivates</text>
  <text class="es" x="380" y="250" text-anchor="middle">KC user deleted -- esq_usr entity stays in the tree</text>
</svg>
