apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-dashboards
  labels:
    app: {{ .Release.Name }}
data:
  # The dashboard provider: load any *.json in this dir under the "Esquire" folder.
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: Esquire
        orgId: 1
        folder: Esquire
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /etc/grafana/provisioning/dashboards
          foldersFromFilesStructure: false
  # The "Esquire Services" dashboard (REST / JVM / pool / CPU / bus / broker / biz), same as the docker stack.
  esquire-services.json: |-
{{ .Files.Get "dashboards/esquire-services.json" | indent 4 }}
  # The "Esquire Logging" dashboard (T9-B): volume by level/service, the error stream, and -- the point of it --
  # a correlationId box that narrows every panel to ONE request across every service it touched.
  esquire-logging.json: |-
{{ .Files.Get "dashboards/esquire-logging.json" | indent 4 }}
  # The "Esquire Topology" board (T9-C): the system as a picture -- every component, the bus lanes, live vitals.
  # Emitted by compose-compact/o11y/grafana/gen-topology.py, which writes one board per SHAPE. The chart file is
  # the local-k8s compact board; a caller that runs a different shape passes its own with
  # --set-file dashboardTopology=<path>, as the OKE super-compact launcher does (no auKeep, one lane).
  esquire-topology.json: |-
{{ (.Values.dashboardTopology | default (.Files.Get "dashboards/esquire-topology.json")) | indent 4 }}
