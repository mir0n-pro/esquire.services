# Oracle overlay for the main Esquire stack.
#
# Points the four data services (bizTree, enyMan, pacMan, keySmith) at a LOCAL Oracle that runs
# on the host, OUTSIDE docker (host.docker.internal:1521/MIR0N, esq2025/q) by activating the
# `dev-oracle` Spring profile. Everything else -- Keycloak (/kc-auth:8081 + realm import), kcMaster,
# ActiveMQ, the gateway, the BFF -- is inherited UNCHANGED from compose.yaml, so hauberk.properties
# and all smokes run exactly as on postgres; Oracle is the only variable.
#
# This is a compose OVERLAY, not a standalone stack -- always pass it together with the main file:
#
#   # bring the whole stack up on Oracle (postgres container is defined by compose.yaml but unused):
#   docker compose -f compose.yaml -f compose.oracle.yaml up -d --no-build \
#       --force-recreate biztree enyman pacman keysmith gateway
#
#   # roll back to postgres (recreate the same services WITHOUT this overlay):
#   docker compose -f compose.yaml up -d --no-build --force-recreate biztree enyman pacman keysmith gateway
#
# Notes:
#   - Oracle is external to docker; the host Oracle DB (schema + Test House seed) must be up + seeded.
#   - Recreating enyMan/keySmith gives them new container IPs, so the gateway is recreated too
#     (its cached upstream connection would otherwise go stale -- the docker connection-cache gotcha).
services:
  biztree:
    environment:
      - DB_BIZTREE_VENDOR=dev-oracle
      - DB_BIZTREE_HOST=host.docker.internal
      - DB_BIZTREE_PORT=1521
      - DB_BIZTREE_NAME=MIR0N
  enyman:
    environment:
      - DB_ENYMAN_VENDOR=dev-oracle
      - DB_ENYMAN_HOST=host.docker.internal
      - DB_ENYMAN_PORT=1521
      - DB_ENYMAN_NAME=MIR0N
  pacman:
    environment:
      - DB_PACMAN_VENDOR=dev-oracle
      - DB_PACMAN_HOST=host.docker.internal
      - DB_PACMAN_PORT=1521
      - DB_PACMAN_NAME=MIR0N
  keysmith:
    environment:
      - DB_KEYSMITH_VENDOR=dev-oracle
      - DB_KEYSMITH_HOST=host.docker.internal
      - DB_KEYSMITH_PORT=1521
      - DB_KEYSMITH_NAME=MIR0N
