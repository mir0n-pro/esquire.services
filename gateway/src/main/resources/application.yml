esquire:
  gateway:
    service-metrics:
      enabled: ${GW_SERVICE_METRICS_ENABLED:false} # Control whether to collect metrics for the gateway on backend services
server:
  port: ${GATEWAY_PORT:8080} 
spring:
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC
  webflux:
    problemdetails:
      enabled: true
  application:
    name: "gateway"
  cloud:
    gateway:
       #default-filters:
       #  - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST #RETAIN_UNIQUE
       # globalcors DISABLED — conflicts with custom SecurityWebFilterChain CORS
       # Spring Security handles CORS via spring.security.cors (see SecurityConfig.java)
       #globalcors:
       #  add-to-simple-url-handler-mapping: true
       #  cors-configurations:
       #    '[/**]':
       #      allowedOrigins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
       #      allowedHeaders: "*"
       #      allowedMethods: "*"
       routes:
        - id: keysmith-route
          uri: http://${KEYSMITH_HOST:biztree}:${KEYSMITH_PORT:3002}
          predicates:
            - Path=/esq-key
          metadata:
              allowedMethods:
                - GET
                - POST
          filters:
             #RETAIN_UNIQUE
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
            - RewritePath=/(?<segment>.*), /$\{segment}
            - TokenRelay=
        - id: biztree-route
          uri: http://${BIZTREE_HOST:biztree}:${BIZTREE_PORT:3002}
          predicates:
            - Path=/esq,/esq-path,/esq-enode
          metadata:
              allowedMethods:
                - GET
                - POST
          filters:
             #RETAIN_UNIQUE
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
            - RewritePath=/(?<segment>.*), /$\{segment}
            - TokenRelay=
        - id: pacman-route
          uri: http://${PACMAN_HOST:enyman}:${PACMAN_PORT:3003}
          predicates:
            - Path=/esq-cmd
            - EntityKind=isAcct
          metadata:
            allowedMethods:
              - GET
              - POST
          filters:
            #RETAIN_UNIQUE
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
            - RewritePath=/(?<segment>.*), /$\{segment}
            - TokenRelay=
        - id: enyman-route
          uri: http://${ENYMAN_HOST:enyman}:${ENYMAN_PORT:3003}
          predicates:
            - Path=/esq-cmd,/esq-dict,/esq-kinds
